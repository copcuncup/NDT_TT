const ndtChapterExpansion = JSON.parse(String.raw`{"ch1": [{"title": "จากรังสีอินฟราเรดสู่ Thermogram", "lead": "กล้องสร้างภาพจากความแตกต่างของรังสีที่ตรวจจับได้ ไม่ใช่ภาพของอุณหภูมิภายในโดยตรง", "body": "<p>พื้นผิวของวัตถุปล่อยรังสีอินฟราเรดออกมาอยู่ตลอดเวลา กล้องรับรังสีส่วนหนึ่งผ่านระบบเลนส์และตัวตรวจจับ แล้วแปลงสัญญาณหลายตำแหน่งเป็น <b>Thermogram</b> ซึ่งทำให้เห็นการกระจายของสัญญาณในรูปแบบสองมิติ</p><div class=\"deep-grid\"><div class=\"deep-card\"><b>สิ่งที่กล้องรับ</b><p>Radiation ที่ออกจากพื้นผิว ซึ่งอาจประกอบด้วยรังสีที่วัตถุปล่อยเองและรังสีจากสิ่งแวดล้อมที่สะท้อนหรือส่งผ่าน</p></div><div class=\"deep-card\"><b>สิ่งที่ภาพแสดง</b><p>ความแตกต่างของสัญญาณที่ถูกประมวลผลและแมปเป็นสีหรือระดับเทา</p></div></div><p>จึงต้องแยกคำว่า <b>Thermal Pattern</b> ออกจาก <b>True Surface Temperature</b> เพราะการประมาณอุณหภูมิต้องอาศัยพารามิเตอร์ เช่น Emissivity และ Reflected Apparent Temperature</p>", "note": "Thermogram คือภาพของข้อมูลรังสีที่กล้องตรวจจับและประมวลผล การอ่านสีเพียงอย่างเดียวไม่เพียงพอที่จะยืนยันอุณหภูมิจริง", "visual": "ch1_thermogram_path"}, {"title": "การใช้งาน Thermography ในงานอุตสาหกรรม", "lead": "ความผิดปกติทางความร้อนอาจเป็นสัญญาณเตือนของการทำงานที่เปลี่ยนไป", "body": "<p>การตรวจแบบ Condition Monitoring ใช้รูปแบบความร้อนเพื่อช่วยติดตามสภาพอุปกรณ์ก่อนเกิดความเสียหายรุนแรง ตัวอย่างที่พบได้ ได้แก่</p><ul><li><b>Electrical:</b> จุดต่อหรือส่วนประกอบที่ร้อนผิดจากบริเวณใกล้เคียงอาจบ่งชี้ความต้านทานหรือภาระที่แตกต่าง</li><li><b>Mechanical:</b> ความร้อนจากแรงเสียดทานหรือการทำงานผิดปกติของชุดหมุน</li><li><b>Building / HVAC:</b> ความแตกต่างของฉนวน การรั่วไหลของความร้อน และประสิทธิภาพของระบบปรับอากาศ</li><li><b>Process / Furnace:</b> ติดตามอุณหภูมิในกระบวนการผลิตและสภาวะของเตาหรือหม้อไอน้ำ</li></ul><p>นอกจากนี้ยังใช้ในงานวิจัยและพัฒนา การตรวจสอบคุณภาพ และการเฝ้าติดตามกระบวนการที่ต้องการข้อมูลอุณหภูมิแบบไม่สัมผัส</p><div class=\"warning-note\"><b>หลักการตีความ:</b> จุดร้อนเป็นเพียงข้อบ่งชี้ให้ตรวจสอบต่อ ต้องเปรียบเทียบกับภาระงาน รูปแบบอุปกรณ์ และเงื่อนไขการวัดก่อนสรุป</div>", "note": "Thermography ช่วยตรวจพบความแตกต่างทางความร้อน แต่ไม่สามารถระบุสาเหตุของความผิดปกติได้จากภาพเพียงอย่างเดียว", "visual": "ch1_industry_monitor"}, {"title": "เหตุใดโครงสร้าง Aerospace จึงใช้ Thermography?", "lead": "การเปลี่ยนแปลงของการแพร่ความร้อนอาจทำให้สภาพภายในบางชนิดปรากฏเป็น Pattern บนผิว", "body": "<p>โครงสร้าง Aerospace จำนวนหนึ่งใช้วัสดุ Composite และแผง Sandwich ที่มีผิวหน้า (Skin) ประกบแกนกลาง เช่น Honeycomb Core ความผิดปกติบางชนิดภายในอาจเปลี่ยนเส้นทางหรืออัตราการแพร่ของความร้อน และทำให้รูปแบบอุณหภูมิที่พื้นผิวตอบสนองต่างจากบริเวณอ้างอิง</p><ul><li><b>Water ingress:</b> น้ำที่ค้างในช่อง Core อาจมี Thermal Response ต่างจากช่องแห้ง</li><li><b>Composite repair:</b> รูปแบบการกระจายความร้อนอาจช่วยประเมินความสม่ำเสมอหรือความแตกต่างของบริเวณซ่อม</li><li><b>Subsurface condition:</b> สิ่งผิดปกติใต้ผิวอาจตรวจพบได้เมื่อมีการถ่ายเทความร้อนที่เหมาะสม</li></ul><p>ความสามารถในการตรวจขึ้นกับวัสดุ ความหนา โครงสร้าง Excitation ระยะเวลาเก็บภาพ และความลึกของสภาพที่ต้องการตรวจ ไม่ใช่ว่าความเสียหายทุกชนิดจะปรากฏบนพื้นผิวได้</p>", "note": "Thermography แสดงผลกระทบทางความร้อนที่ผิวหน้า ไม่ใช่ภาพภายในชิ้นงานแบบ X-ray", "visual": "ch1_honeycomb_thermal"}, {"title": "สามคุณสมบัติที่ทำให้ Thermography มีประโยชน์", "lead": "Non-contact, Two-dimensional และ Real-time ช่วยให้เห็นภาพรวมและติดตามการเปลี่ยนแปลงได้", "body": "<div class=\"deep-grid\"><div class=\"deep-card\"><b>1 · Non-contact</b><p>ไม่ต้องสัมผัสเป้าหมายโดยตรง ช่วยตรวจบริเวณที่เข้าถึงยากหรือมีความเสี่ยง เช่น ระบบไฟฟ้าแรงสูงและพื้นผิวร้อน</p></div><div class=\"deep-card\"><b>2 · Two-dimensional</b><p>ภาพเดียวมีข้อมูลหลายตำแหน่ง จึงมองเห็นความสัมพันธ์ของ Pattern และเปรียบเทียบหลายบริเวณได้</p></div><div class=\"deep-card\"><b>3 · Real-time</b><p>ติดตามการเปลี่ยนแปลงระหว่างการให้ความร้อน การเย็นตัว หรือการเคลื่อนที่ของเป้าหมายได้</p></div></div><p>ข้อดีเหล่านี้มาพร้อมข้อจำกัด: มุมมองและระยะทางต้องเหมาะสม พื้นผิวสะท้อนอาจรบกวน และการเคลื่อนไหวของเป้าหมายอาจทำให้ภาพไม่ตรงตำแหน่งกันเมื่อนำมาเปรียบเทียบ</p>", "note": "คุณสมบัติของวิธีช่วยเลือกงานที่เหมาะสม แต่ไม่ได้ยืนยันความถูกต้องของผลตรวจโดยอัตโนมัติ", "visual": "ch1_three_capabilities"}], "ch2": [{"title": "ส่วนประกอบของกล้องและหน้าที่ของแต่ละส่วน", "lead": "Optics, Filter, Detector และ Signal Processing ทำงานต่อเนื่องกันเพื่อสร้างภาพ", "body": "<ol><li><b>Lens / Window:</b> รวบรวมและโฟกัสรังสีอินฟราเรดจากเป้าหมาย ต้องใช้วัสดุที่ส่งผ่านช่วงคลื่นของกล้องได้</li><li><b>Filter:</b> จำกัดช่วงความยาวคลื่นที่ผ่านเข้าสู่ระบบในกล้องหรือการตรวจบางลักษณะ</li><li><b>Detector / FPA:</b> แปลงพลังงานรังสีที่ตกกระทบเป็นสัญญาณไฟฟ้าหรือการเปลี่ยนแปลงทางกายภาพที่ระบบอ่านได้</li><li><b>Signal Processing:</b> ประมวลผลสัญญาณและสร้างข้อมูลภาพสำหรับแต่ละ Pixel</li><li><b>Display / Storage:</b> แสดง Thermogram และบันทึกภาพหรือข้อมูลที่ใช้วิเคราะห์</li></ol><p>กล้องแต่ละรุ่นอาจมีเมนูและฟังก์ชันแตกต่างกัน ผู้ตรวจจึงต้องเข้าใจคู่มือของรุ่นที่ใช้งานจริง โดยเฉพาะช่วงวัด ข้อจำกัดการโฟกัส และการจัดเก็บข้อมูล</p>", "note": "คุณภาพภาพขึ้นกับทั้ง Optical System, Detector, Processing และการตั้งค่าของผู้ใช้", "visual": "ch2_camera_cutaway"}, {"title": "Temperature Range และการหลีกเลี่ยงภาพอิ่มตัว", "lead": "เลือกช่วงวัดให้ครอบคลุมอุณหภูมิเป้าหมายก่อนปรับการแสดงผล", "body": "<p><b>Temperature Range</b> คือช่วงอุณหภูมิที่กล้องหรือช่วงความไวที่เลือกไว้รองรับ หากเป้าหมายอยู่นอกช่วงที่เลือก สัญญาณอาจถูกแสดงเป็นค่าขอบเขตหรือไม่แสดงความแตกต่างภายในบริเวณนั้นได้อย่างเหมาะสม</p><ul><li>เริ่มจาก Range ที่ครอบคลุมอุณหภูมิที่คาดว่าจะพบ</li><li>ตรวจว่าบริเวณร้อนและเย็นสุดไม่ชนขอบช่วงจนรายละเอียดหาย</li><li>หลังได้ภาพที่ไม่อิ่มตัวแล้ว จึงใช้ Level และ Span เพื่อปรับ Contrast</li></ul><p>Range เป็นขีดความสามารถหรือโหมดการวัดของกล้อง ส่วน Level/Span เป็นการเลือกหน้าต่างการแสดงผลภายในข้อมูลที่มี อย่าสับสนสองสิ่งนี้</p>", "note": "หากข้อมูลอยู่นอกช่วงที่กล้องรองรับ การปรับ Palette หรือ Span ไม่สามารถสร้างข้อมูลที่ Detector ไม่ได้บันทึกกลับมาได้", "visual": "ch2_range_saturation"}, {"title": "ปรับ Level และ Span อย่างเป็นขั้นตอน", "lead": "เริ่มจากภาพรวม แล้วค่อยขยาย Contrast เฉพาะช่วงที่ต้องการวิเคราะห์", "body": "<ol><li><b>Auto Adjust:</b> ใช้เป็นจุดเริ่มต้นเพื่อให้กล้องจัดช่วง Level/Span โดยอัตโนมัติ</li><li><b>ตรวจจุดสนใจ:</b> ดูว่าองค์ประกอบสำคัญของชิ้นงานอยู่ในช่วงแสดงผลหรือไม่</li><li><b>ปรับ Level:</b> เลื่อนค่ากึ่งกลางของหน้าต่างขึ้นหรือลง เพื่อย้ายช่วงที่ถูกแมปเข้าสู่ Palette</li><li><b>ปรับ Span:</b> ลดความกว้างเพื่อเพิ่ม Contrast ในช่วงแคบ หรือเพิ่มความกว้างเพื่อแสดงความแตกต่างในช่วงอุณหภูมิกว้างขึ้น</li><li><b>ตรวจ Scale:</b> อ่านค่าขอบเขตบนและล่างเสมอเมื่อเปรียบเทียบภาพ</li></ol><p>โดยทั่วไป Display ที่ใช้ Palette จำนวนสีจำกัดจะแบ่งช่วงที่เลือกออกเป็นระดับสีต่าง ๆ การบีบ Span ทำให้ความแตกต่างเล็กภายในช่วงดูเด่นขึ้น แต่ก็ทำให้บางส่วนอยู่นอกช่วงสีได้</p>", "note": "Level/Span เปลี่ยนวิธีแสดงข้อมูล ไม่ได้ทำให้ชิ้นงานร้อนขึ้นหรือเย็นลง", "visual": "ch2_level_adjust"}, {"title": "Spot, Area และ Isotherm ใช้ตอบคำถามคนละแบบ", "lead": "เลือกเครื่องมือวัดตามลักษณะข้อมูลที่ต้องการ ไม่ใช้ค่าเดียวแทนทั้งภาพ", "body": "<div class=\"deep-grid\"><div class=\"deep-card\"><b>Spot Meter</b><p>อ่านค่าที่ตำแหน่งหรือ Pixel ที่เลือก เหมาะกับการตรวจจุดเฉพาะ แต่ต้องพิจารณาว่าเป้าหมายครอบคลุม Pixel มากพอหรือไม่</p></div><div class=\"deep-card\"><b>Area Measurement</b><p>คำนวณค่า Min, Max หรือ Average ภายในพื้นที่ที่กำหนด ค่าเฉลี่ยช่วยสรุปภาพรวมแต่สามารถซ่อนจุดร้อนหรือเย็นเฉพาะที่</p></div><div class=\"deep-card\"><b>Isotherm</b><p>เน้น Pixel ที่อยู่ในช่วงอุณหภูมิหรือช่วงสัญญาณที่กำหนด เพื่อช่วยระบุตำแหน่งของบริเวณที่สนใจ</p></div></div><p>ตัวอย่าง: เมื่อสำรวจแผงขนาดใหญ่ อาจใช้ Area เพื่อดูภาพรวม แล้วใช้ Spot ตรวจตำแหน่งเฉพาะ และใช้ Isotherm แสดงพื้นที่ที่เกิน Threshold ที่กำหนด การใช้เครื่องมือหลายชนิดต้องไม่ทำให้ลืมตรวจ Emissivity และ Reflection</p>", "note": "Spot = จุด, Area = สถิติของพื้นที่, Isotherm = การเน้นช่วงค่า", "visual": "ch2_measurement_tools"}, {"title": "Focus, ระยะ และ Image Composition", "lead": "ภาพคมชัดและมีขนาดเป้าหมายเหมาะสมจึงจะใช้วิเคราะห์รายละเอียดได้", "body": "<p><b>Optical Focus</b> ควบคุมการรวมภาพรังสีบน Detector หากโฟกัสคลาดเคลื่อน ขอบเขตของความร้อนจะฟุ้งและรายละเอียดเชิงพื้นที่ลดลง ซึ่งอาจทำให้ Spot Measurement และการสังเกต Pattern ไม่น่าเชื่อถือ</p><ul><li>จัดภาพให้ชิ้นงานและบริเวณตรวจอยู่ในกรอบโดยไม่ตัดรายละเอียดที่ต้องการ</li><li>เข้าใกล้ได้เมื่อปลอดภัยและไม่เปลี่ยนเงื่อนไขการวัดที่กำหนด</li><li>ใช้ระยะและมุมที่ทำให้ขนาดเป้าหมายครอบคลุม Pixel เพียงพอ</li><li>หลีกเลี่ยงการใช้ Digital Zoom แทน Optical Focus หรือ Spatial Resolution</li></ul>", "note": "ภาพที่ดูสวยไม่ได้แปลว่ารายละเอียดเชิงพื้นที่เพียงพอ ต้องพิจารณาขนาดเป้าหมายเทียบกับ Pixel Footprint", "visual": "ch2_focus_geometry"}, {"title": "Freeze, Review และ Save: ลำดับก่อนเก็บภาพ", "lead": "การตั้งค่าบางอย่างแก้ไขได้จำกัดหลัง Freeze หรือบันทึกภาพแล้ว", "body": "<ol><li><b>Live scan:</b> จัดตำแหน่ง ระยะ มุม และ Focus ในขณะเห็นภาพสด</li><li><b>ตรวจ Range:</b> ตรวจว่าช่วงวัดครอบคลุมเป้าหมาย</li><li><b>Freeze:</b> หยุดภาพเพื่อทบทวนและลดการเปลี่ยนแปลงระหว่างวิเคราะห์</li><li><b>Review:</b> ตรวจ Composition, Scale, Measurement Tools และข้อมูลที่ต้องเก็บ</li><li><b>Save:</b> บันทึกภาพพร้อมข้อมูลการตั้งค่าที่จำเป็น</li></ol><p>กล้องบางรุ่นไม่อนุญาตให้เปลี่ยน Focus, Composition หรือ Range หลัง Freeze/Save หรืออาจจำกัดการปรับ Level/Span ด้วย จึงต้องตั้งค่าหลักให้ถูกต้องก่อนบันทึก</p><p>เก็บภาพต้นฉบับและเลือกเก็บภาพวิเคราะห์แยกกันเมื่อระบบงานต้องการ เพื่อให้ตรวจสอบย้อนกลับได้</p>", "note": "ก่อน Save ให้ตรวจความคมชัด ช่วงวัด และองค์ประกอบภาพ ไม่ควรพึ่งการแก้ไขหลังบันทึก", "visual": "ch2_capture_review"}], "ch3": [{"title": "Heat, Temperature และ Thermal Energy แตกต่างกันอย่างไร", "lead": "อุณหภูมิเป็นตัวบอกระดับทางความร้อน ส่วน Heat เป็นพลังงานที่ถ่ายเทเพราะความต่างอุณหภูมิ", "body": "<p>ในเชิงโมเลกุล อนุภาคของสสารเคลื่อนที่และสั่นอยู่ตลอดเวลา อุณหภูมิสัมพันธ์กับระดับพลังงานจลน์เฉลี่ยของอนุภาค ขณะที่พลังงานภายในรวมของวัตถุขึ้นกับจำนวนอนุภาค ชนิดวัสดุ และสถานะของสสารด้วย</p><ul><li><b>Temperature:</b> ใช้บอกสภาวะร้อนหรือเย็น ไม่ใช่หน่วยพลังงาน</li><li><b>Heat:</b> พลังงานที่ถ่ายเทเมื่อมีความต่างอุณหภูมิ</li><li><b>Thermal energy:</b> พลังงานภายในที่เกี่ยวข้องกับการเคลื่อนที่และปฏิสัมพันธ์ของอนุภาค</li></ul><p>ตัวอย่าง: น้ำปริมาณน้อยและน้ำปริมาณมากอาจมีอุณหภูมิ 80°C เท่ากัน แต่พลังงานรวมที่เก็บอยู่ไม่เท่ากัน เพราะมีมวลต่างกัน</p>", "note": "อุณหภูมิเท่ากันไม่ได้หมายความว่ามีพลังงานความร้อนรวมเท่ากัน", "visual": "ch3_heat_temp"}, {"title": "Temperature Conversion และ Absolute Temperature", "lead": "การคำนวณกฎรังสีต้องใช้ Kelvin ไม่ใช่ Celsius", "body": "<div class=\"formula-box\">K = °C + 273.15</div><div class=\"formula-box\">°F = (1.8 × °C) + 32</div><div class=\"formula-box\">°C = (°F − 32) × 5/9</div><div class=\"formula-box\">°R = °F + 459.67</div><p><b>ตัวอย่าง:</b> 25°C = 298.15 K และ 77°F ส่วน 200 K เท่ากับประมาณ −73.15°C หรือ −99.67°F</p><p>Kelvin เป็น Absolute Scale ที่เริ่มจาก Absolute Zero ส่วน Celsius และ Fahrenheit เป็น Relative Scale ซึ่งมีจุดอ้างอิงต่างกัน ในสมการ Planck, Wien และ Stefan–Boltzmann ต้องใช้ค่าอุณหภูมิสัมบูรณ์</p><div class=\"warning-note\">ระวังค่าคงที่ในการแปลง: บางเอกสารเก่าใช้ 273.16 ในตัวอย่าง แต่การแปลงทั่วไปในระบบ SI ใช้ 273.15 ควรใช้ค่าตามโจทย์หรือมาตรฐานที่กำหนดให้สอดคล้องตลอดการคำนวณ</div>", "note": "ก่อนแทนค่าในสมการรังสี ให้แปลง Celsius เป็น Kelvin ทุกครั้ง", "visual": "ch3_temperature_scales"}, {"title": "Electromagnetic Spectrum และช่วง Infrared", "lead": "กล้อง Thermography ใช้ช่วงความยาวคลื่นที่สัมพันธ์กับการตอบสนองของ Detector และอุณหภูมิเป้าหมาย", "body": "<p>Infrared อยู่ถัดจาก Visible Light ทางด้านความยาวคลื่นที่ยาวกว่า โดยช่วงที่ใช้ในงาน Thermography ตามการแบ่งในบทเรียน ได้แก่</p><ul><li><b>Visible:</b> ประมาณ 0.4–0.7 µm</li><li><b>Near Infrared:</b> ประมาณ 0.8–1.7 µm</li><li><b>Short-Wave IR (SWIR):</b> ประมาณ 2–6 µm</li><li><b>Long-Wave IR (LWIR):</b> ประมาณ 8–14 µm</li></ul><p>กล้องไม่จำเป็นต้องตอบสนองตลอดทุกช่วง IR ชนิด Detector, Lens, Filter และอุณหภูมิเป้าหมายเป็นตัวกำหนดว่าช่วงใดเหมาะสมกว่า ช่วงใช้งานจริงต้องตรวจจากสเปกของกล้องแต่ละรุ่น</p>", "note": "Wavelength band เป็นส่วนหนึ่งของการเลือกกล้องและการกำหนดเงื่อนไขการวัด", "visual": "ch3_ir_spectrum"}, {"title": "Atmospheric Transmission และ Infrared Window", "lead": "บรรยากาศส่งผ่านรังสีได้ไม่เท่ากันทุกความยาวคลื่น", "body": "<p>รังสีอินฟราเรดจากเป้าหมายต้องเดินทางผ่านอากาศก่อนถึงกล้อง โมเลกุลในบรรยากาศ เช่น ไอน้ำและก๊าซบางชนิด ดูดกลืนรังสีบางช่วง ทำให้ Transmission เปลี่ยนตาม Wavelength และระยะทาง</p><p>บทเรียนชี้ถึงบริเวณการส่งผ่านต่ำประมาณ 5.5–7.5 µm โดยมีการดูดกลืนจากก๊าซในบรรยากาศ โดยเฉพาะไอน้ำในช่วงใกล้เคียง 6–8 µm</p><ul><li>การเลือก Spectral Band ต้องสัมพันธ์กับ Detector และ Optical Materials</li><li>การวัดระยะไกลมีโอกาสได้รับผลจาก Atmospheric Absorption มากขึ้น</li><li>อากาศระหว่างกล้องกับเป้าหมายไม่ใช่เส้นทางที่โปร่งใสสมบูรณ์ในทุกช่วงคลื่น</li></ul>", "note": "Transmission เป็นฟังก์ชันของ Wavelength และเส้นทางในบรรยากาศ ไม่ใช่ค่าคงที่เดียวสำหรับทุกการตรวจ", "visual": "ch3_atmosphere_graph"}, {"title": "Four Laws of Thermodynamics", "lead": "กฎทั้งสี่อธิบายสมดุล การอนุรักษ์พลังงาน ทิศทางการถ่ายเท และขีดจำกัดของอุณหภูมิ", "body": "<div class=\"deep-grid\"><div class=\"deep-card\"><b>Zeroth Law</b><p>หากระบบ A และ B อยู่ในสมดุลทางความร้อนกับระบบ C แล้ว A และ B อยู่ในสมดุลทางความร้อนต่อกัน เป็นพื้นฐานของการเปรียบเทียบอุณหภูมิ</p></div><div class=\"deep-card\"><b>First Law</b><p>พลังงานไม่ถูกสร้างหรือทำลาย แต่เปลี่ยนรูปหรือถ่ายเทได้ พลังงานที่เข้าสู่ระบบต้องสัมพันธ์กับการเปลี่ยนแปลงพลังงานของระบบ</p></div><div class=\"deep-card\"><b>Second Law</b><p>กระบวนการธรรมชาติมีทิศทาง ความร้อนถ่ายเทเองจากบริเวณร้อนกว่าไปยังเย็นกว่า และ Entropy ของระบบรวมมีแนวโน้มเพิ่มขึ้น</p></div><div class=\"deep-card\"><b>Third Law</b><p>เมื่อเข้าใกล้ Absolute Zero พฤติกรรมทางความร้อนมีขีดจำกัด ไม่สามารถทำให้ระบบไปถึง 0 K ได้ด้วยกระบวนการจำนวนจำกัด</p></div></div><p>สำหรับ Thermography กฎเหล่านี้ช่วยให้เข้าใจว่าทำไมจึงเกิด Thermal Gradient, เหตุใดความร้อนจึงไหลจากร้อนไปเย็น และเหตุใดสัญญาณในภาพจึงเปลี่ยนเมื่อสภาพแวดล้อมหรือชิ้นงานเปลี่ยน</p>", "note": "จำแนกหน้าที่ของแต่ละกฎ: equilibrium · energy conservation · direction/entropy · absolute-zero limit", "visual": "ch3_thermo_laws"}], "ch4": [{"title": "Conduction: ปัจจัยที่ควบคุมการนำความร้อน", "lead": "อัตราการนำความร้อนขึ้นกับวัสดุ พื้นที่ ความต่างอุณหภูมิ และระยะทางที่ความร้อนต้องเดินทาง", "body": "<p>Conduction เป็นการถ่ายเทพลังงานผ่านปฏิสัมพันธ์ระหว่างอนุภาคที่อยู่ใกล้กัน โดยไม่ต้องมีการเคลื่อนที่รวมของตัวกลางจากบริเวณหนึ่งไปอีกบริเวณหนึ่ง ในของแข็ง การนำความร้อนเป็นกลไกสำคัญที่ทำให้ความร้อนกระจายจากผิวเข้าสู่เนื้อวัสดุ</p><ul><li><b>Thermal conductivity (k):</b> ค่าสูงทำให้ถ่ายเทความร้อนได้ดีขึ้น</li><li><b>Area (A):</b> พื้นที่หน้าตัดมากขึ้น อัตราการถ่ายเทมากขึ้น</li><li><b>Temperature difference (ΔT):</b> ความต่างอุณหภูมิมากขึ้น อัตราการถ่ายเทมากขึ้น</li><li><b>Path length / Thickness (L):</b> ระยะทางมากขึ้น อัตราการถ่ายเทลดลง</li></ul><p>ตัวอย่างค่า k โดยประมาณในบทเรียน: Copper 401, Aluminium 237, Steel 52, Glass 0.9, Water 0.6 และ Air 0.025 W·m⁻¹·K⁻¹ ค่าจริงขึ้นกับชนิดวัสดุ อุณหภูมิ และสภาพของวัสดุ</p>", "note": "ค่าการนำความร้อนสูงไม่ได้แปลว่าวัสดุจะมีอุณหภูมิสูง แต่บอกความสามารถในการถ่ายเทพลังงานด้วยการนำ", "visual": "ch4_conduction_plate"}, {"title": "Fourier’s Law: คำนวณอัตราการนำความร้อน", "lead": "สมการแสดงแนวโน้มการไหลของความร้อนผ่านแผ่นภายใต้สมมติฐาน Steady-State", "body": "<div class=\"formula-box\">Q̇ = k A (T₁ − T₂) / L</div><p>โดย Q̇ คืออัตราการถ่ายเทความร้อน (W), k คือ Thermal Conductivity (W·m⁻¹·K⁻¹), A คือพื้นที่หน้าตัด (m²), ΔT คือความต่างอุณหภูมิ (K) และ L คือความหนาหรือระยะทางการนำ (m)</p><p><b>ตัวอย่าง:</b> แผ่นเหล็ก k = 52 W·m⁻¹·K⁻¹, A = 1 m², ΔT = 70 K และ L = 0.05 m</p><div class=\"formula-box\">Q̇ = (52 × 1 × 70) / 0.05 = 72,800 W = 72.8 kW</div><p>ตัวเลขนี้คืออัตราการถ่ายเทความร้อนตามแบบจำลอง ไม่ใช่ค่าอุณหภูมิที่กล้องอินฟราเรดอ่านได้ และการใช้สูตรนี้ต้องพิจารณาสภาวะคงตัวและเรขาคณิตอย่างเหมาะสม</p>", "note": "อย่าสับสนระหว่าง Q̇ (W) ซึ่งเป็นอัตราการถ่ายเท กับ Q (J) ซึ่งเป็นปริมาณพลังงาน", "visual": "ch4_fourier_plate"}, {"title": "Steady-State, Transient และ Thermal Equilibrium", "lead": "สามคำนี้อธิบายสภาวะที่ต่างกันและไม่ควรใช้แทนกัน", "body": "<div class=\"deep-grid\"><div class=\"deep-card\"><b>Steady-State</b><p>อุณหภูมิ ณ ตำแหน่งต่าง ๆ ไม่เปลี่ยนตามเวลา และอัตราการถ่ายเทความร้อนคงที่ แม้ยังมีความต่างอุณหภูมิระหว่างสองด้านของวัสดุได้</p></div><div class=\"deep-card\"><b>Transient</b><p>อุณหภูมิเปลี่ยนแปลงตามเวลา เช่น ชิ้นงานกำลังร้อนขึ้นหรือเย็นลง รูปแบบภาพจึงขึ้นกับเวลาที่บันทึก</p></div><div class=\"deep-card\"><b>Thermal Equilibrium</b><p>ไม่มีความต่างอุณหภูมิสุทธิระหว่างระบบที่สัมผัสกัน จึงไม่มีการถ่ายเทความร้อนสุทธิระหว่างกัน</p></div></div><p>การตรวจแบบ Active Thermography มักติดตาม Transient Response หลังให้พลังงาน ส่วนการใช้ Fourier’s Law ในรูปแบบพื้นฐานมักอธิบายการนำความร้อนแบบ Steady-State</p>", "note": "Steady-State ยังมี Heat Flow ได้ แต่ Thermal Equilibrium ไม่มี Heat Flow สุทธิจากความต่างอุณหภูมิ", "visual": "ch4_steady_transient"}, {"title": "Thermal Capacity และ Specific Heat", "lead": "วัสดุที่มีความสามารถเก็บพลังงานความร้อนสูงจะเปลี่ยนอุณหภูมิช้ากว่าเมื่อได้รับพลังงานเท่ากัน", "body": "<p><b>Heat Capacity (C)</b> คือพลังงานที่ต้องใช้เพื่อเพิ่มอุณหภูมิของวัตถุ 1 K มีหน่วย J/K และขึ้นกับทั้งชนิดวัสดุและปริมาณของวัตถุ</p><div class=\"formula-box\">Q = C ΔT = m c ΔT</div><p><b>Specific Heat (c)</b> คือความจุความร้อนต่อหน่วยมวล มีหน่วย J·kg⁻¹·K⁻¹</p><p>ตัวอย่างค่า c โดยประมาณ: Copper 390, Aluminium 900, Steel 460, Water 4180 และ Air 1000 J·kg⁻¹·K⁻¹ (ค่าตามเงื่อนไขอ้างอิงในบทเรียน)</p><p>น้ำมี Specific Heat สูง จึงต้องรับพลังงานมากเพื่อเพิ่มอุณหภูมิ 1 K เมื่อเทียบกับวัสดุบางชนิดที่มีมวลเท่ากัน สิ่งนี้ทำให้รูปแบบการร้อนและเย็นของระบบที่มีของเหลวแตกต่างจากผนังหรือโครงสร้างโดยรอบ</p>", "note": "Heat Capacity เป็นคุณสมบัติของวัตถุ ส่วน Specific Heat เป็นคุณสมบัติต่อหน่วยมวลของวัสดุ", "visual": "ch4_heat_capacity"}, {"title": "Volumetric Heat Capacity และ Thermal Inertia", "lead": "พิจารณาความสามารถเก็บพลังงานต่อปริมาตรควบคู่กับการนำความร้อน", "body": "<div class=\"formula-box\">Volumetric Heat Capacity = ρ c</div><p>ρc มีหน่วย J·m⁻³·K⁻¹ และบอกความสามารถของวัสดุต่อปริมาตรในการเก็บพลังงาน เมื่อพิจารณาร่วมกับ Thermal Conductivity (k) จะอธิบายการตอบสนองต่อการเปลี่ยนแปลงทางความร้อนได้ดีขึ้น</p><div class=\"formula-box\">Thermal Inertia (ตามรูปแบบในบทเรียน): I = √(k · ρc)</div><p>วัสดุที่มี Thermal Inertia สูงมักต้านทานการเปลี่ยนแปลงอุณหภูมิที่ผิวได้มากกว่า จึงมี Response ที่เปลี่ยนช้ากว่าเมื่อได้รับการกระตุ้นแบบเดียวกัน</p><p>ตัวอย่างเชิงภาพ: ผนังหรือแผงที่มีของเหลวอยู่ด้านหลังอาจแสดงรูปแบบการร้อนและการเย็นต่างจากบริเวณที่ไม่มีของเหลว เพราะของเหลวมีความสามารถเก็บพลังงานต่อปริมาตรสูง</p>", "note": "Thermal Inertia ไม่ใช่อุณหภูมิ แต่เป็นการรวมผลของการนำและความสามารถเก็บพลังงาน", "visual": "ch4_inertia_compare"}, {"title": "Thermal Diffusivity: ความเร็วของการกระจายอุณหภูมิ", "lead": "Diffusivity บอกว่าการเปลี่ยนแปลงทางความร้อนแพร่กระจายเข้าเนื้อวัสดุได้รวดเร็วเพียงใด", "body": "<div class=\"formula-box\">α = k / (ρ c)</div><p>Thermal Diffusivity (α) มีหน่วย m²/s โดย k คือ Thermal Conductivity, ρ คือ Density และ c คือ Specific Heat</p><ul><li>k สูงช่วยให้พลังงานเคลื่อนผ่านวัสดุได้ดีขึ้น</li><li>ρc สูงหมายถึงวัสดุเก็บพลังงานต่อปริมาตรมาก จึงมีแนวโน้มให้การเปลี่ยนแปลงอุณหภูมิแพร่ช้าลง</li><li>α สูงหมายถึงความเปลี่ยนแปลงของอุณหภูมิกระจายตัวได้เร็วกว่า ภายใต้เงื่อนไขที่เปรียบเทียบได้</li></ul><p>ค่า α มีความสำคัญต่อการกำหนดเวลาสังเกตในงาน Transient/Active Thermography เพราะวัสดุที่แตกต่างกันตอบสนองต่อ Excitation ในช่วงเวลาไม่เท่ากัน</p>", "note": "Thermal Diffusivity เป็นอัตราการแพร่การเปลี่ยนแปลงของอุณหภูมิ ไม่ใช่ค่าความเร็วของอนุภาค", "visual": "ch4_diffusivity"}, {"title": "Convection, Newton’s Law และผลของลม", "lead": "การเคลื่อนที่ของอากาศหรือของเหลวสามารถเปลี่ยนรูปแบบอุณหภูมิของผิวได้อย่างชัดเจน", "body": "<p>Convection คือการถ่ายเทความร้อนระหว่างผิวกับของไหลที่มีการเคลื่อนที่ แบ่งเป็น Natural/Free Convection จากแรงลอยตัวและความต่างความหนาแน่น และ Forced Convection จากพัดลม ปั๊ม หรือลม</p><div class=\"formula-box\">Q̇ = h A (Tsurface − Tfluid)</div><p>h คือ Convective Heat Transfer Coefficient (W·m⁻²·K⁻¹) ซึ่งเปลี่ยนตามความเร็วของไหล รูปทรง และสภาพการไหล</p><p>ใกล้ผิวจะมี <b>Boundary Layer</b> ซึ่งความเร็วของไหลลดลงจนเป็นศูนย์ที่ผิว เมื่อความเร็วลมสูงขึ้น Boundary Layer มักบางลงและการพาความร้อนเพิ่มขึ้น ทำให้ผิวเย็นหรือร้อนเร็วขึ้นได้</p><p>ดังนั้นลมจากประตูโรงเก็บเครื่องบิน พัดลม หรือช่องระบายอากาศอาจสร้าง Thermal Pattern ที่ไม่เกี่ยวกับความผิดปกติภายในชิ้นงานโดยตรง</p>", "note": "ควบคุมหรือตรวจบันทึกสภาพลม เพราะ Forced Convection เปลี่ยน Thermal Response ของพื้นผิวได้", "visual": "ch4_convection_boundary"}, {"title": "Evaporation, Condensation และ Latent Heat", "lead": "การเปลี่ยนสถานะถ่ายเทพลังงานได้โดยอุณหภูมิระหว่างการเปลี่ยนสถานะอาจไม่เปลี่ยน", "body": "<p><b>Evaporation:</b> ของเหลวเปลี่ยนเป็นแก๊สและดูดพลังงานจากบริเวณรอบข้าง จึงทำให้พื้นผิวเย็นลงได้ <b>Condensation:</b> ไอน้ำเปลี่ยนเป็นของเหลวและปล่อยพลังงานแฝงออกมา</p><p><b>Latent Heat</b> คือพลังงานที่ใช้หรือปล่อยระหว่างการเปลี่ยนสถานะโดยไม่จำเป็นต้องทำให้อุณหภูมิเปลี่ยนในช่วงที่เกิด Phase Change</p><ul><li>Melting / Fusion: ของแข็ง → ของเหลว</li><li>Freezing / Solidification: ของเหลว → ของแข็ง</li><li>Vaporization: ของเหลว → แก๊ส</li><li>Condensation: แก๊ส → ของเหลว</li><li>Sublimation / Deposition: ของแข็ง ↔ แก๊ส</li></ul><p>ความชื้นที่ระเหยบนพื้นผิวอาจทำให้เกิดบริเวณเย็น ขณะที่การควบแน่นอาจปล่อยความร้อน จึงต้องพิจารณาสภาพเปียกชื้นร่วมกับรูปแบบที่เห็นเสมอ</p>", "note": "บริเวณเย็นไม่ได้แปลว่ามี Defect เสมอไป อาจเกิดจาก Evaporation หรือผลของความชื้น", "visual": "ch4_latent_phase"}], "ch5": [{"title": "Radiation Heat Transfer: การส่งผ่านพลังงานด้วยคลื่น", "lead": "รังสีถ่ายเทพลังงานได้โดยไม่ต้องมีตัวกลางและเกิดขึ้นได้ในสุญญากาศ", "body": "<p>Radiation เป็นการถ่ายเทพลังงานด้วยคลื่นแม่เหล็กไฟฟ้า วัตถุทุกชนิดที่มีอุณหภูมิสูงกว่า Absolute Zero จะมีการแผ่รังสี การถ่ายเทพลังงานแบบรังสีต่างจาก Conduction และ Convection เพราะไม่จำเป็นต้องอาศัยการสัมผัสหรือการเคลื่อนที่ของของไหล</p><ul><li>รังสีเดินทางด้วยความเร็วแสง</li><li>การรับรังสีจากเป้าหมายขึ้นกับ Line of Sight และการส่งผ่านของตัวกลาง</li><li>การแผ่รังสีขึ้นกับอุณหภูมิและคุณสมบัติของพื้นผิว</li><li>Radiation Exchange เกิดร่วมกับการดูดกลืน การสะท้อน และการส่งผ่านได้</li></ul><p>กล้อง Infrared รับรังสีที่เข้าสู่ Optical System ดังนั้นการจัดแนวกล้อง แหล่งร้อนรอบข้าง และพื้นผิวที่สะท้อนจึงสำคัญ</p>", "note": "Radiation ไม่จำเป็นต้องมีตัวกลาง แต่การวัดจริงยังได้รับผลจากบรรยากาศและวัตถุในแนวสายตา", "visual": "ch5_radiation_vacuum"}, {"title": "Incident Radiation: พลังงานที่ตกกระทบพื้นผิว", "lead": "รังสีที่ตกกระทบแบ่งเป็นส่วนดูดกลืน สะท้อน และส่งผ่าน", "body": "<p>Incident Radiation คือรังสีทั้งหมดที่ตกกระทบพื้นผิวจากแหล่งรอบข้าง เมื่อรังสีมาถึงพื้นผิว พลังงานจะถูกแบ่งเป็น 3 ส่วน ได้แก่ Absorbed, Reflected และ Transmitted</p><div class=\"formula-box\">α + ρ + τ = 1</div><ul><li><b>Absorptivity (α):</b> สัดส่วนที่ถูกดูดกลืน</li><li><b>Reflectivity (ρ):</b> สัดส่วนที่สะท้อนกลับ</li><li><b>Transmissivity (τ):</b> สัดส่วนที่ผ่านวัสดุไป</li></ul><p>สัมประสิทธิ์ทั้งสามเป็นสัดส่วนของ Incident Radiation ภายใต้เงื่อนไขที่กำหนด ไม่ใช่ค่าอุณหภูมิของวัตถุ และต้องใช้ช่วงคลื่น/ทิศทางที่สอดคล้องกันเมื่อเปรียบเทียบ</p>", "note": "ผลรวม α + ρ + τ เท่ากับ 1 ในสมดุลพลังงานของรังสีตกกระทบตามแบบจำลองนี้", "visual": "ch5_incident_partition"}, {"title": "Specular และ Diffuse Reflection", "lead": "ความเรียบและความขรุขระของผิวมีผลต่อทิศทางที่รังสีสะท้อน", "body": "<div class=\"deep-grid\"><div class=\"deep-card\"><b>Specular Reflection</b><p>พื้นผิวเรียบเมื่อเทียบกับลักษณะคลื่น ทำให้เกิดการสะท้อนแบบเป็นทิศทาง โดยมุมสะท้อนเท่ากับมุมตกกระทบ</p></div><div class=\"deep-card\"><b>Diffuse Reflection</b><p>พื้นผิวขรุขระทำให้รังสีสะท้อนกระจายหลายทิศทาง ไม่ได้สะท้อนเป็นลำไปในทิศทางเดียว</p></div></div><p>พื้นผิวจริงจำนวนมากมีองค์ประกอบทั้งสองแบบ การสะท้อนจากแหล่งร้อน เช่น หลอดไฟ เตา หรือผู้ตรวจ อาจเข้ากล้องและสร้างจุดร้อนปรากฏบน Thermogram แม้ว่าพื้นที่นั้นจะไม่ได้มีอุณหภูมิสูงตามภาพที่เห็น</p>", "note": "เมื่อพบ Reflection ให้พิจารณามุมมองและแหล่งรังสีรอบข้างก่อนตีความจุดร้อน", "visual": "ch5_reflection_modes"}, {"title": "Exitant Radiation และ Emissivity", "lead": "รังสีที่ออกจากพื้นผิวอาจมาจากการปล่อยเอง การสะท้อน และการส่งผ่าน", "body": "<p><b>Exitant Radiation</b> คือรังสีทั้งหมดที่ออกจากพื้นผิว ไม่ว่าจะมีต้นกำเนิดจากวัตถุเองหรือมาจากแหล่งอื่น โดยอธิบายเป็น 3 ส่วนหลัก</p><ul><li><b>Emission:</b> รังสีที่วัตถุปล่อยออกมาเอง และสัมพันธ์กับอุณหภูมิและ Emissivity</li><li><b>Reflection:</b> รังสีจากสิ่งแวดล้อมที่สะท้อนออกจากผิว</li><li><b>Transmission:</b> รังสีจากด้านหลังที่ผ่านวัสดุออกมา</li></ul><p><b>Emissivity (ε)</b> เป็นอัตราส่วนความสามารถในการแผ่รังสีของพื้นผิวเมื่อเทียบกับ Blackbody ภายใต้เงื่อนไขเดียวกัน ค่ามีตั้งแต่ 0 ถึง 1 และพื้นผิวที่มี ε สูงจะมีสัดส่วนการปล่อยรังสีจากตัวเองมากกว่าเมื่อเทียบกับผิว ε ต่ำที่อุณหภูมิเดียวกัน</p><p>สำหรับวัตถุ Opaque ที่ τ≈0 และใช้ความสัมพันธ์ Kirchhoff ภายใต้เงื่อนไขที่เหมาะสม จะได้ ε≈α และ ε+ρ≈1</p>", "note": "กล้องมองเห็น Exitant Radiation ไม่ใช่ Emission ของเป้าหมายเพียงอย่างเดียว", "visual": "ch5_exitant_emission"}, {"title": "Planck’s Law: รูปร่างสเปกตรัมของ Blackbody", "lead": "การแผ่รังสีของ Blackbody เปลี่ยนไปตามทั้งความยาวคลื่นและอุณหภูมิ", "body": "<p>Planck’s Radiation Law อธิบาย Spectral Radiance ของ Blackbody เป็นฟังก์ชันของ Wavelength และ Absolute Temperature กราฟจึงไม่ได้เป็นเส้นคงที่เมื่ออุณหภูมิเปลี่ยน</p><ul><li>เมื่ออุณหภูมิสูงขึ้น Radiance เพิ่มขึ้นในหลายช่วงคลื่น</li><li>ยอดกราฟ (Peak) เลื่อนไปทางความยาวคลื่นที่สั้นลง</li><li>พื้นที่ใต้กราฟสัมพันธ์กับพลังงานรังสีรวมที่แผ่ออกมา</li></ul><p>Blackbody เป็นแบบจำลองอุดมคติที่ดูดกลืนรังสีตกกระทบทั้งหมดและมี Emissivity เท่ากับ 1 พื้นผิวจริงมีพฤติกรรมแตกต่างและอาจขึ้นกับ Wavelength, Direction และสภาพผิว</p><p>การเลือกกล้องช่วง MWIR หรือ LWIR จึงเกี่ยวข้องกับอุณหภูมิเป้าหมายและ Spectral Response ของ Detector รวมทั้งข้อจำกัดของระบบออปติก</p>", "note": "Planck อธิบายการกระจายรังสีตามความยาวคลื่น ไม่ใช่แค่ค่ารังสีรวม", "visual": "ch5_planck_spectra"}, {"title": "Wien และ Stefan–Boltzmann: Peak กับพลังงานรวม", "lead": "กฎสองข้อนี้อธิบายคนละลักษณะของการแผ่รังสีและต้องใช้ Kelvin", "body": "<div class=\"formula-box\">Wien: λmax = 2898 / T   (µm·K)</div><p>Wien’s Displacement Law แสดงความสัมพันธ์ผกผันระหว่างอุณหภูมิสัมบูรณ์กับความยาวคลื่นที่มี Spectral Emission สูงสุด เมื่ออุณหภูมิสูงขึ้น Peak จะเลื่อนไปทาง Wavelength ที่สั้นลง</p><div class=\"formula-box\">Stefan–Boltzmann: Wb = σ T⁴</div><p>Stefan–Boltzmann Law ใช้คำนวณ Total Blackbody Emissive Power ต่อหน่วยพื้นที่ โดย σ = 5.670 × 10⁻⁸ W·m⁻²·K⁻⁴ และ T ต้องอยู่ใน Kelvin</p><div class=\"deep-grid\"><div class=\"deep-card\"><b>Wien</b><p>ตอบว่า Peak อยู่ที่ความยาวคลื่นใด</p></div><div class=\"deep-card\"><b>Stefan–Boltzmann</b><p>ตอบว่าพลังงานรังสีรวมต่อพื้นที่มีค่าเท่าใด</p></div></div><p>สำหรับ Greybody มักใช้ Emissivity คูณกับ Blackbody Exitance ภายใต้สมมติฐานที่เหมาะสม แต่การคำนวณจากกล้องจริงยังต้องพิจารณา Spectral Response และรังสีจากสิ่งแวดล้อม</p>", "note": "Wien ใช้หา Peak Wavelength ส่วน Stefan–Boltzmann ใช้หาพลังงานรังสีรวมต่อพื้นที่", "visual": "ch5_wien_stefan"}], "ch6": [{"title": "Optical System, Filter และ Detector Array", "lead": "กล้องรับรังสีผ่านเลนส์และตัวกรองก่อนโฟกัสลงบน Focal Plane Array", "body": "<p>รังสีอินฟราเรดเข้าสู่กล้องผ่าน Window หรือ Lens ซึ่งต้องส่งผ่านช่วงคลื่นใช้งานได้ จากนั้นระบบ Baffle และ Filter อาจช่วยลดหรือเลือกช่วงคลื่น ก่อนที่เลนส์จะโฟกัสรังสีไปยัง <b>Focal Plane Array (FPA)</b></p><ul><li><b>Optics:</b> รวบรวมและสร้างภาพบน Detector</li><li><b>Infrared Filter:</b> ควบคุมช่วง Wavelength ที่เข้าสู่ระบบ</li><li><b>FPA:</b> Detector จำนวนมากเรียงเป็น Array เพื่อรับสัญญาณหลายตำแหน่ง</li><li><b>Processing:</b> ปรับแก้และแปลงสัญญาณไปเป็น Pixel สำหรับ Display</li></ul><p>วัสดุเลนส์/Window ต้องเหมาะกับ Infrared Band เช่น Germanium หรือ Zinc Selenide ในการใช้งานบางประเภท การทำความสะอาดต้องใช้วิธีตามผู้ผลิต เพราะผิวเลนส์และ Coating อาจเสียหายได้</p>", "note": "Visible-light glass ทั่วไปไม่ได้ส่งผ่าน Infrared ทุกช่วงคลื่น จึงต้องใช้ Optical Materials ที่เหมาะกับ Band", "visual": "ch6_optical_path"}, {"title": "Infrared Filters: High-pass, Low-pass, Band-pass และ Band-stop", "lead": "Filter เปลี่ยนช่วงคลื่นที่ยอมให้ผ่านเข้าสู่ Detector", "body": "<div class=\"deep-grid\"><div class=\"deep-card\"><b>High-pass</b><p>ยอมให้ความถี่สูงหรือความยาวคลื่นสั้นกว่าขอบที่กำหนดผ่านได้</p></div><div class=\"deep-card\"><b>Low-pass</b><p>ยอมให้ความถี่ต่ำหรือความยาวคลื่นยาวกว่าขอบที่กำหนดผ่านได้</p></div><div class=\"deep-card\"><b>Band-pass</b><p>ยอมให้ช่วง Wavelength ระหว่างขอบสองด้านผ่าน</p></div><div class=\"deep-card\"><b>Band-stop</b><p>ลดหรือปิดกั้นช่วง Wavelength ที่ต้องการตัดออก</p></div></div><p>ตัวอย่างการใช้งานคือการใช้ High-temperature Filter เพื่อลดผลของรังสีจากเปลวไฟในบางงาน โดยเลือกช่วงคลื่นที่ช่วยให้มองเห็นเป้าหมายได้ดีขึ้น Filter มี Transmission Characteristic ของตัวเอง และอาจต้องชดเชยการส่งผ่านตามระบบกล้อง</p>", "note": "การเรียก High-pass/Low-pass ต้องระวังว่า Filter อธิบายตาม Frequency หรือ Wavelength ซึ่งมีทิศทางผกผันกัน", "visual": "ch6_filter_response"}, {"title": "Visible Image กับ Infrared Image ต่างกันอย่างไร", "lead": "ดวงตามนุษย์อาศัยแสงที่สะท้อน ส่วนกล้องอินฟราเรดตรวจจับรังสีความร้อนที่ออกจากพื้นผิว", "body": "<p>ภาพ Visible ที่ตามองเห็นโดยทั่วไปเกิดจากแสงที่ตกกระทบแล้วสะท้อนจากวัตถุ ส่วนกล้อง Infrared ตรวจจับรังสีในช่วงคลื่นที่ระบบตอบสนอง โดยรังสีที่เข้าสู่กล้องอาจมีทั้งส่วนที่วัตถุแผ่ออกมาและส่วนที่สะท้อนจากสิ่งแวดล้อม</p><ul><li>สี Visible ไม่สามารถใช้ทำนาย Emissivity ใน Infrared ได้โดยตรง</li><li>พื้นผิว Emissivity สูงมักมีสัดส่วน Reflection ต่ำกว่าในเงื่อนไขที่สอดคล้องกัน</li><li>พื้นผิว Emissivity ต่ำไวต่อ Reflection จากแหล่งร้อน/เย็นรอบข้างมากขึ้น</li></ul><p>ดังนั้นอย่าสรุปว่าแผ่นโลหะที่มองเห็นเป็นสีดำหรือสีเงินจะมี Emissivity เท่าใดจากสีที่เห็นด้วยตา ต้องอ้างอิงช่วงคลื่น สภาพผิว และวิธีการวัดที่เหมาะสม</p>", "note": "Visible Color ≠ Infrared Emissivity และ IR Image ไม่ใช่ภาพสะท้อนแสงที่ตามองเห็น", "visual": "ch6_visible_ir_compare"}, {"title": "Pixel, Spatial Resolution และ Digital Zoom", "lead": "Pixel เป็นหน่วยพื้นที่ภาพ และจำนวน Pixel มีผลต่อรายละเอียดเชิงพื้นที่", "body": "<p>Thermal Image ประกอบด้วย Pixel จำนวนมาก แต่ละ Pixel แทนสัญญาณจากพื้นที่เชิงมุมหนึ่งส่วนของภาพ กล้องที่มีจำนวน Pixel มากขึ้นอาจแยกวัตถุขนาดเล็กได้ดีขึ้นเมื่อ Optical System และเงื่อนไขอื่นเหมาะสม</p><ul><li>320 × 240 = 76,800 Pixels</li><li>640 × 480 = 307,200 Pixels</li><li>Digital Zoom ขยายการแสดงผลของ Pixel แต่ไม่ได้เพิ่มข้อมูลเชิงพื้นที่ที่ Detector ไม่ได้ตรวจจับไว้</li></ul><p>การที่เป้าหมายกินพื้นที่เพียงบางส่วนของ Pixel ทำให้สัญญาณที่อ่านได้เป็นการเฉลี่ยหรือผสมกับพื้นหลัง จึงอาจลด Contrast ของเป้าหมายและทำให้ตรวจพบได้ยาก</p>", "note": "จำนวน Pixel ส่งผลต่อ Spatial Resolution แต่ไม่รับประกัน Temperature Accuracy", "visual": "ch6_pixel_sampling"}, {"title": "Field of View และ Instantaneous Field of View", "lead": "FOV บอกมุมมองรวม ส่วน IFOV บอกมุมเชิงพื้นที่ของ Pixel หนึ่งหน่วย", "body": "<p><b>Field of View (FOV)</b> คือมุมมองรวมของกล้องในแนวนอนและแนวตั้ง ส่วน <b>Instantaneous Field of View (IFOV)</b> เป็นมุมมองที่สัมพันธ์กับ Detector element หนึ่ง Pixel มักระบุเป็น mrad</p><div class=\"formula-box\">IFOV ≈ Horizontal FOV / Number of horizontal pixels</div><p><b>ตัวอย่าง:</b> กล้องมี Horizontal FOV = 24° และความละเอียดแนวนอน 320 Pixels</p><div class=\"formula-box\">IFOV = 24° / 320 = 0.075° ≈ 1.31 mrad</div><p>มุม 1 mrad ครอบคลุมความกว้างประมาณ 1 mm ที่ระยะ 1 m ในแบบจำลองเรขาคณิตอย่างง่าย ดังนั้น Pixel Footprint จะเพิ่มขึ้นตามระยะห่างจากเป้าหมาย และเป้าหมายที่เล็กกว่าพื้นที่ Pixel อาจให้สัญญาณผสมกับพื้นหลัง</p>", "note": "IFOV ใช้คำนวณเชิงมุม ส่วนการตัดสินว่าตรวจเป้าหมายเล็กได้หรือไม่ต้องพิจารณา Measurement IFOV/Spatial Resolution ด้วย", "visual": "ch6_ifov_footprint"}, {"title": "MRTD และความสามารถในการแยกความต่างอุณหภูมิ", "lead": "MRTD เป็นคุณลักษณะของระบบภาพที่สัมพันธ์กับการมองเห็นรูปแบบเป้าหมายที่มี Contrast ทางความร้อน", "body": "<p><b>Minimum Resolvable Temperature Difference (MRTD)</b> คือความแตกต่างอุณหภูมิขั้นต่ำของเป้าหมายรูปแบบที่กำหนด ซึ่งระบบภาพสามารถแยกแยะได้ตามเงื่อนไขทดสอบ</p><p>ค่า MRTD ไม่ได้บอกเพียงว่า Pixel หนึ่งจุดอ่านอุณหภูมิได้ละเอียดเท่าใด แต่เกี่ยวข้องกับความสามารถในการแยก Pattern ที่มีรายละเอียดเชิงพื้นที่และ Contrast ทางอุณหภูมิร่วมกัน</p><ul><li>ค่า MRTD ต่ำกว่าแสดงถึงความสามารถในการแยกความต่างอุณหภูมิได้ดีกว่า ภายใต้เงื่อนไขทดสอบเดียวกัน</li><li>ความสามารถอาจเปลี่ยนตามอุณหภูมิเป้าหมายและสภาวะการทดสอบ</li><li>ห้ามนำ MRTD ไปใช้แทน Accuracy หรือ NETD โดยไม่พิจารณาความหมายและวิธีทดสอบของแต่ละค่า</li></ul>", "note": "MRTD เป็นคุณลักษณะของระบบภาพสำหรับการแยกรูปแบบ ไม่ใช่เกณฑ์ยอมรับ Defect", "visual": "ch6_mrtd_pattern"}, {"title": "Apparent Temperature กับ True Temperature", "lead": "ค่าที่กล้องแสดงก่อนการชดเชยเป็น Apparent Temperature ซึ่งได้รับผลจากรังสีหลายแหล่ง", "body": "<p><b>Apparent Temperature</b> คือค่าที่กล้องคำนวณจากรังสีที่รับเข้ามาภายใต้การตั้งค่าที่ใช้อยู่ เมื่อยังไม่ชดเชยปัจจัยของวัตถุและสิ่งแวดล้อม ค่าดังกล่าวจึงไม่จำเป็นต้องเท่ากับ True Surface Temperature</p><ul><li>พื้นผิว Emissivity สูงมักมีสัดส่วนรังสีที่ปล่อยเองมากขึ้น</li><li>พื้นผิว Emissivity ต่ำมีสัดส่วนรังสีสะท้อนจากสิ่งแวดล้อมมากขึ้น</li><li>Reflected Apparent Temperature ใช้แทนสภาวะรังสีสะท้อนจากสิ่งแวดล้อมในแบบจำลองการชดเชย</li><li>ระยะทาง บรรยากาศ และการส่งผ่านของ Optical Path อาจมีผลต่อการคำนวณด้วย</li></ul><p>การตั้ง Emissivity หรือ Reflected Temperature เปลี่ยนผลการคำนวณอุณหภูมิ ไม่ได้เปลี่ยนรังสีที่ Detector ได้รับย้อนหลัง และไม่ทำให้ความผิดปกติในชิ้นงานเปลี่ยนจริง</p><div class=\"warning-note\"><b>ข้อควรจำ:</b> เมื่อใช้การวัดแบบชดเชย ต้องใส่ค่าพารามิเตอร์ให้สอดคล้องกับวัสดุ มุมมอง และสภาพแวดล้อมที่ตรวจ</div>", "note": "กล้องเห็น Apparent Radiance ก่อน แล้วจึงประมาณ True Temperature ด้วยค่าชดเชยที่เหมาะสม", "visual": "ch6_apparent_true"}]}`);

function chapterHTML(){const c=chapters.find(x=>x.id===currentChapter);if(!c)return lessonsHTML();const quizCount=c.id==='foundation'?foundationQuiz.length:c.id==='appA'?bankAppendixA.length:c.id==='appB'?bankAppendixB.length:(bank[c.id]||[]).length;return `<div class="eyebrow">${c.id.startsWith('app')?'APPENDIX':c.id==='foundation'?'FOUNDATION':'CHAPTER '+c.num} · ${c.pages}</div><div class="course-hero" style="margin-top:10px"><div><h1>${c.title}</h1><p>${c.subtitle}</p><div class="course-meta"><span>${c.topics.length} key topics</span><span>Lesson material</span><span>Quiz: ${quizCount} questions</span></div></div><div class="course-progress"><strong>${chapterProgress(c.id)}%</strong><small>Reviewed</small></div></div><div class="section-head"><div><h2>Lesson overview</h2><p>${c.description}</p></div><button class="btn-primary" data-action="start-lesson" data-id="${c.id}">Start learning →</button></div><div class="lesson-list">${c.slides.map((s,i)=>`<button class="lesson-row" data-action="open-slide" data-index="${i}" data-id="${c.id}"><span class="lesson-no">${String(i+1).padStart(2,'0')}</span><span><b>${s.title}</b><small>${s.lead}</small></span><span class="chev">→</span></button>`).join('')}</div><div class="section-head"><div><h2>Topics covered</h2><p>หัวข้อย่อยที่ต้องทำความเข้าใจ</p></div></div><div class="topic-list">${c.topics.map(t=>`<div class="topic-item"><span>✓</span>${t}</div>`).join('')}</div><div class="panel" style="margin-top:16px"><h3 class="panel-title">Source coverage & assessment</h3><p class="panel-sub">Lesson visual mapping and end-of-chapter quiz</p><div class="topic-chips"><span class="chip">Lesson visual: ${c.pages}</span><span class="chip">Lesson slides: ${c.slides.length}</span><span class="chip">Chapter quiz: ${quizCount} items</span></div><div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn-primary" data-action="start-lesson" data-id="${c.id}">อ่านบทเรียน</button><button class="btn-outline" data-action="start-quiz" data-id="${c.id}">ทำ Chapter Quiz</button></div></div>`}

function interactiveHTML(){return `<div class="eyebrow">VISUAL LEARNING CENTER</div><h1 class="page-title">Interactive Laboratory</h1><p class="page-subtitle">ทดลองเปลี่ยนตัวแปรและสังเกตผลลัพธ์ เพื่อทำความเข้าใจหลักการ ไม่ใช่เครื่องมือวัดหรือ Procedure สำหรับงานจริง</p><div class="warning-note" style="margin-top:13px">แบบจำลองในหน้านี้ใช้เพื่อการเรียนรู้ บางรายการเป็น Simplified Model จึงไม่ใช้แทนค่าจากกล้องจริงหรือ Approved Procedure</div><div class="lab-grid" style="margin-top:15px">
<section class="lab-card"><h3>01 · Camera Level & Span</h3><p>ปรับช่วงแสดงผลและดูผลต่อ Thermal Contrast (แนวคิดตาม )</p><div class="lab-visual" id="cameraBand"><svg viewBox="0 0 400 160"><defs><linearGradient id="camgrad"><stop stop-color="#08255c"/><stop offset=".25" stop-color="#1d68bf"/><stop offset=".48" stop-color="#22b9af"/><stop offset=".7" stop-color="#f1d04f"/><stop offset=".88" stop-color="#f07832"/><stop offset="1" stop-color="#c92c49"/></linearGradient></defs><rect width="400" height="160" rx="10" fill="#0a1b31"/><path d="M0 100 C55 42 108 102 163 67 S256 115 317 55 S365 69 400 35V160H0Z" fill="url(#camgrad)"/><path d="M0 100 C55 42 108 102 163 67 S256 115 317 55 S365 69 400 35" stroke="#fff" fill="none" stroke-width="2"/><text x="16" y="22" fill="#fff" font-size="10">SIMULATED TARGET</text></svg></div><div class="control-row"><label>Level · midpoint</label><output id="levelValue">50°C</output><input id="levelSlider" type="range" min="0" max="100" value="50"></div><div class="control-row"><label>Span · width</label><output id="spanValue">40°C</output><input id="spanSlider" type="range" min="5" max="100" value="40"></div><div class="lab-explain" id="cameraExplain">Level เลื่อนช่วงแสดงผล ส่วน Span กำหนดความกว้างของช่วงสี สีที่เปลี่ยนเป็นการนำเสนอข้อมูล ไม่ใช่การเปลี่ยนอุณหภูมิจริง</div></section>
<section class="lab-card"><h3>02 · Heat Transfer Explorer</h3><p>เลือกกลไกและปรับตัวแปรพื้นฐานเพื่อดูแนวโน้มการถ่ายเท</p><div class="segmented" id="heatModes"><button class="active" data-mode="conduction">Conduction</button><button data-mode="convection">Convection</button><button data-mode="radiation">Radiation</button></div><div class="lab-visual" id="heatVisual">${svgHeat()}</div><div class="control-row"><label>Temperature difference</label><output id="deltaValue">20 K</output><input id="deltaSlider" type="range" min="1" max="100" value="20"></div><div class="control-row"><label>Thickness / path length</label><output id="thickValue">10 mm</output><input id="thickSlider" type="range" min="1" max="100" value="10"></div><div class="control-row"><label>Material</label><select id="materialSelect"><option value="401">Copper · k=401</option><option value="237">Aluminium · k=237</option><option value="52" selected>Steel · k=52</option><option value="1">Glass · k=1</option><option value="0.14">Wood · k=0.14</option></select></div><div class="lab-explain" id="heatResult">แนวโน้ม: เพิ่ม ΔT หรือ k จะเพิ่มอัตราการนำ เมื่อความหนาเพิ่มขึ้น อัตราการนำจะลดลง (แบบจำลอง Fourier พื้นฐาน)</div></section>
<section class="lab-card"><h3>03 · Radiation Energy Balance</h3><p>ปรับสัดส่วน Absorption, Reflection และ Transmission ตาม α + ρ + τ = 1</p><div class="lab-visual" style="min-height:140px"><div style="padding:12px"><div style="font-size:10px;color:#b8cce0;margin-bottom:13px">INCIDENT RADIATION · 100%</div><div id="energyBar" style="height:30px;border-radius:6px;overflow:hidden;display:flex;background:#21354f"><span id="absBar" style="width:60%;background:#e99848"></span><span id="refBar" style="width:30%;background:#4ba8c5"></span><span id="transBar" style="width:10%;background:#b58ad5"></span></div><div style="display:flex;gap:10px;flex-wrap:wrap;font-size:9px;color:#d7e4f0;margin-top:12px"><span>● Absorption <b id="absOut">60%</b></span><span>● Reflection <b id="refOut">30%</b></span><span>● Transmission <b id="transOut">10%</b></span></div></div></div><div class="control-row"><label>Absorptivity α</label><output id="absValue">60%</output><input id="absSlider" type="range" min="0" max="100" value="60"></div><div class="control-row"><label>Reflectivity ρ</label><output id="refValue">30%</output><input id="refSlider" type="range" min="0" max="100" value="30"></div><div class="lab-explain">Transmissivity τ คำนวณจากส่วนที่เหลือเพื่อให้ผลรวมเท่ากับ 100% หากเป็นวัตถุ Opaque จะมี τ ≈ 0</div></section>
<section class="lab-card"><h3>04 · Blackbody Radiation</h3><p>ดูแนวโน้มของ Peak Wavelength เมื่อเปลี่ยน Absolute Temperature</p><div class="lab-visual" id="planckChart">${svgPlanckMini()}</div><div class="control-row"><label>Temperature</label><output id="bbTempValue">1000 K</output><input id="bbTemp" type="range" min="300" max="6000" step="50" value="1000"></div><div class="lab-explain" id="bbExplain">Wien’s Law: λmax ≈ 2898/T = 2.90 µm เมื่อ T = 1000 K (แบบจำลอง Blackbody)</div></section>
<section class="lab-card"><h3>05 · FOV / IFOV Calculator</h3><p>คำนวณ Pixel Footprint จาก IFOV และระยะทางแบบมุมเล็ก</p><div class="lab-visual">${svgIfov()}</div><div class="control-row"><label>Camera distance</label><output id="distanceValue">2.0 m</output><input id="distanceSlider" type="range" min="0.5" max="10" step="0.1" value="2"></div><div class="control-row"><label>IFOV</label><output id="ifovValue">2 mrad</output><input id="ifovSlider" type="range" min="0.5" max="15" step="0.5" value="2"></div><div class="lab-explain" id="ifovResult">Pixel footprint ≈ distance × IFOV = 4.0 mm. เป็นการคำนวณเชิงเรขาคณิตพื้นฐาน ไม่รวม optics/MTF และเงื่อนไขกล้อง</div></section>
<section class="lab-card"><h3>06 · Emissivity Concept</h3><p>ดูสัดส่วนการแผ่จากพื้นผิวและอิทธิพลของรังสีสะท้อนในแบบจำลอง</p><div class="lab-visual"><svg viewBox="0 0 360 170"><rect x="12" y="14" width="336" height="142" rx="10" fill="#10233e"/><rect x="131" y="61" width="98" height="54" rx="6" fill="#698bad"/><text x="180" y="92" text-anchor="middle" fill="#fff" font-size="11">SURFACE</text><path d="M180 17V56m-7 -8l7 8l7 -8" stroke="#f4ad52" stroke-width="3" fill="none"/><path d="M180 119V148m-7 -8l7 8l7 -8" stroke="#6fc6d4" stroke-width="3" fill="none"/><g fill="#dce9f4" font-size="9"><text x="195" y="30">Emitted</text><text x="195" y="150">Reflected / incoming</text></g></svg></div><div class="control-row"><label>Emissivity ε</label><output id="emissivityValue">0.95</output><input id="emissivitySlider" type="range" min="0.05" max="1" step="0.01" value="0.95"></div><div class="lab-explain" id="emissivityExplain">ε สูง: สัญญาณจากการแผ่ของพื้นผิวมีสัดส่วนมากขึ้น; ε ต่ำ: Reflected Radiation จากสิ่งแวดล้อมมีอิทธิพลต่อสัญญาณมากขึ้น การคำนวณจริงต้องใช้ Radiometric Model</div></section>
<section class="lab-card"><h3>07 · Thermal Inertia & Transient Response</h3><p>ดูว่าอุณหภูมิเปลี่ยนตามเวลาอย่างไรเมื่อวัสดุมี Thermal Time Constant ต่างกัน</p><div class="lab-visual" id="transientChart"></div><div class="control-row"><label>Elapsed time</label><output id="timeValue">30 s</output><input id="timeSlider" type="range" min="0" max="180" step="5" value="30"></div><div class="control-row"><label>Time constant (τ)</label><output id="tauValue">45 s</output><input id="tauSlider" type="range" min="10" max="120" step="5" value="45"></div><div class="lab-explain" id="transientExplain">แบบจำลอง first-order cooling: T(t)=T∞+(T₀−T∞)e^(−t/τ) ใช้เพื่ออธิบายแนวโน้มเท่านั้น ไม่ใช่ค่าคุณสมบัติวัสดุที่วัดได้</div></section>
<section class="lab-card"><h3>08 · Reflected Radiation & Apparent Temperature</h3><p>ทดลองดูว่า Emissivity และอุณหภูมิแวดล้อมที่สะท้อนมีผลต่อ Apparent Temperature อย่างไร</p><div class="lab-visual" id="reflectionVisual"><svg viewBox="0 0 360 150"><rect x="8" y="8" width="344" height="134" rx="10" fill="#10233e"/><rect x="130" y="56" width="100" height="44" rx="6" fill="#587e9c"/><text x="180" y="82" text-anchor="middle" fill="#fff" font-size="10">OPAQUE SURFACE</text><path d="M180 18V50m-7 -8l7 8l7 -8" stroke="#f2b64e" stroke-width="3" fill="none"/><path d="M180 108V136m-7 -8l7 8l7 -8" stroke="#64c6d5" stroke-width="3" fill="none"/><g fill="#fff" font-size="9"><text x="194" y="28">Surface emission</text><text x="194" y="137">Reflected environment</text></g></svg></div><div class="control-row"><label>Surface temperature</label><output id="surfaceTempValue">40°C</output><input id="surfaceTempSlider" type="range" min="-10" max="150" step="1" value="40"></div><div class="control-row"><label>Reflected apparent temperature</label><output id="reflectedTempValue">25°C</output><input id="reflectedTempSlider" type="range" min="-10" max="100" step="1" value="25"></div><div class="control-row"><label>Emissivity ε</label><output id="mixEmissivityValue">0.30</output><input id="mixEmissivitySlider" type="range" min="0.05" max="1" step="0.01" value="0.30"></div><div class="lab-explain" id="reflectionExplain">แบบจำลองรังสีรวมสำหรับวัตถุ Opaque สีเทา: Tapp⁴ ≈ εTs⁴ +(1−ε)Tref⁴ โดยใช้ Kelvin เป็นการประมาณเชิงแนวคิด ไม่ใช่ Radiometric Model ของกล้อง</div></section>
<section class="lab-card"><h3>09 · Active vs Passive Thermography</h3><p>เลือกวิธีเพื่อเปรียบเทียบแหล่งกำเนิด Thermal Contrast และหลักการสังเกต</p><div class="filter-row"><select id="thermoModeSelect"><option value="passive">Passive Thermography</option><option value="flash">Active · Flash Thermography</option><option value="step">Active · Step Heating</option><option value="lockin">Active · Lock-in Thermography</option></select></div><div class="lab-visual" id="thermoModeDiagram"></div><div class="lab-explain" id="thermoModeExplain">Passive: กล้องสังเกต Thermal Pattern ที่เกิดขึ้นอยู่แล้ว โดยไม่มีการกระตุ้นความร้อนจากภายนอกเป็นส่วนหนึ่งของการตรวจ</div></section>
<section class="lab-card"><h3>10 · Atmospheric Transmission Explorer</h3><p>สำรวจช่วงคลื่น Infrared และหน้าต่าง Low Atmospheric Transmittance ที่ระบุในบทเรียน</p><div class="lab-visual" id="atmosphereChart"></div><div class="control-row"><label>Wavelength</label><output id="wavelengthValue">6.5 µm</output><input id="wavelengthSlider" type="range" min="0.5" max="14" step="0.1" value="6.5"></div><div class="lab-explain" id="wavelengthExplain">ช่วง Low Atmospheric Transmittance โดยประมาณอยู่ที่ Low Atmospheric Transmittance Window ประมาณ 5.5–7.5 µm ควรพิจารณาการดูดกลืนของบรรยากาศและระยะทางจริงร่วมด้วย</div></section>
</div>`}

function astmChecklistHTML(items,group){return `<div class="astm-check-group">${items.map(([id,label],i)=>{const key=group+'_'+id,parts=label.split(':');const head=parts.length>1?parts.shift():label;const detail=parts.length?parts.join(':').trim():'';return `<label class="astm-check-row"><input type="checkbox" data-astm-check="${key}" ${astmChecklistState[key]?'checked':''}><span><b>${String(i+1).padStart(2,'0')} · ${head}</b>${detail?`<span>${detail}</span>`:''}</span></label>`}).join('')}</div>`}
function astmSetChecklistProgress(){const checks=$$('[data-astm-check]');const done=checks.filter(x=>x.checked).length;const pct=checks.length?Math.round(done/checks.length*100):0;const bar=$('#astmChecklistBar'),label=$('#astmChecklistText');if(bar)bar.style.width=pct+'%';if(label)label.textContent=`${done} / ${checks.length} รายการ (${pct}%)`;}
function astmUpdateLoadCalc(){const rated=Number($('#astmRatedLoad')?.value),measured=Number($('#astmMeasuredLoad')?.value);const out=$('#astmLoadResult');if(!out)return;if(rated>0&&measured>=0){const pct=measured/rated*100;out.innerHTML=`<strong>${pct.toFixed(1)}%</strong><div>Percentage Load = ${measured} ÷ ${rated} × 100</div><small>ตัวอย่างคำนวณเพื่อช่วยจัดทำข้อมูลโหลด ไม่ใช่เกณฑ์ตัดสิน Accept / Reject</small>`}else{out.textContent='กรอก Rated Load มากกว่า 0 และ Measured Load เพื่อคำนวณ';}}
function astmToggleAnimation(paused){const svg=$('#astmFlowSvg');if(!svg)return;if(paused)svg.pauseAnimations();else svg.unpauseAnimations();astmAnimationPaused=paused;const btn=$('#astmAnimToggle');if(btn)btn.textContent=paused?'เล่นภาพเคลื่อนไหว':'หยุดภาพเคลื่อนไหว';}
function astmExportChecklist(){const mode=astmReportMode==='qualitative'?'Qualitative':'Quantitative';const groups=[['General report information',astmGeneralItems],['Qualitative exception details',astmQualItems],...(astmReportMode==='quantitative'?[['Quantitative additional details',astmQuantItems]]:[])];let lines=[`ASTM E1934 learning checklist - ${mode}`,`Reference studied: E1934-99a (Reapproved 2014)`,``, `Completion: ${$$('[data-astm-check]').filter(x=>x.checked).length}/${$$('[data-astm-check]').length}`,``];for(const [title,items] of groups){lines.push(title);for(const [id,label] of items){const key=title.startsWith('General')?'general_'+id:title.startsWith('Qualitative')?'qual_'+id:'quant_'+id;lines.push(`${astmChecklistState[key]?'[x]':'[ ]'} ${label}`)}lines.push('')}const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ASTM_E1934_Inspection_Report_Checklist.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('สร้าง Checklist สำหรับบันทึกแล้ว');}

  <article class="astm-panel"><span class="astm-tag">PURPOSE</span><h3>ระบุและบันทึก Exceptions</h3><p>เป้าหมายหลักคือค้นหาและจัดเก็บข้อมูลบริเวณที่มี Thermal Pattern ผิดปกติ เช่น จุดร้อนหรือจุดเย็นในระบบไฟฟ้าและเครื่องกล</p></article>
  <article class="astm-panel"><span class="astm-tag">TWO APPROACHES</span><h3>Qualitative / Quantitative</h3><p>เลือกวิธีให้ตรงกับสิ่งที่ต้องการจากงานตรวจ: ภาพและตำแหน่งของ Exception หรือภาพร่วมกับข้อมูลอุณหภูมิ</p></article>
  <article class="astm-panel"><span class="astm-tag">RESPONSIBILITY</span><h3>งานร่วมกัน 3 ฝ่าย</h3><p>Thermographer, Qualified Assistant และ End User มีหน้าที่แยกกันชัดเจน โดยเฉพาะงานเกี่ยวกับฝาครอบตู้และการวัดโหลด</p></article>
 </div>
 <div class="astm-section"><div><h2>1. Scope & Terminology</h2><p>ทำความเข้าใจว่าคู่มือนี้ครอบคลุมอะไร และคำว่า Exception หมายถึงอะไร</p></div><div class="astm-num">01</div></div>
 <div class="astm-grid-2">
  <article class="astm-panel"><h3>Scope — ขอบเขตการใช้</h3><ul><li>กำหนดความรับผิดชอบของ End User และ Infrared Thermographer เมื่อตรวจระบบไฟฟ้าและเครื่องกล</li><li>กำหนดข้อมูลที่ควรบันทึกสำหรับการตรวจแบบ Qualitative และ Quantitative</li><li>งานอาจเกี่ยวข้องกับอุปกรณ์ที่ร้อน เคลื่อนที่ หรือมีไฟฟ้าอยู่ จึงต้องมีการจัดการความปลอดภัยก่อนเริ่มงาน</li></ul><p>Guide นี้ไม่ได้ครอบคลุมข้อกังวลด้านความปลอดภัยทั้งหมด ผู้ใช้ต้องกำหนดแนวปฏิบัติด้าน Safety/Health และพิจารณาข้อจำกัดของกฎระเบียบที่ใช้กับสถานที่ด้วย</p></article>
  <article class="astm-panel"><h3>คำศัพท์หลักที่ต้องจำ</h3><ul><li><b>End User:</b> ผู้รับผิดชอบในการใช้ข้อมูลที่ได้จากการตรวจ</li><li><b>Exception:</b> Connector, Conductor หรือ Component ที่มีอุณหภูมิอุ่นหรือเย็นผิดปกติ</li><li><b>Infrared Examination:</b> การใช้ระบบถ่ายภาพ Infrared เพื่อให้ข้อมูลความร้อนของวัตถุ ระบบ หรือกระบวนการ</li><li><b>Inventory List:</b> รายการอุปกรณ์ที่จัดทำขึ้นเพื่อวางแผนและติดตามการตรวจ</li><li><b>Qualified Assistant:</b> ผู้ที่ End User จัดให้และอนุญาต มีความรู้การใช้งาน ประวัติอุปกรณ์ และกฎความปลอดภัยของสถานที่</li></ul></article>
 </div>
 <div class="astm-grid-2">
  <article class="astm-panel"><span class="astm-tag">QUALITATIVE</span><h3>การตรวจแบบ Qualitative</h3><p>ได้ภาพของ Exceptions แต่ไม่ได้วัดหรือรายงานข้อมูลอุณหภูมิ เหมาะเมื่อวัตถุประสงค์คือการระบุตำแหน่งหรือรูปแบบที่ผิดปกติ</p></article>
  <article class="astm-panel"><span class="astm-tag">QUANTITATIVE</span><h3>การตรวจแบบ Quantitative</h3><p>ได้ทั้งภาพของ Exceptions และข้อมูลอุณหภูมิ ต้องควบคุมพารามิเตอร์การวัด และทำ Calibration Test ตามที่ Guide ระบุ</p></article>
 </div>
 <div class="astm-section"><div><h2>2. Significance — อ่าน Exception อย่างมีเหตุผล</h2><p>รูปแบบความร้อนช่วยชี้บริเวณผิดปกติ แต่ไม่ใช่คำยืนยันสาเหตุโดยอัตโนมัติ</p></div><div class="astm-num">02</div></div>
 <div class="astm-grid-3">
  <article class="astm-panel"><svg class="astm-cause" viewBox="0 0 300 110" role="img" aria-label="ภาพแนวคิดจุดร้อนที่ขั้วต่อไฟฟ้า"><rect x="18" y="22" width="264" height="66" rx="10" fill="#183a2a" stroke="#51845d"/><rect x="48" y="40" width="72" height="28" rx="5" fill="#91a8a0"/><rect x="180" y="40" width="72" height="28" rx="5" fill="#91a8a0"/><path d="M120 54 H180" stroke="#d5d9a0" stroke-width="8"/><path d="M133 54 H167" stroke="#ffb45e" stroke-width="5" class="astm-current-line"/><circle cx="150" cy="54" r="23" fill="#f18b45" opacity=".3" class="astm-heat-pulse"/><circle cx="150" cy="54" r="10" fill="#f7bd69" class="astm-heat-pulse"/><text x="150" y="103" text-anchor="middle" class="astm-svg-label">WARM CONNECTION</text></svg><h3>Electrical equipment</h3><p><b>Warm exception:</b> มักสัมพันธ์กับ Resistance ที่เพิ่มขึ้นจาก Connection หลวม/เสื่อม, Short Circuit, Overload, Load Imbalance หรือ Component ที่ผิดชนิด/ติดตั้งไม่เหมาะสม</p><p><b>Cool exception:</b> มักสัมพันธ์กับ Component ที่ Failure</p></article>
  <article class="astm-panel"><svg class="astm-cause" viewBox="0 0 300 110" role="img" aria-label="ภาพแนวคิดชิ้นส่วนเครื่องกลเสียดสี"><rect x="18" y="22" width="264" height="66" rx="10" fill="#183a2a" stroke="#51845d"/><circle cx="112" cy="55" r="27" fill="#527d68" stroke="#b6d7aa" stroke-width="3"/><circle cx="112" cy="55" r="9" fill="#0d2015" stroke="#bdd9bd" stroke-width="3"/><circle cx="190" cy="55" r="22" fill="#527d68" stroke="#b6d7aa" stroke-width="3"/><path d="M139 55 H167" stroke="#e5b86b" stroke-width="8"/><g class="astm-gear"><path d="M190 28 V18 M190 92 V82 M163 55 H153 M227 55 H217 M171 36 L164 29 M216 81 L209 74 M209 36 L216 29 M164 81 L171 74" stroke="#e5b86b" stroke-width="6" stroke-linecap="round"/></g><circle cx="150" cy="55" r="25" fill="#f18b45" opacity=".2" class="astm-heat-pulse"/><text x="150" y="103" text-anchor="middle" class="astm-svg-label">FRICTION / MECHANICAL LOADING</text></svg><h3>Mechanical equipment</h3><p><b>Warm exception:</b> มักสัมพันธ์กับ Friction จาก Lubrication ไม่เหมาะสม, Misalignment, Component สึกหรอ หรือ Mechanical Loading ผิดปกติ</p><p><b>Cool exception:</b> มักสัมพันธ์กับ Component ที่ Failure</p></article>
  <article class="astm-panel"><svg class="astm-cause" viewBox="0 0 300 110" role="img" aria-label="ภาพแนวคิดฉนวนที่มีช่องว่าง"><rect x="18" y="25" width="264" height="62" rx="9" fill="#925e37" stroke="#d9a96a"/><rect x="30" y="36" width="240" height="40" rx="5" fill="#315d42"/><path d="M30 36 H112 L132 76 H30Z" fill="#73a86c"/><path d="M132 36 H166 L146 76 H112Z" fill="#e6aa5d" class="astm-insulation-wave"/><path d="M166 36 H270 V76 H146Z" fill="#73a86c"/><path d="M149 12 V34" stroke="#ffc878" stroke-width="3" stroke-dasharray="4 4" class="astm-insulation-wave"/><text x="150" y="103" text-anchor="middle" class="astm-svg-label">INSULATION DISCONTINUITY</text></svg><h3>Insulation systems</h3><p>Exceptions มักเกี่ยวข้องกับวัสดุฉนวนที่ขาดหาย เสื่อมสภาพ ติดตั้งไม่ถูกต้อง หรือมีปริมาณไม่เพียงพอ ควรตรวจบริบทของระบบและรูปแบบความร้อนร่วมด้วย</p></article>
 </div>
 <div class="astm-callout"><strong>ข้อจำกัดในการแปลผล:</strong> การให้ความเห็นถึงสาเหตุ ความสมบูรณ์ของอุปกรณ์ หรือคำแนะนำแก้ไข ต้องใช้ความรู้/ทักษะเกินกว่าการทำ Thermography เพียงอย่างเดียว ข้อมูลเป็นสภาพ ณ เวลาที่ตรวจ การตรวจไม่ใช่การซ่อมแก้ และไม่ได้ยืนยันว่าอุปกรณ์ทำงานได้ถูกต้องเสมอไป ควรใช้การทดสอบและการบำรุงรักษาอื่นร่วมด้วย</div>
 <div class="astm-section"><div><h2>3. Personnel Responsibilities</h2><p>เลือกบทบาทเพื่อดูขอบเขตความรับผิดชอบและสิ่งที่ไม่ควรทำแทนกัน</p></div><div class="astm-num">03</div></div>
 <div class="astm-panel"><div class="astm-role-tabs"><button class="astm-tab ${astmRole==='thermographer'?'active':''}" data-action="astm-set-role" data-role="thermographer">Thermographer</button><button class="astm-tab ${astmRole==='assistant'?'active':''}" data-action="astm-set-role" data-role="assistant">Qualified Assistant</button><button class="astm-tab ${astmRole==='enduser'?'active':''}" data-action="astm-set-role" data-role="enduser">End User</button></div><div class="astm-role-content"><h3>${role.title}</h3><p>${role.intro}</p><ul>${role.items.map(x=>`<li>${x}</li>`).join('')}</ul><div class="astm-role-restrict"><b>ขอบเขต/ข้อควรระวัง:</b> ${role.restriction}</div></div></div>
 <div class="astm-section"><div><h2>4. Inspection Procedure</h2><p>ลำดับงานตั้งแต่เตรียมแผนจนถึงการติดตามหลังซ่อม</p></div><div class="astm-num">04</div></div>
 <div class="astm-panel"><svg id="astmFlowSvg" class="astm-flow" viewBox="0 0 900 210" role="img" aria-label="Animated inspection sequence: plan, authorize, stabilize, examine, document and close"><defs><linearGradient id="astmLineGrad" x1="0" x2="1"><stop offset="0" stop-color="#3bcb72"/><stop offset="1" stop-color="#c1f1a5"/></linearGradient></defs><path d="M70 94 H830" fill="none" stroke="#315640" stroke-width="5" stroke-linecap="round"/><path d="M70 94 H830" fill="none" stroke="url(#astmLineGrad)" stroke-width="3" stroke-dasharray="12 14"/><g fill="#173b27" stroke="#6fe69a" stroke-width="3">${[70,222,374,526,678,830].map(x=>`<circle cx="${x}" cy="94" r="25"/>`).join('')}</g><g fill="#dfffe7" font-size="13" font-weight="700" text-anchor="middle"><text x="70" y="99">1</text><text x="222" y="99">2</text><text x="374" y="99">3</text><text x="526" y="99">4</text><text x="678" y="99">5</text><text x="830" y="99">6</text></g><circle r="10" fill="#ffc76d" stroke="#fff0bd" stroke-width="2"><animate attributeName="cx" values="70;222;374;526;678;830;70" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="94;94;94;94;94;94;94" dur="10s" repeatCount="indefinite"/></circle><g class="astm-svg-label" font-size="11" text-anchor="middle"><text x="70" y="145">PLAN</text><text x="222" y="145">AUTHORIZE</text><text x="374" y="145">STABILIZE</text><text x="526" y="145">EXAMINE</text><text x="678" y="145">DOCUMENT</text><text x="830" y="145">CLOSE</text><text x="450" y="185" fill="#91bea0">Animated workflow — not a substitute for site-specific safety procedure</text></g></svg><div class="astm-flow-controls"><button id="astmAnimToggle" class="primary" data-action="astm-toggle-animation">หยุดภาพเคลื่อนไหว</button><button data-action="astm-replay-animation">เล่นซ้ำตั้งแต่ต้น</button></div><div class="astm-flow-note">1) จัดทำ Inventory List และวางเส้นทางปลอดภัย → 2) ขออนุญาตและแจ้ง Operations → 3) ตรวจ Load และรอ Thermal Pattern คงตัว → 4) ตรวจตามกฎความปลอดภัย/สภาพแวดล้อมที่เหมาะสม → 5) บันทึก Exceptions → 6) Qualified Assistant ปิดฝาครอบกลับทันทีหลังบันทึกเสร็จ จากนั้น Thermographer จัดทำรายงาน</div></div>
 <div class="astm-grid-2"><article class="astm-panel"><h3>ก่อนเริ่มตรวจ</h3><ul><li>End User จัด Qualified Assistant ที่รู้ประวัติและการทำงานของอุปกรณ์</li><li>จัดทำ Inventory List และเส้นทางที่เป็นระบบ มีประสิทธิภาพ และปลอดภัย</li><li>สำหรับ Quantitative Examination ให้ทำ Calibration Test ก่อนการตรวจแต่ละครั้ง เพื่อยืนยันว่าเครื่องมือวัดอุณหภูมิอยู่ในข้อกำหนดความถูกต้องของผู้ผลิต</li></ul></article><article class="astm-panel"><h3>เตรียมอุปกรณ์และปิดงาน</h3><ul><li>Qualified Assistant ขออนุญาตเข้าถึง แจ้ง Operations และเปิดฝาครอบที่จำเป็นก่อนตรวจทันที</li><li>อุปกรณ์ต้องอยู่ภายใต้ Load ที่เหมาะสม หากเพิ่ง Energize ต้องรอให้ Thermal Pattern คงตัว</li><li>เมื่อ Thermographer ตรวจและบันทึกเสร็จ Qualified Assistant ต้องปิด/ใส่ฝาครอบกลับทันที</li><li>จัดทำ Report และตรวจซ้ำหลังซ่อมเมื่อ End User ร้องขอ</li></ul></article></div>
 <div class="astm-section"><div><h2>5. Conditions Affecting Reliable Examination</h2><p>สภาพแวดล้อมและผิวเป้าหมายสามารถทำให้ Exception ถูกมองเห็นยากหรือเกิดการตีความผิด</p></div><div class="astm-num">05</div></div>
 <div class="astm-grid-2"><article class="astm-panel"><h3>สภาพแวดล้อมและสภาพทางกายภาพ</h3><ul><li>Solar Gain / แสงอาทิตย์ที่ทำให้พื้นผิวได้รับความร้อน</li><li>Wind และการเคลื่อนที่ของอากาศ</li><li>Surface Moisture และ Atmospheric Moisture</li><li>Heat Transfer ที่เกิดขึ้นระหว่างการตรวจ</li><li>Load และความเสถียรของ Thermal Pattern</li></ul><p>Thermographer ควรตรวจเมื่อสภาพเหล่านี้เอื้อต่อการเก็บข้อมูลที่แม่นยำ และบันทึกสภาพพิเศษที่อาจกระทบผล/การทำซ้ำ</p></article><article class="astm-panel"><h3>Low Emissivity และ Reflection</h3><p>พื้นผิวที่มี Emissivity ต่ำกว่า 0.5 ต้องระมัดระวังเป็นพิเศษ เพราะ Exceptions อาจตรวจพบยากขึ้น และ Reflection จากแหล่งความร้อนแวดล้อมอาจทำให้เกิดรูปแบบที่ชวนเข้าใจผิด</p><ul><li>พิจารณาปรับตำแหน่งหรือมุมของ Imager</li><li>ลด/บังแหล่ง Reflection เมื่อทำได้อย่างปลอดภัยและได้รับอนุญาต</li><li>ระบุพื้นผิว Low Emissivity ใน Inventory/Report</li></ul></article></div>
 <div class="astm-section"><div><h2>6. Report Requirements</h2><p>เลือกประเภทการตรวจ แล้วสร้าง Checklist ข้อมูลรายงานให้ตรงกับสิ่งที่ต้องส่งมอบ</p></div><div class="astm-num">06</div></div>
 <div class="astm-panel"><div class="astm-mode-tabs"><button class="astm-tab ${activeMode==='qualitative'?'active':''}" data-action="astm-set-report-mode" data-mode="qualitative">Qualitative Examination</button><button class="astm-tab ${activeMode==='quantitative'?'active':''}" data-action="astm-set-report-mode" data-mode="quantitative">Quantitative Examination</button></div><div class="astm-callout" style="margin-top:12px">${activeMode==='qualitative'?'Qualitative: รายงานภาพและรายละเอียด Exception โดยไม่วัดหรือให้ค่าอุณหภูมิ':'Quantitative: รายงานภาพและค่าอุณหภูมิ พร้อมข้อมูลพารามิเตอร์และสภาพการวัดเพิ่มเติมจากรายการ Qualitative'}</div><div class="section-head" style="margin-top:15px"><div><h3 style="margin:0;font-size:12px">Report completeness checklist</h3><p>ติ๊กเมื่อข้อมูลพร้อมหรือถูกบันทึกแล้ว</p></div><span id="astmChecklistText" style="font-size:10px;color:var(--muted)">${doneChecks} / ${totalChecks} รายการ (${Math.round(doneChecks/totalChecks*100)}%)</span></div><div class="astm-progress"><span id="astmChecklistBar" style="width:${Math.round(doneChecks/totalChecks*100)}%"></span></div><h4 style="margin:13px 0 8px;font-size:11px">A. General Report Information</h4>${astmChecklistHTML(astmGeneralItems,'general')}<h4 style="margin:16px 0 8px;font-size:11px">B. Information for each Exception — Qualitative</h4>${astmChecklistHTML(astmQualItems,'qual')}${activeMode==='quantitative'?`<h4 style="margin:16px 0 8px;font-size:11px">C. Additional Information — Quantitative</h4>${astmChecklistHTML(astmQuantItems,'quant')}<div class="astm-result" style="margin-top:15px"><b>ตัวอย่างการคำนวณ Percentage Load</b><div class="astm-calc"><div class="astm-field"><label for="astmRatedLoad">Maximum Rated Load (A)</label><input id="astmRatedLoad" type="number" min="0" step="any" value="400"></div><div class="astm-field"><label for="astmMeasuredLoad">Measured Load (A)</label><input id="astmMeasuredLoad" type="number" min="0" step="any" value="280"></div></div><div id="astmLoadResult" function astmE1934MockPool(size=20){return shuffle(astmE1934Questions).slice(0,Math.min(size,astmE1934Questions.length));}

function generalMockPool(size=50){const pool=[];Object.values(bank).forEach(arr=>pool.push(...shuffle(arr).slice(0,Math.min(3,arr.length))));const rest=shuffle(generalPool().filter(x=>!pool.includes(x)));pool.push(...rest.slice(0,Math.max(0,Math.min(size,generalPool().length)-pool.length)));return shuffle(pool.slice(0,Math.min(size,generalPool().length)))}
function generalPool(){return Object.values(bank).flat()}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQuiz(){const root=$('#viewRoot');if(!currentQuiz)return;const q=currentQuiz.items[currentQuiz.index],idx=currentQuiz.index,selected=currentQuiz.selected,show=currentQuiz.mode==='learning'&&currentQuiz.revealed,answered=selected!==null;root.innerHTML=`<div class="quiz-shell"><div class="quiz-header"><div><div class="eyebrow">${currentQuiz.mode==='exam'?'EXAMINATION MODE':'LEARNING MODE'}</div><h1 class="page-title" style="font-size:21px">${esc(currentQuiz.title)}</h1><p class="page-subtitle">Question ${idx+1} of ${currentQuiz.items.length} · ${esc(q.topic||'Thermography')}</p></div><button class="btn-outline" data-action="exit-quiz">Exit</button></div><div class="quiz-progress"><span style="width:${idx/currentQuiz.items.length*100}%"></span></div><div class="question-card"><div class="question-kicker">${esc(q.type||'Single best answer')} · LEVEL ${q.level||2}</div><h2>${esc(q.text)}</h2><div class="options">${q.opts.map((o,i)=>{let cls='';if(show&&i===q.answer)cls='correct';else if(show&&i===selected)cls='wrong';else if(!show&&i===selected)cls='selected';return `<button class="option ${cls}" data-action="answer-option" data-index="${i}" ${show?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>${show?`<div class="explanation"><b>${selected===q.answer?'✓ Correct':'✕ Not quite'} — ${'ABCD'[q.answer]}</b><br>${esc(q.why)}<br><span class="note-small">Learning explanation</span></div>`:''}</div><div class="quiz-footer"><div class="left note-small">${currentQuiz.mode==='exam'?'คำตอบจะไม่แสดงจนกว่าจะส่งข้อสอบ':'ระบบจะแสดงคำอธิบายหลังเลือกคำตอบ'}</div>${currentQuiz.mode==='exam'?`<button class="btn-primary" data-action="exam-next" ${!answered?'disabled':''}>${idx===currentQuiz.items.length-1?'Submit exam':'Next question →'}</button>`:show?`<button class="btn-primary" data-action="learning-next">${idx===currentQuiz.items.length-1?'View results':'Continue →'}</button>`:`<button class="btn-primary" data-action="learning-check" ${!answered?'disabled':''}>ตรวจคำตอบ</button>`}</div><div class="note-small" style="margin-top:12px">ข้อสอบฝึกเรียนรู้ · ไม่ใช่ข้อสอบรับรองอย่างเป็นทางการ</div></div>`}

function transientSVG(t,tau){const points=[];for(let i=0;i<=60;i++){const x=i*3;const temp=20+60*Math.exp(-x/tau);const y=135-(temp-20)/60*100;points.push(`${35+i*4.8},${y.toFixed(1)}`)}const markerX=35+(t/180)*288,markerT=20+60*Math.exp(-t/tau),markerY=135-(markerT-20)/60*100;return `<svg viewBox="0 0 340 170"><rect x="4" y="4" width="332" height="162" rx="9" fill="#10233e"/><path d="M35 25V135H325" stroke="#9db3c9" fill="none"/><path d="M35 135H325M35 85H325M35 35H325" stroke="#49617a" stroke-dasharray="3 4"/><polyline points="${points.join(' ')}" fill="none" stroke="#52d889" stroke-width="3"/><path d="M${markerX} 26V135" stroke="#f3b34e" stroke-dasharray="4 3"/><circle cx="${markerX}" cy="${markerY}" r="5" fill="#f3b34e"/><g fill="#dce9f4" font-size="9"><text x="16" y="18">Temperature</text><text x="35" y="151">0 s</text><text x="325" y="151" text-anchor="end">180 s</text><text x="43" y="31">80°C</text><text x="43" y="130">20°C</text><text x="${Math.min(270,markerX+7)}" y="${Math.max(19,markerY-8)}">${markerT.toFixed(1)}°C</text></g></svg>`}
function atmosphereSVG(wl){const x=36+(wl-.5)/(14-.5)*270;return `<svg viewBox="0 0 340 170"><rect x="4" y="4" width="332" height="162" rx="9" fill="#10233e"/><rect x="130" y="27" width="40" height="108" fill="#9c4d51" opacity=".28"/><path d="M36 135V25M36 135H314" stroke="#a4bad0"/><path d="M36 48 C50 38 60 65 75 40 S100 35 112 64 S132 113 146 120 S168 117 183 50 S210 43 225 39 S250 49 264 55 S290 100 314 118" stroke="#56d68b" stroke-width="2.5" fill="none"/><path d="M${x} 22V135" stroke="#f4b64e" stroke-width="2" stroke-dasharray="4 3"/><circle cx="${x}" cy="85" r="4.5" fill="#f4b64e"/><g fill="#dce9f4" font-size="9"><text x="13" y="17">Qualitative transmission</text><text x="36" y="151">0.5 µm</text><text x="314" y="151" text-anchor="end">14 µm</text><text x="150" y="20" text-anchor="middle">5.5–7.5 µm</text></g></svg>`}
function updateThermoMode(){const mode=$('#thermoModeSelect')?.value||'passive';const out=$('#thermoModeExplain'),diagram=$('#thermoModeDiagram');const data={passive:{text:'Passive Thermography: กล้องสังเกต Thermal Pattern ที่มีอยู่แล้ว ไม่ใช้ External Excitation เป็นส่วนหนึ่งของการตรวจในกรณีนี้',source:'Observed thermal pattern',hot:false},flash:{text:'Flash Thermography: ให้พลังงานช่วงสั้นด้วย Flash Lamp แล้วติดตามการเปลี่ยนแปลงอุณหภูมิ/การเย็นตัวตามเวลา',source:'Short heat pulse',hot:true},step:{text:'Step Heating: ให้พลังงานความร้อนต่อเนื่องตามช่วงเวลาที่กำหนด แล้วสังเกต Transient Thermal Response',source:'Controlled heating',hot:true},lockin:{text:'Lock-in Thermography: กระตุ้นด้วยพลังงานเป็นคาบและวิเคราะห์การตอบสนองที่สัมพันธ์กับ Phase และ Amplitude',source:'Periodic excitation',hot:true}}[mode];if(out)out.textContent=data.text;if(diagram)diagram.innerHTML=`<svg viewBox="0 0 360 150"><rect x="10" y="15" width="340" height="120" rx="10" fill="#10233e"/><rect x="139" y="65" width="90" height="38" rx="5" fill="#6686a4"/><text x="184" y="88" text-anchor="middle" fill="white" font-size="10">TEST OBJECT</text><rect x="34" y="42" width="55" height="30" rx="5" fill="#243d57" stroke="#68c6d4"/><text x="61" y="60" text-anchor="middle" fill="white" font-size="9">IR Camera</text><path d="M89 57L136 74M129 65L136 74L124 77" stroke="#68c6d4" stroke-width="2" fill="none"/>${data.hot?`<rect x="270" y="40" width="53" height="30" rx="5" fill="#6a3a26" stroke="#f4ad52"/><text x="296" y="58" text-anchor="middle" fill="white" font-size="8">${mode==='flash'?'FLASH':mode==='step'?'HEATER':'MODULATOR'}</text><path d="M270 62L232 76M241 69L232 76L243 82" stroke="#f4ad52" stroke-width="2" fill="none"/>`:''}<text x="184" y="121" text-anchor="middle" fill="#dce9f4" font-size="9">${data.source}</text></svg>`}

function planckSVG(T){const h=6.62607015e-34,c=299792458,k=1.380649e-23;let vals=[];for(let i=0;i<80;i++){const um=.5+i*(19.5/79),m=um*1e-6,x=h*c/(m*k*T),b=(2*h*c*c)/(Math.pow(m,5)*(Math.expm1(Math.min(x,700))));vals.push({um,b});}const max=Math.max(...vals.map(v=>v.b)),pts=vals.map((v,i)=>`${40+i*3.45},${145-(v.b/max)*105}`).join(' '),peak=2898/T,x=40+(Math.min(20,Math.max(.5,peak))-.5)/19.5*273;return `<svg viewBox="0 0 330 180"><rect x="5" y="5" width="320" height="170" rx="8" fill="#10233e"/><path d="M40 145H315M40 145V28" stroke="#a2b8ce" stroke-width="1"/><polyline points="${pts}" fill="none" stroke="#f6b84e" stroke-width="2.7"/><path d="M${x} 145V${Math.max(35,145-(Math.max(...vals.map(v=>v.b))/max)*105)}" stroke="#7ad3df" stroke-dasharray="4 3"/><g fill="#dbe7f3" font-size="8"><text x="17" y="18">Relative spectral radiance</text><text x="315" y="161" text-anchor="end">Wavelength (µm)</text><text x="${Math.min(290,Math.max(44,x+4))}" y="40">λmax ${peak.toFixed(2)} µm</text><text x="40" y="158">0.5</text><text x="307" y="158" text-anchor="end">20</text></g></svg>`}
function updateCalculator(){const t=$('#calcType')?.value;if(!t)return;const k=+($('#calcK')?.value||0),a=+($('#calcA')?.value||0),dt=+($('#calcDT')?.value||0),l=+($('#calcL')?.value||1);let result='',labels=[];if(t==='fourier'){const v=k*a*dt/l;result=`Q̇ = ${v.toLocaleString(undefined,{maximumFractionDigits:4})} W`;labels=['k (W/m·K)','A (m²)','ΔT (K)','L (m)'];}else if(t==='newton'){const v=k*a*dt;result=`Q̇ = ${v.toLocaleString(undefined,{maximumFractionDigits:4})} W · k ช่องแรกใช้แทน h (W/m²·K)`;labels=['h (W/m²·K)','A (m²)','ΔT (K)','—'];}else if(t==='wien'){result=`λmax = ${(dt>0?2898/dt:0).toFixed(4)} µm`;labels=['—','—','T (K)','—'];}else if(t==='sb'){const sig=5.670374419e-8,eps=k;result=`M = ${(eps*sig*Math.pow(dt,4)).toExponential(5)} W/m² · ช่อง k ใช้แทน ε`;labels=['ε (0–1)','—','T (K)','—'];}else{result=`${dt.toFixed(2)}°C = ${(dt+273.15).toFixed(2)} K = ${(dt*1.8+32).toFixed(2)}°F`;labels=['—','—','°C','—'];}$('#calcResult').textContent=result;const labs=$$('#calcInputs label');labs.forEach((lab,i)=>{const inp=lab.querySelector('input');if(inp){const labelText=labels[i];lab.childNodes[0].textContent=labelText;inp.disabled=labelText==='—';}})}

 if(['levelSlider','spanSlider','deltaSlider','thickSlider','materialSelect','absSlider','refSlider','bbTemp','distanceSlider','ifovSlider','emissivitySlider','timeSlider','tauSlider','surfaceTempSlider','reflectedTempSlider','mixEmissivitySlider','wavelengthSlider'].includes(e.target.id))updateLabs();
 if(['calcK','calcA','calcDT','calcL','calcType'].includes(e.target.id))updateCalculator();if(e.target.id==='thermoModeSelect')updateThermoMode();
 if(e.target.id==='glossarySearch'){const v=e.target.value.toLowerCase();$('#glossaryList').innerHTML=glossaryRows(glossary.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(v)));}
 if(e.target.id==='bankSearch'||e.target.id==='bankTopic')filterBank();
 if(e.target.id==='globalSearch')updateSearch(e.target.value);
});
document.addEventListener('change',e=>{if(e.target.id==='calcType')updateCalculator();if(e.target.id==='materialSelect'||e.target.id==='thermoModeSelect')updateLabs();if(e.target.id==='bankTopic')filterBank()});
function updateSearch(term){const el=$('#searchResults');const t=term.trim().toLowerCase();if(!t){el.classList.remove('show');return;}const matches=[];chapters.forEach(c=>{if((c.title+' '+c.description+' '+c.topics.join(' ')).toLowerCase().includes(t))matches.push({title:c.title,sub:`${c.pages} · ${c.topics.length} topics`,id:c.id});});glossary.forEach(g=>{if((g[0]+' '+g[1]).toLowerCase().includes(t))matches.push({title:g[0],sub:'Technical Glossary',id:'glossary'});});el.innerHTML=matches.slice(0,8).map(m=>`<button class="search-result" data-action="${m.id==='glossary'?'open-glossary':'open-chapter'}" data-id="${m.id}">${esc(m.title)}<small>${esc(m.sub)}</small></button>`).join('')||'<div class="search-result">ไม่พบผลการค้นหา</div>';el.classList.add('show');}
document.addEventListener('click',e=>{const r=e.target.closest('#searchResults [data-action]');if(r){$('#searchResults').classList.remove('show');$('#globalSearch').value='';if(r.dataset.action==='open-glossary')setView('glossary');else{currentChapter=r.dataset.id;setView('chapter');}}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if(currentView==='lesson'&&e.key==='ArrowRight'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){const c=chapters.find(x=>x.id===currentChapter);if(currentSlide<c.slides.length-1){currentSlide++;render()}}if(currentView==='lesson'&&e.key==='ArrowLeft'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){currentSlide=Math.max(0,currentSlide-1);render()}if(e.key==='Escape'){closeMobile();closeLightbox();$('#searchResults').classList.remove('show')}});

function safeId(v){return String(v).toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'scene'}
function dot(path,color='#66e39a',dur='3s',radius=8,begin='0s'){
 return `<circle r="${radius}" fill="${color}" class="glow"><animateMotion path="${path}" dur="${dur}" begin="${begin}" repeatCount="indefinite" rotate="auto"/><animate attributeName="opacity" values=".35;1;.35" dur="${dur}" repeatCount="indefinite"/></circle>`;
}
function movingLine(path,color='#62dc93',width=4,dur='2.4s'){
 return `<path d="${path}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-dasharray="12 12"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="${dur}" repeatCount="indefinite"/></path>`;
}
function svgBase(id,title,body,caption=''){

 <linearGradient id="${id}-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1d31"/><stop offset="1" stop-color="#102a20"/></linearGradient>
 <linearGradient id="${id}-heat"><stop stop-color="#164f9b"/><stop offset=".32" stop-color="#12a9a7"/><stop offset=".62" stop-color="#e6cb49"/><stop offset="1" stop-color="#dc5148"/></linearGradient>
 <linearGradient id="${id}-hot"><stop stop-color="#ec6c44"/><stop offset="1" stop-color="#f7c35b"/></linearGradient>
 <linearGradient id="${id}-cool"><stop stop-color="#278ac1"/><stop offset="1" stop-color="#46d4c1"/></linearGradient>
 <filter id="${id}-glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs><rect x="8" y="8" width="744" height="404" rx="20" fill="url(#${id}-bg)" stroke="#294f38" stroke-width="2"/>
 <text x="34" y="46" fill="#a9ddba" font-size="16" font-weight="700" letter-spacing="2">${esc(title).toUpperCase().slice(0,62)}</text>
 ${body}
 ${caption?`<text x="380" y="386" text-anchor="middle" fill="#9cb9a4" font-size="13">${esc(caption).slice(0,115)}</text>`:''}

}

function enhanceMotionControls(root=document){

function planckSVG(T){
 // Planck spectral radiance B_lambda(T), displayed in a normalized relative scale.
 const h=6.62607015e-34,c=299792458,k=1.380649e-23;
 const peak=2897.771955/T;
 const lambdaMax=Math.max(0.25,Math.min(30,peak));
 const lambdaMin=Math.max(0.25,lambdaMax*.08),lambdaEnd=Math.min(35,lambdaMax*3.8);
 const samples=[];let max=0;
 for(let i=0;i<=110;i++){
   const um=lambdaMin+(lambdaEnd-lambdaMin)*i/110, lam=um*1e-6;
   const exponent=Math.min(700,h*c/(lam*k*T));
   const B=(2*h*c*c)/(Math.pow(lam,5)*(Math.exp(exponent)-1));
   samples.push({um,B});if(B>max)max=B;
 }
 const pts=samples.map((v,i)=>({x:105+i*5.15,y:320-(v.B/max)*220,um:v.um}));
 const d='M'+pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
 const peakX=105+(pts.findIndex(p=>p.um>=lambdaMax)/110)*566;
 const peakIdx=Math.max(0,Math.min(110,pts.findIndex(p=>p.um>=lambdaMax)));
 const peakY=pts[peakIdx].y;
 const body=`<path d="M105 320 V90 M105 320 H685" stroke="#91b9a0" stroke-width="2"/><path d="M105 265 H685 M105 210 H685 M105 155 H685" stroke="#43624e" stroke-dasharray="5 9"/><path d="${d}" fill="none" stroke="#ffbd65" stroke-width="6" stroke-linecap="round"/><path d="M${peakX.toFixed(1)} 320 V${peakY.toFixed(1)}" stroke="#70e4d0" stroke-width="3" stroke-dasharray="8 7"/><circle cx="${peakX.toFixed(1)}" cy="${peakY.toFixed(1)}" r="9" fill="#fff0a4" stroke="#fff" stroke-width="2"><animate attributeName="r" values="7;11;7" dur="1.6s" repeatCount="indefinite"/></circle><circle r="7" fill="#8ff1cb" stroke="#fff" stroke-width="2"><animateMotion dur="5.5s" repeatCount="indefinite" path="${d}"/></circle><text x="${Math.min(590,peakX+18).toFixed(1)}" y="${Math.max(78,peakY-18).toFixed(1)}" fill="#d9f1df" font-size="15">λmax ≈ ${lambdaMax.toFixed(2)} µm</text><text x="110" y="75" fill="#d9e9dc" font-size="14">T = ${T} K</text><text x="680" y="355" text-anchor="end" fill="#d9e9dc" font-size="13">WAVELENGTH (µm)</text><text x="112" y="112" fill="#9fc6ad" font-size="12">RELATIVE SPECTRAL RADIANCE</text>`;
 return svgBase('lab-planck','PLANCK BLACKBODY SPECTRUM',body,'เส้นโค้งคำนวณจาก Planck law ในสเกลสัมพัทธ์ · Peak wavelength สอดคล้องกับ Wien’s displacement law');
}

 const tm=+($('#timeSlider')?.value||30),tau=+($('#tauSlider')?.value||45);if($('#timeValue'))$('#timeValue').textContent=tm+' s';if($('#tauValue'))$('#tauValue').textContent=tau+' s';if($('#transientChart'))$('#transientChart').innerHTML=transientSVG(tm,tau);if($('#transientExplain'))$('#transientExplain').textContent=`เมื่อ t=${tm} s และ τ=${tau} s อุณหภูมิแบบจำลอง ≈ ${(20+60*Math.exp(-tm/tau)).toFixed(1)}°C · τ มากทำให้เปลี่ยนช้าลง`;
