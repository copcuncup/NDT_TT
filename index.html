function interactiveHTML(){return `<div class="eyebrow">VISUAL LEARNING CENTER</div><h1 class="page-title">Interactive Laboratory</h1><p class="page-subtitle">ปรับตัวแปรและสังเกตการเคลื่อนที่ของพลังงาน รังสี และรูปแบบความร้อน เพื่อเข้าใจหลักการเชิงภาพ</p><div class="warning-note" style="margin-top:13px">ภาพเคลื่อนไหวเป็นแบบจำลองเพื่อการเรียนรู้ ไม่ใช่ค่าที่กล้องจริงวัดได้หรือ Procedure สำหรับงานตรวจสอบ</div><div class="lab-grid" style="margin-top:15px">
 <section class="lab-card"><h3>01 · Camera Level & Span</h3><p>ดูว่าการเลื่อนช่วงแสดงผลส่งผลต่อการเข้ารหัสสัญญาณใน Thermal Image อย่างไร</p><div class="lab-visual" id="cameraBand"></div><div class="control-row"><label>Level · midpoint</label><output id="levelValue">50°C</output><input id="levelSlider" type="range" min="0" max="100" value="50"></div><div class="control-row"><label>Span · width</label><output id="spanValue">40°C</output><input id="spanSlider" type="range" min="5" max="100" value="40"></div><div class="lab-explain" id="cameraExplain">Level เลื่อนกึ่งกลาง ส่วน Span กำหนดความกว้างของช่วงสี</div></section>
 <section class="lab-card"><h3>02 · Heat Transfer Explorer</h3><p>เปรียบเทียบการนำ การพา และการแผ่รังสี พร้อมดูการเคลื่อนที่ของพลังงาน</p><div class="segmented" id="heatModes"><button class="active" data-mode="conduction">Conduction</button><button data-mode="convection">Convection</button><button data-mode="radiation">Radiation</button></div><div class="lab-visual" id="heatVisual"></div><div class="control-row"><label>Temperature difference</label><output id="deltaValue">20 K</output><input id="deltaSlider" type="range" min="1" max="100" value="20"></div><div class="control-row"><label>Thickness / path length</label><output id="thickValue">10 mm</output><input id="thickSlider" type="range" min="1" max="100" value="10"></div><div class="control-row"><label>Material</label><select id="materialSelect"><option value="401">Copper · k=401</option><option value="237">Aluminium · k=237</option><option value="52" selected>Steel · k=52</option><option value="1">Glass · k=1</option><option value="0.14">Wood · k=0.14</option></select></div><div class="lab-explain" id="heatResult"></div></section>
 <section class="lab-card"><h3>03 · Radiation Energy Balance</h3><p>ติดตามเส้นทางรังสีที่ถูกดูดกลืน สะท้อน และส่งผ่านตาม α + ρ + τ = 1</p><div class="lab-visual" id="energyVisual"></div><div class="control-row"><label>Absorptivity α</label><output id="absValue">60%</output><input id="absSlider" type="range" min="0" max="100" value="60"></div><div class="control-row"><label>Reflectivity ρ</label><output id="refValue">30%</output><input id="refSlider" type="range" min="0" max="100" value="30"></div><div class="lab-explain">Transmissivity τ คำนวณจากส่วนที่เหลือ เพื่อให้ผลรวมเท่ากับ 100%</div><div class="topic-chips"><span class="chip">Absorb <b id="absOut">60%</b></span><span class="chip">Reflect <b id="refOut">30%</b></span><span class="chip">Transmit <b id="transOut">10%</b></span></div></section>
 <section class="lab-card"><h3>04 · Blackbody Radiation</h3><p>เมื่ออุณหภูมิเปลี่ยน Spectral Radiance Curve และ Peak Wavelength จะเปลี่ยนอย่างไร</p><div class="lab-visual" id="planckChart"></div><div class="control-row"><label>Absolute temperature</label><output id="bbTempValue">1000 K</output><input id="bbTemp" type="range" min="300" max="6000" step="50" value="1000"></div><div class="lab-explain" id="bbExplain">Wien’s Law: λmax ≈ 2898/T</div></section>
 <section class="lab-card"><h3>05 · FOV / IFOV</h3><p>เห็นการเปลี่ยนแปลงของ Pixel Footprint เมื่อปรับระยะและ IFOV</p><div class="lab-visual" id="ifovVisual"></div><div class="control-row"><label>Camera distance</label><output id="distanceValue">2.0 m</output><input id="distanceSlider" type="range" min="0.5" max="10" step="0.1" value="2"></div><div class="control-row"><label>IFOV</label><output id="ifovValue">2.0 mrad</output><input id="ifovSlider" type="range" min="0.5" max="15" step="0.5" value="2"></div><div class="lab-explain" id="ifovResult">Pixel footprint ≈ distance × IFOV</div></section>
 <section class="lab-card"><h3>06 · Emissivity Concept</h3><p>ปรับ Emissivity แล้วสังเกตสัดส่วนรังสีที่แผ่จากพื้นผิวและรังสีสะท้อน</p><div class="lab-visual" id="emissivityVisual"></div><div class="control-row"><label>Emissivity ε</label><output id="emissivityValue">0.95</output><input id="emissivitySlider" type="range" min="0.05" max="1" step="0.01" value="0.95"></div><div class="lab-explain" id="emissivityExplain"></div></section>
 <section class="lab-card"><h3>07 · Thermal Inertia & Transient Response</h3><p>ติดตามการเย็นตัวตามเวลาและเปรียบเทียบ Time Constant ที่ต่างกัน</p><div class="lab-visual" id="transientChart"></div><div class="control-row"><label>Elapsed time</label><output id="timeValue">30 s</output><input id="timeSlider" type="range" min="0" max="180" step="5" value="30"></div><div class="control-row"><label>Time constant τ</label><output id="tauValue">45 s</output><input id="tauSlider" type="range" min="10" max="120" step="5" value="45"></div><div class="lab-explain" id="transientExplain"></div></section>
 <section class="lab-card"><h3>08 · Reflected Radiation</h3><p>ดูเส้นทางรังสีจากสภาพแวดล้อมที่สะท้อนออกจากพื้นผิวไปยังกล้อง</p><div class="lab-visual" id="reflectionVisual"></div><div class="control-row"><label>Surface temperature</label><output id="surfaceTempValue">40°C</output><input id="surfaceTempSlider" type="range" min="-10" max="150" step="1" value="40"></div><div class="control-row"><label>Reflected apparent temperature</label><output id="reflectedTempValue">25°C</output><input id="reflectedTempSlider" type="range" min="-10" max="100" step="1" value="25"></div><div class="control-row"><label>Emissivity ε</label><output id="mixEmissivityValue">0.30</output><input id="mixEmissivitySlider" type="range" min="0.05" max="1" step="0.01" value="0.30"></div><div class="lab-explain" id="reflectionExplain"></div></section>
 <section class="lab-card"><h3>09 · Active vs Passive Thermography</h3><p>เลือกวิธี Excitation เพื่อดูความแตกต่างของรูปแบบการกระตุ้นและ Thermal Response</p><div class="filter-row"><select id="thermoModeSelect"><option value="passive">Passive Thermography</option><option value="flash">Active · Flash Thermography</option><option value="step">Active · Step Heating</option><option value="lockin">Active · Lock-in Thermography</option></select></div><div class="lab-visual" id="thermoModeDiagram"></div><div class="lab-explain" id="thermoModeExplain"></div></section>
 <section class="lab-card"><h3>10 · Atmospheric Transmission</h3><p>เปรียบเทียบ Wavelength ที่เลือกกับการส่งผ่านรังสีในบรรยากาศ</p><div class="lab-visual" id="atmosphereChart"></div><div class="control-row"><label>Wavelength</label><output id="wavelengthValue">6.5 µm</output><input id="wavelengthSlider" type="range" min="0.5" max="14" step="0.1" value="6.5"></div><div class="lab-explain" id="wavelengthExplain"></div></section>
 </div>`;}

function referencesHTML(){const visible=references.filter(r=>r.type!=='Primary');return `<div class="eyebrow">FURTHER TECHNICAL READING</div><h1 class="page-title">Standards & Technical Resources</h1><p class="page-subtitle">แหล่งข้อมูลเพิ่มเติมสำหรับศึกษามาตรฐานและแนวทางทางเทคนิค</p><div class="warning-note" style="margin-top:13px">ตรวจสอบ Edition, Revision และข้อกำหนดขององค์กรก่อนนำมาตรฐานไปใช้กับงานจริง</div><article class="reference-card" style="margin-top:12px"><div class="ref-icon">ASTM</div><div><b>ASTM E1934 — Infrared Examination of Electrical and Mechanical Equipment</b><p>Learning summary: scope, roles, procedure, limitations, qualitative/quantitative report contents. Studied edition: E1934-99a (Reapproved 2014).</p><button class="btn-outline" data-view="astm">Open learning guide →</button></div></article><div class="reference-list">${visible.map(r=>`<article class="reference-card"><div class="ref-icon">${r.type==='Certification'?'STD':'IR'}</div><div><b>${esc(r.title)}</b><p>${esc(r.org)}<br>${esc(r.detail)}</p>${r.url?`<a href="${r.url}" target="_blank" rel="noopener">Open resource ↗</a>`:''}</div></article>`).join('')}</div>`;}
function progressHTML(){const done=Object.keys(state.completed).filter(k=>state.completed[k]).length;const history=state.attempts||[];const avg=history.length?Math.round(history.reduce((a,b)=>a+b.score,0)/history.length):0;return `<div class="eyebrow">YOUR LEARNING</div><h1 class="page-title">Progress & Review</h1><p class="page-subtitle">ติดตามความคืบหน้าและกลับไปทบทวนหัวข้อที่ยังไม่เข้าใจ</p><div class="stats-grid"><div class="stat-card"><div class="stat-icon">◴</div><div><div class="stat-value">${totalProgress()}%</div><div class="stat-label">Module completion</div></div></div><div class="stat-card"><div class="stat-icon cyan">✓</div><div><div class="stat-value">${done}</div><div class="stat-label">Modules reviewed</div></div></div><div class="stat-card"><div class="stat-icon orange">◎</div><div><div class="stat-value">${history.length}</div><div class="stat-label">Quiz attempts</div></div></div><div class="stat-card"><div class="stat-icon violet">★</div><div><div class="stat-value">${avg}%</div><div class="stat-label">Average score</div></div></div></div><div class="section-head"><div><h2>Module progress</h2><p>สถานะของ Foundation, Chapters และ Appendices</p></div></div><div class="panel"><div class="course-track">${chapters.map(c=>`<div class="track-row"><div class="track-num">${c.num}</div><div class="track-copy"><b>${esc(c.title)}</b><small>${c.topics.length} topics · ${c.slides.length} lessons</small><div class="track-bar"><span style="width:${chapterProgress(c.id)}%"></span></div></div><div class="track-status">${chapterProgress(c.id)}%</div></div>`).join('')}</div></div><div class="section-head"><div><h2>Recent quiz results</h2><p>ผลการประเมินที่บันทึกไว้ในอุปกรณ์นี้</p></div></div><div class="panel">${history.length?history.slice(-12).reverse().map(r=>`<div class="question-bank-row"><div><b>${esc(r.title)}</b><small>${r.correct}/${r.total} correct · ${new Date(r.date).toLocaleDateString()}</small></div><span class="pill ${r.score>=70?'green':'orange'}">${r.score}%</span></div>`).join(''):'<div class="empty-state">ยังไม่มีผล Quiz ลองทำ Chapter Quiz เพื่อเริ่มบันทึกความก้าวหน้า</div>'}</div><div class="section-head"><div><h2>Review incorrect answers</h2><p>หัวข้อที่ควรกลับไปทบทวนจากข้อที่ตอบผิดล่าสุด</p></div><button class="btn-outline" data-action="clear-review">Clear review</button></div><div class="panel">${state.wrong.length?state.wrong.slice(0,15).map(w=>`<div class="question-bank-row"><div><b>${esc(w.topic)}</b><small>${esc(w.question)}</small></div></div>`).join(''):'<div class="success-note">ยังไม่มีข้อผิดที่ต้องทบทวน</div>'}</div>`;}
function bankRows(items){return items.map((q,i)=>`<div class="question-bank-row"><div><b>${String(i+1).padStart(2,'0')} · ${esc(q.topic)} · Level ${q.level}</b><small>${esc(q.text)}</small></div><span class="pill">${esc(q.type)}</span></div>`).join('');}
function updateSearch(term){const el=$('#searchResults');const t=term.trim().toLowerCase();if(!t){el.classList.remove('show');return;}const matches=[];chapters.forEach(c=>{if((c.title+' '+c.description+' '+c.topics.join(' ')).toLowerCase().includes(t))matches.push({title:c.title,sub:`${c.topics.length} topics · ${c.slides.length} lessons`,id:c.id});});glossary.forEach(g=>{if((g[0]+' '+g[1]).toLowerCase().includes(t))matches.push({title:g[0],sub:'Technical Glossary',id:'glossary'});});el.innerHTML=matches.slice(0,8).map(m=>`<button class="search-result" data-action="${m.id==='glossary'?'open-glossary':'open-chapter'}" data-id="${m.id}">${esc(m.title)}<small>${esc(m.sub)}</small></button>`).join('')||'<div class="search-result">ไม่พบผลการค้นหา</div>';el.classList.add('show');}
function renderQuiz(){const root=$('#viewRoot');if(!currentQuiz)return;const q=currentQuiz.items[currentQuiz.index],idx=currentQuiz.index,selected=currentQuiz.selected,show=currentQuiz.mode==='learning'&&currentQuiz.revealed,answered=selected!==null;root.innerHTML=`<div class="quiz-shell"><div class="quiz-header"><div><div class="eyebrow">${currentQuiz.mode==='exam'?'EXAMINATION MODE':'LEARNING MODE'}</div><h1 class="page-title" style="font-size:21px">${esc(currentQuiz.title)}</h1><p class="page-subtitle">Question ${idx+1} of ${currentQuiz.items.length} · ${esc(q.topic||'Thermography')}</p></div><button class="btn-outline" data-action="exit-quiz">Exit</button></div><div class="quiz-progress"><span style="width:${idx/currentQuiz.items.length*100}%"></span></div><div class="question-card"><div class="question-kicker">${esc(q.type||'Single best answer')} · LEVEL ${q.level||2}</div><h2>${esc(q.text)}</h2><div class="options">${q.opts.map((o,i)=>{let cls='';if(show&&i===q.answer)cls='correct';else if(show&&i===selected)cls='wrong';else if(!show&&i===selected)cls='selected';return `<button class="option ${cls}" data-action="answer-option" data-index="${i}" ${show?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>${show?`<div class="explanation"><b>${selected===q.answer?'✓ Correct':'✕ Not quite'} — ${'ABCD'[q.answer]}</b><br>${esc(q.why)}</div>`:''}</div><div class="quiz-footer"><div class="left note-small">${currentQuiz.mode==='exam'?'คำตอบจะไม่แสดงจนกว่าจะส่งข้อสอบ':'ระบบจะแสดงคำอธิบายหลังเลือกคำตอบ'}</div>${currentQuiz.mode==='exam'?`<button class="btn-primary" data-action="exam-next" ${!answered?'disabled':''}>${idx===currentQuiz.items.length-1?'Submit exam':'Next question →'}</button>`:show?`<button class="btn-primary" data-action="learning-next">${idx===currentQuiz.items.length-1?'View results':'Continue →'}</button>`:`<button class="btn-primary" data-action="learning-check" ${!answered?'disabled':''}>ตรวจคำตอบ</button>`}</div><div class="note-small" style="margin-top:12px">ข้อสอบฝึกเรียนรู้ · ไม่ใช่ข้อสอบรับรองอย่างเป็นทางการ</div></div>`;}
function finishQuiz(){const total=currentQuiz.items.length;let correct=0;const misses=[];currentQuiz.items.forEach((q,i)=>{const a=currentQuiz.answers[i];if(a&&a.correct)correct++;else misses.push({question:q.text,topic:q.topic||'General',why:q.why})});const score=Math.round(correct/total*100),duration=Math.round((Date.now()-currentQuiz.start)/1000);const result={title:currentQuiz.title,score,correct,total,date:new Date().toISOString(),misses,quizId:currentQuiz.quizId};state.scores[currentQuiz.quizId]=result;state.attempts=[...(state.attempts||[]),result].slice(-100);state.wrong=[...misses,...state.wrong].slice(0,80);if(currentQuiz.quizId.startsWith('chapter:')&&score>=70)state.completed[currentQuiz.quizId.slice(8)]=true;if(currentQuiz.quizId==='foundation'&&score>=70)state.completed.foundation=true;saveState();currentQuiz=null;currentView='quiz-result';$('#breadcrumbCurrent').textContent='Quiz Results';$('#viewRoot').innerHTML=`<div class="quiz-shell"><div class="eyebrow">ASSESSMENT COMPLETE</div><h1 class="page-title">${esc(result.title)}</h1><p class="page-subtitle">ผลการประเมินการเรียนรู้ของคุณ</p><div class="quiz-result" style="margin-top:18px"><div class="score-ring" style="--score:${score*3.6}deg"><strong>${score}%</strong></div><h2 style="font-size:18px;margin:0">${score>=70?'Good progress!':'Keep reviewing!'}</h2><p class="muted" style="font-size:10px">${score>=70?'ถึง Study Target 70% ของเว็บไซต์':'ทบทวนหัวข้อที่ผิด แล้วลองทำ Quiz อีกครั้ง'}</p><div class="result-grid"><div class="result-stat"><b>${correct}</b><small>Correct</small></div><div class="result-stat"><b>${total-correct}</b><small>Incorrect</small></div><div class="result-stat"><b>${Math.floor(duration/60)}:${String(duration%60).padStart(2,'0')}</b><small>Time used</small></div></div><div class="panel" style="text-align:left;margin-top:18px;box-shadow:none"><h3 class="panel-title">Topics to review</h3>${misses.length?misses.slice(0,8).map(m=>`<div class="question-bank-row"><div><b>${esc(m.topic)}</b><small>${esc(m.question)}</small></div></div>`).join(''):'<div class="success-note">ตอบถูกทุกข้อในชุดนี้ ดีมาก!</div>'}</div><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:17px"><button class="btn-primary" data-action="retry-quiz" data-id="${esc(result.quizId)}">ทำชุดนี้อีกครั้ง</button><button class="btn-outline" data-action="progress-view">ดู Progress</button><button class="btn-outline" data-action="back-to-lessons">กลับบทเรียน</button></div></div></div>`;}
function render(){const root=$('#viewRoot');const views={dashboard:dashboardHTML,foundation:foundationHTML,lessons:lessonsHTML,chapter:chapterHTML,lesson:lessonHTML,interactive:interactiveHTML,general:generalHTML,specific:specificHTML,formula:formulaHTML,glossary:glossaryHTML,references:referencesHTML,astm:astmHTML,progress:progressHTML};root.innerHTML=(views[currentView]||dashboardHTML)();if(currentView==='interactive')updateLabs();if(currentView==='formula')updateCalculator();enhanceMotionControls(root);window.scrollTo({top:0,behavior:'auto'});}
