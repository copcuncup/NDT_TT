{title:'NDT และ Thermographic Testing',lead:'NDT คือการตรวจสอบโดยไม่ทำลายความสามารถในการใช้งานของชิ้นงาน',body:'<p>Non-Destructive Testing (NDT) คือการตรวจสอบวัสดุหรือชิ้นส่วนโดยไม่ทำให้ชิ้นงานเสียหายจนไม่สามารถใช้งานต่อได้ <b>Thermographic Testing</b> เป็นวิธีที่ใช้การตรวจจับและวิเคราะห์ Infrared Radiation เพื่อศึกษารูปแบบความร้อนบนพื้นผิว</p><ul><li>Thermography ใช้กล้อง Infrared รับรังสีที่ปล่อย/สะท้อนจากเป้าหมาย</li><li>ข้อมูลที่ได้แสดงเป็น Thermal Image หรือ Thermogram</li><li>การแปลผลต้องมีความเข้าใจเรื่อง Heat Transfer และ Radiation</li></ul>',note:'เริ่มจากเข้าใจว่ากล้องวัดรังสี ไม่ได้มองเห็นอุณหภูมิภายในวัตถุโดยตรง',page:3,figure:5,visual:'thermo'},

]},
{id:'ch1',num:'01',title:'Introduction',subtitle:'รู้จัก Thermography และบทบาทของการตรวจสอบแบบไม่ทำลาย',pages:'',description:'ความหมาย หลักการ ข้อดี ข้อจำกัด และการใช้งาน Infrared Thermography ในงาน Aerospace และ NDT',topics:['What is Thermography?','Infrared Thermography Principles','Applications','Aerospace Applications','Advantages and Limitations','Non-contact / Two-dimensional / Real-time Imaging'],slides:[
{title:'Thermography คืออะไร?',lead:'ศาสตร์ของการรับและวิเคราะห์ข้อมูลจากรังสีความร้อนของวัตถุ',body:'<p>Infrared Thermography ใช้กล้องตรวจจับรังสีอินฟราเรดที่ออกมาจากพื้นผิวของวัตถุ แล้วแปลงสัญญาณเป็นภาพที่เรียกว่า <b>Thermogram</b> ภาพนี้ช่วยให้เห็นรูปแบบความร้อน (Thermal Pattern) ซึ่งอาจสัมพันธ์กับสภาพของวัตถุหรือความผิดปกติบางชนิด</p><ul><li>กล้องตรวจจับ Infrared Radiation โดยไม่สัมผัสชิ้นงาน</li><li>ภาพแสดงการกระจายของสัญญาณรังสีที่ตรวจจับได้</li><li>การแปลผลต้องคำนึงถึง Emissivity, Reflection และสภาพแวดล้อม</li></ul>',note:'อย่าสับสนระหว่างภาพความร้อนกับภาพอุณหภูมิจริง การแสดงอุณหภูมิต้องอาศัยพารามิเตอร์และแบบจำลองการวัดของกล้อง',page:3,figure:5,visual:'thermo'},
{title:'คุณสมบัติสำคัญของ Thermography',lead:'Non-contact, Two-dimensional และ Real-time เป็นจุดเด่นสำคัญของวิธี',body:'<ul><li><b>Non-contact:</b> ไม่จำเป็นต้องสัมผัสชิ้นงานระหว่างเก็บภาพ</li><li><b>Two-dimensional:</b> แสดงรูปแบบ Thermal Pattern เชิงพื้นที่</li><li><b>Real-time:</b> สังเกตการเปลี่ยนแปลงของภาพขณะตรวจได้</li></ul><p>อย่างไรก็ตาม ระยะทาง มุมมอง อากาศระหว่างกล้องกับชิ้นงาน Reflection และ Focus ยังมีผลต่อข้อมูล</p>',note:'Non-contact ไม่ได้หมายความว่าไม่มีข้อจำกัดด้านการวัด',page:8,figure:8},
{title:'Aerospace Applications และข้อจำกัด',lead:'ใช้ Thermal Pattern เป็นข้อมูลประกอบการตรวจวัสดุและโครงสร้าง',body:'<p>ตัวอย่างการประยุกต์ ได้แก่ การตรวจแผง Honeycomb การประเมิน Composite Repairs การตรวจสอบรอยต่อ และโครงสร้างที่มีความผิดปกติภายในบางชนิด</p><p>ข้อดีคือสามารถสำรวจพื้นที่ได้รวดเร็วและไม่สัมผัส แต่ Thermography ไม่สามารถระบุชนิดหรือความลึกของ Defect ได้โดยอัตโนมัติ ต้องตีความภายใต้ Procedure และเกณฑ์ที่อนุมัติ</p>',note:'Thermography เป็นวิธี NDT หนึ่งวิธี ไม่ใช่วิธีที่ใช้แทน NDT ทุกวิธี',page:4,figure:5}
]},
{id:'ch2',num:'02',title:'The Infrared Camera',subtitle:'ส่วนประกอบ การควบคุมภาพ และเครื่องมือวัดของกล้อง',pages:'',description:'การตั้งค่า Temperature Range, Level, Span, Focus, Isotherm, Spot Meter และการจัดเก็บภาพ',topics:['Camera Introduction','Viewfinder and Optical Focus','Temperature Range','Level and Span','Isotherm','Spot Meter','Area Measurement','Capturing / Freezing / Saving Images'],slides:[
{title:'กล้อง Infrared ทำงานอย่างไร?',lead:'ระบบ Optical รับรังสี ก่อนส่งไปยัง Detector และ Signal Processing',body:'<p>กล้องประกอบด้วย Lens/Window, Filter (ถ้ามี), Detector หรือ Focal Plane Array (FPA), Electronics และระบบแสดงผล</p><ul><li>Focus ให้ภาพคมชัดก่อนวิเคราะห์</li><li>เลือกช่วงอุณหภูมิให้เหมาะกับเป้าหมาย</li><li>ตรวจสอบพารามิเตอร์ เช่น Emissivity และ Distance ตามความสามารถกล้อง</li></ul>',note:'ภาพที่ไม่ Focus อาจทำให้รายละเอียดเล็ก ๆ เบลอและมีผลต่อการอ่านค่า',page:10,figure:14,visual:'camera'},
{title:'Temperature Range, Level และ Span',lead:'ควบคุมช่วงอุณหภูมิที่ใช้แสดงผลเพื่อให้ Thermal Contrast มองเห็นได้เหมาะสม',body:'<p><b>Level</b> คือค่ากึ่งกลางของช่วงที่แสดงผล ส่วน <b>Span</b> คือความกว้างของช่วงนั้น การเปลี่ยน Level จะเลื่อนช่วงขึ้นหรือลง ส่วนการเปลี่ยน Span จะขยายหรือบีบช่วงที่ใช้แสดงความต่าง</p><ul><li>Level/Span เปลี่ยนการกระจายสี ไม่ได้เปลี่ยนอุณหภูมิจริงของชิ้นงาน</li><li>Span แคบลงอาจทำให้ Contrast ภายในช่วงเด่นขึ้น</li></ul>',note:'การเพิ่ม Thermal Contrast ด้วย Span ไม่ใช่หลักฐานว่ามีความผิดปกติจริง',page:12,figure:12,visual:'level'},
{title:'Isotherm, Spot Meter และ Area Measurement',lead:'เครื่องมือกล้องช่วยอ่านค่าหรือเน้นบริเวณที่เลือก',body:'<p><b>Isotherm</b> เน้นบริเวณที่อยู่ในช่วงอุณหภูมิที่กำหนด <b>Spot Meter</b> อ่านค่าจุดที่เลือก ส่วน <b>Area Measurement</b> แสดงค่า Min, Max และ Average ของพื้นที่ตามฟังก์ชันกล้อง</p><ul><li>เลือกตำแหน่งวัดให้เหมาะกับขนาด Pixel</li><li>ระวังพื้นที่ที่มีวัสดุหรือ Emissivity ต่างกัน</li><li>ค่า Average อาจซ่อนจุดร้อน/เย็นเฉพาะที่</li></ul>',note:'อ่าน Min/Max และ Thermal Pattern ประกอบค่า Average',page:14,figure:16},
{title:'การเก็บภาพและ Image Composition',lead:'ตรวจคุณภาพภาพและค่าตั้งก่อน Freeze หรือ Save',body:'<ul><li>รักษาเลนส์และหน้าจอให้สะอาด</li><li>ตรวจ Range และ Focus ก่อนบันทึก</li><li>จัดองค์ประกอบภาพให้เห็นชิ้นงานชัดเจนในระยะเหมาะสม</li><li>เก็บภาพต้นฉบับก่อนเริ่มวิเคราะห์หรือปรับค่าการแสดงผล</li></ul>',note:'ควรรักษาภาพต้นฉบับและข้อมูลพารามิเตอร์เพื่อใช้เทียบภายหลัง',page:18,figure:17}
]},
{id:'ch3',num:'03',title:'Thermal Science',subtitle:'พื้นฐานความร้อน อุณหภูมิ และคลื่นแม่เหล็กไฟฟ้า',pages:'',description:'Heat และ Temperature, Temperature Scales, Infrared Spectrum, Atmospheric Transmission และ Thermodynamics',topics:['Heat vs Temperature','Kinetic Energy','Absolute and Relative Temperature','Temperature Conversion','Electromagnetic Spectrum','Infrared Wavelength','Atmospheric Transmission','Laws of Thermodynamics'],slides:[
{title:'Heat ไม่ใช่ Temperature',lead:'Heat คือพลังงานที่ถ่ายเท ส่วน Temperature บอกสภาวะทางความร้อน',body:'<p>Heat เกี่ยวข้องกับพลังงานที่ถ่ายเทเนื่องจากความต่างอุณหภูมิ ส่วน Temperature เป็นค่าที่สัมพันธ์กับการเคลื่อนที่เฉลี่ยของอนุภาคในวัตถุ</p><ul><li>หน่วยพลังงาน SI คือ Joule (J)</li><li>หน่วยอุณหภูมิที่ใช้บ่อยคือ Kelvin (K) และ Celsius (°C)</li><li>วัตถุสองชิ้นอาจมี Temperature เท่ากันแต่พลังงานความร้อนรวมไม่เท่ากัน</li></ul>',note:'จำง่าย: Temperature บอกระดับร้อน/เย็น ส่วน Heat เป็นพลังงานที่ถ่ายเท',page:19,figure:20},
{title:'Temperature Scales',lead:'Kelvin และ Rankine เป็น Absolute Scales ส่วน Celsius/Fahrenheit เป็น Relative Scales',body:'<div class="formula-box">T(K) = T(°C) + 273.15</div><div class="formula-box">T(°F) = 1.8 × T(°C) + 32</div><p>การแปลง Celsius เป็น Kelvin ใช้ K = °C + 273.15 ส่วนสมการ Radiation ที่มี T ยกกำลังต้องใช้ค่า Absolute Temperature ในหน่วย Kelvin</p>',note:'กฎ Radiation ที่มี T ยกกำลังต้องใช้ Absolute Temperature (Kelvin)',page:21,figure:100},
{title:'Electromagnetic Spectrum และ Infrared',lead:'Infrared เป็นส่วนหนึ่งของคลื่นแม่เหล็กไฟฟ้าที่มีความยาวคลื่นยาวกว่า Visible Light',body:'<ul><li>Visible: ประมาณ 0.4–0.7 µm</li><li>Near IR: ประมาณ 0.8–1.7 µm</li><li>Short Wave IR: ประมาณ 2–6 µm</li><li>Long Wave IR: ประมาณ 8–14 µm</li></ul><p>กล้องแต่ละชนิดตอบสนองต่อช่วงคลื่นแตกต่างกัน ซึ่งมีผลต่อการใช้งานและการส่งผ่านในบรรยากาศ</p>',note:'ช่วงคลื่นเป็นคุณสมบัติสำคัญของระบบกล้อง',page:24,figure:24},
{title:'Atmospheric Transmission และ Thermodynamics',lead:'บรรยากาศดูดกลืน Infrared บางช่วงคลื่น และกฎ Thermodynamics อธิบายพฤติกรรมพลังงาน',body:'<p>ช่วง Low Atmospheric Transmittance อยู่ประมาณ 5.5–7.5 µm และกฎ Thermodynamics ทั้ง 4 ข้ออธิบายสมดุลและพฤติกรรมของพลังงาน</p><ul><li>Zeroth Law: ความสมดุลทางความร้อน</li><li>First Law: การอนุรักษ์พลังงาน</li><li>Second Law: ทิศทางของกระบวนการและ Entropy</li><li>Third Law: พฤติกรรมเมื่อเข้าใกล้ Absolute Zero</li></ul>',note:'กฎทั้งสี่เป็นพื้นฐานอธิบายสมดุลและการถ่ายเทพลังงาน',page:26,figure:27}
]},
{id:'ch4',num:'04',title:'Heat Transfer',subtitle:'กลไกการถ่ายเทความร้อนและคุณสมบัติทางความร้อนของวัสดุ',pages:'',description:'Conduction, Convection, Radiation, Thermal Capacity, Thermal Inertia และ Latent Heat',topics:['Basic Heat Transfer','Conduction','Thermal Conductivity','Fourier’s Law','Steady-State and Transient','Thermal Capacity / Specific Heat','Volumetric Heat Capacity','Thermal Inertia and Diffusivity','Convection','Newton’s Law of Cooling','Wind Effect','Evaporation / Condensation','Latent Heat'],slides:[
{title:'การถ่ายเทความร้อน 3 รูปแบบหลัก',lead:'ความร้อนถ่ายเทได้โดยการนำ การพา และการแผ่รังสี',body:'<p><b>Conduction:</b> ถ่ายเทพลังงานผ่านปฏิสัมพันธ์ระหว่างอนุภาค <b>Convection:</b> ถ่ายเทผ่านการเคลื่อนที่ของของไหล <b>Radiation:</b> ถ่ายเทพลังงานด้วยคลื่นแม่เหล็กไฟฟ้า</p><ul><li>Conduction เกิดได้ในสสารหลายสถานะ</li><li>Convection ต้องมีของไหลและการเคลื่อนที่</li><li>Radiation ไม่จำเป็นต้องมีตัวกลาง</li></ul>',note:'หนึ่งสถานการณ์อาจมีการถ่ายเทหลายรูปแบบพร้อมกัน',page:28,figure:29,visual:'heat'},
{title:'Conduction และ Fourier’s Law',lead:'อัตราการนำความร้อนขึ้นกับ k, พื้นที่, ความต่างอุณหภูมิ และความหนาทางนำ',body:'<div class="formula-box">Q̇ = k A (T₁ − T₂) / L</div><p>Q̇ คืออัตราการถ่ายเทความร้อน (W), k คือ Thermal Conductivity (W·m⁻¹·K⁻¹), A คือพื้นที่หน้าตัด (m²), ΔT คือความต่างอุณหภูมิ (K) และ L คือความยาวทางนำ (m)</p><p>เมื่อปัจจัยอื่นคงที่ k, A หรือ ΔT เพิ่มขึ้นทำให้ Q̇ เพิ่ม ส่วน L เพิ่มขึ้นทำให้ Q̇ ลดลง</p>',note:'สูตรพื้นฐานนี้ใช้กับกรณี Steady-State และสมมติฐานที่เหมาะสม',page:31,figure:32,visual:'fourier'},
{title:'Thermal Capacity, Inertia และ Diffusivity',lead:'Capacity บอกพลังงานที่ต้องใช้ ส่วน Diffusivity บอกการแพร่กระจายของอุณหภูมิ',body:'<p><b>Specific Heat:</b> พลังงานที่ต้องใช้เพิ่มอุณหภูมิต่อหน่วยมวล <b>Volumetric Heat Capacity:</b> ความจุความร้อนต่อหน่วยปริมาตร <b>Thermal Inertia:</b> การตอบสนองต่อการเปลี่ยนแปลงอุณหภูมิ</p><div class="formula-box">α = k / (ρ cₚ) = k / VHC</div>',note:'Thermal Diffusivity สูงหมายถึงการเปลี่ยนแปลงอุณหภูมิแพร่กระจายได้เร็วกว่า ภายใต้เงื่อนไขที่เหมาะสม',page:36,figure:38},
{title:'Convection, Wind Effect และ Latent Heat',lead:'ลมและการเปลี่ยนสถานะอาจทำให้ Thermogram แสดงรูปแบบที่ตีความผิดได้',body:'<div class="formula-box">Q̇ = h A (Tair − Tsurface)</div><p>Newton’s Law of Cooling อธิบาย Convective Heat Transfer โดย h ขึ้นกับชนิดของของไหลและสภาวะการไหล ลมเพิ่มการพาความร้อนและทำให้พื้นผิวเย็นลงได้</p><p>Evaporation ดูดพลังงานและทำให้ผิวเย็นลง ส่วน Condensation ปลดปล่อยพลังงานแฝง</p>',note:'บริเวณเย็นอาจเกิดจาก Evaporative Cooling ไม่ใช่ Defect โดยตรง',page:41,figure:43}
]},
{id:'ch5',num:'05',title:'Radiation Heat Transfer',subtitle:'Emission, Absorption, Reflection, Transmission และกฎการแผ่รังสี',pages:'',description:'Incident/Exitant Radiation, Emissivity, Blackbody, Planck, Wien และ Stefan–Boltzmann',topics:['Radiation Heat Transfer','Emission / Absorption / Reflection / Transmission','Incident and Exitant Radiation','Emissivity / Absorptivity / Reflectivity','Blackbody and Opaque Objects','Planck’s Law','Wien’s Displacement Law','Stefan–Boltzmann Law','Kirchhoff’s Law'],slides:[
{title:'Radiation Energy Exchange',lead:'รังสีที่ตกกระทบวัตถุอาจถูกดูดกลืน สะท้อน หรือส่งผ่าน',body:'<p>เนื้อหากำหนด Absorptivity (α), Reflectivity (ρ) และ Transmissivity (τ) โดยมีสมดุล:</p><div class="formula-box">α + ρ + τ = 1</div><p>Exitant Radiation ยังเกี่ยวข้องกับ Emission และ Reflection และอาจมี Transmission หากวัสดุโปร่งต่อช่วงคลื่นนั้น</p>',note:'วัตถุ Opaque ที่ไม่ส่งผ่านรังสีได้มี τ≈0 ดังนั้น α+ρ≈1 ภายใต้เงื่อนไขเดียวกัน',page:49,figure:49,visual:'radiation'},
{title:'Emissivity และ Kirchhoff’s Law',lead:'Emissivity แสดงความสามารถในการแผ่รังสีของพื้นผิวเมื่อเทียบกับ Blackbody',body:'<p>Blackbody อุดมคติมี Emissivity = 1 และดูดกลืนรังสีตกกระทบทั้งหมด ส่วนวัตถุจริงมี Emissivity ต่ำกว่า 1 โดยทั่วไป</p><p>Kirchhoff’s Law เชื่อมโยง Emissivity กับ Absorptivity ภายใต้สภาวะสมดุลและเงื่อนไขสเปกตรัม/ทิศทางที่สอดคล้องกัน</p><div class="formula-box">ε = α</div>',note:'สมการ ε=α มีเงื่อนไขของกฎ ไม่ใช่ความสัมพันธ์ที่ใช้ได้โดยไม่สนใจสภาวะ',page:53,figure:54},
{title:'Blackbody และ Planck’s Law',lead:'การกระจายพลังงานจาก Blackbody ขึ้นอยู่กับอุณหภูมิและความยาวคลื่น',body:'<p>Planck’s Law อธิบาย Spectral Radiance ของ Blackbody ที่ความยาวคลื่นหนึ่ง ๆ เมื่ออุณหภูมิเปลี่ยน รูปร่างและตำแหน่งของเส้นโค้งเปลี่ยนตาม</p><ul><li>อุณหภูมิสูงขึ้นทำให้พลังงานที่แผ่ออกเพิ่มขึ้น</li><li>พลังงานกระจายอยู่ในหลายความยาวคลื่น</li><li>Peak Wavelength เลื่อนไปยังคลื่นสั้นลงเมื่ออุณหภูมิสูงขึ้น</li></ul>',note:'กล้องตรวจจับพลังงานรังสีในช่วงคลื่นที่ Detector ออกแบบไว้',page:56,figure:59,visual:'planck'},
{title:'Wien’s Displacement และ Stefan–Boltzmann',lead:'กฎสองข้ออธิบาย Peak Wavelength และกำลังแผ่รังสีรวมของ Blackbody',body:'<div class="formula-box">λmax = 2898 / T &nbsp; (µm·K)</div><p>Wien’s Law แสดงความสัมพันธ์ผกผันระหว่างอุณหภูมิ Kelvin กับความยาวคลื่นที่มีการแผ่รังสีสูงสุด</p><div class="formula-box">M = σ T⁴</div><p>Stefan–Boltzmann Law ระบุว่ากำลังแผ่รังสีรวมต่อพื้นที่ของ Blackbody แปรผันกับอุณหภูมิสัมบูรณ์ยกกำลังสี่</p>',note:'T ต้องเป็น Kelvin และวัตถุจริงต้องคำนึงถึง Emissivity และสมมติฐานของสูตร',page:60,figure:61}
]},
{id:'ch6',num:'06',title:'Thermal Image Interpretation',subtitle:'การเกิดภาพความร้อนจากระบบ Optical, Detector และ FPA',pages:'',description:'ระบบรับรังสี การสร้างสัญญาณ Pixel, Resolution, FOV, IFOV, MRTD และ Apparent Temperature',topics:['Camera Principle','Lens and Optical System','Filters','Detector and FPA','Thermal Image Formation','Pixels and Resolution','FOV and IFOV','MRTD','Apparent Temperature'],slides:[
{title:'เส้นทางจาก Radiation สู่ Thermal Image',lead:'ภาพความร้อนเกิดจากการรับรังสีผ่านเลนส์ แล้วแปลงเป็นสัญญาณที่ประมวลผลได้',body:'<p>ลำดับเชิงแนวคิดคือ Radiation จากเป้าหมาย → Lens/Window → Filter (ถ้ามี) → Detector/FPA → Electronics/Signal Processing → Display</p><ul><li>วัสดุของ Lens และ Window ต้องส่งผ่าน Infrared ในช่วงที่กล้องใช้งาน</li><li>FPA มีองค์ประกอบตรวจจับหลาย Pixel</li><li>ระบบประมวลผลแปลงสัญญาณเป็นภาพและค่าที่แสดงผล</li></ul>',note:'วัสดุที่โปร่งใสต่อแสง Visible อาจไม่โปร่งใสต่อ Infrared',page:64,figure:63,visual:'camera'},
{title:'Thermal Image เป็นภาพ Radiation Intensity',lead:'Thermogram ไม่ใช่ภาพถ่ายอุณหภูมิจริงโดยตรง',body:'<p>Thermal Image เป็นภาพของ <b>Radiation Intensity</b> กล้องคำนวณอุณหภูมิจากสัญญาณที่ตรวจจับ โดยอาศัย Emissivity, Reflected Apparent Temperature และพารามิเตอร์ที่เกี่ยวข้อง</p><p>การตั้งค่าผิดจึงทำให้ Temperature Reading ผิดได้</p>',note:'สีเป็น Palette ที่ใช้เข้ารหัสสัญญาณ ไม่ใช่สีจริงและไม่ใช่ Temperature โดยตรง',page:68,figure:68},
{title:'Pixel, Resolution, FOV และ IFOV',lead:'จำนวน Pixel และมุมมองของกล้องมีผลต่อรายละเอียดที่สามารถแยกได้',body:'<p><b>FOV</b> คือพื้นที่/มุมมองทั้งหมดที่กล้องเห็น ส่วน <b>IFOV</b> คือมุมมองที่สัมพันธ์กับ Pixel หนึ่งหน่วย ยิ่งวัตถุอยู่ไกล Footprint ของ Pixel บนวัตถุยิ่งใหญ่ขึ้น</p><ul><li>Resolution สูงขึ้นช่วยเพิ่มจำนวน Pixel</li><li>Pixel count สูงไม่ได้รับประกันว่าจะเห็น Defect เล็กได้เสมอ</li><li>Digital Zoom ไม่เพิ่มรายละเอียดที่ detector ไม่ได้เก็บ</li></ul>',note:'ระยะทางและ IFOV ต้องพิจารณาร่วมกับขนาดเป้าหมาย',page:69,figure:69,visual:'ifov'},
{title:'MRTD และ Apparent Temperature',lead:'การแยกแยะรายละเอียดและการชดเชยสัญญาณเป็นคนละประเด็น',body:'<p>MRTD (Minimum Resolvable Temperature Difference) เป็นความต่างอุณหภูมิต่ำสุดที่ระบบสามารถแยกแยะรูปแบบเป้าหมายได้ภายใต้เงื่อนไขที่กำหนด ส่วน Apparent Temperature เป็นอุณหภูมิที่ปรากฏจากรังสีที่ตรวจจับได้</p><p>Apparent Temperature อาจต่างจากอุณหภูมิพื้นผิวจริง โดยเฉพาะเมื่อ Emissivity ต่ำหรือมีรังสีสะท้อนจากสภาพแวดล้อม</p>',note:'MRTD ไม่ใช่ค่าเดียวกับความแม่นยำของการวัดอุณหภูมิ',page:71,figure:72}
]},
{id:'ch7',num:'07',title:'Thermal Image Analysis',subtitle:'การวิเคราะห์ Thermal Gradient, Thermal Tuning และ Pattern ที่อาจทำให้เข้าใจผิด',pages:'',description:'แปลผลรูปแบบความร้อนและแยก Reflection หรือ Emissivity Difference ออกจากความผิดปกติ',topics:['Analyzing the Image','Thermal Gradient','Thermal Tuning','Isotherm','Thermal Palettes','Misleading Patterns','Spot Reflections','Avoiding False Interpretations'],slides:[
{title:'เริ่มวิเคราะห์ภาพอย่างมีระบบ',lead:'อย่าเริ่มจากการตัดสินว่าจุดร้อนหรือจุดเย็นคือ Defect ทันที',body:'<p>เริ่มจากทำความเข้าใจชิ้นงาน เงื่อนไขการถ่ายภาพ และลักษณะการกระจายอุณหภูมิ จากนั้นจึงพิจารณา Thermal Gradient, รูปแบบการเปลี่ยนแปลง และบริเวณอ้างอิง</p><ul><li>ตรวจว่าภาพ Focus และองค์ประกอบเหมาะสมหรือไม่</li><li>ดูความสัมพันธ์ระหว่างบริเวณที่สงสัยกับพื้นที่โดยรอบ</li><li>พิจารณา Reflection และ Emissivity Differences</li></ul>',note:'Thermogram หนึ่งภาพโดยไม่มีข้อมูลบริบทอาจไม่เพียงพอสำหรับสรุปผล',page:74,figure:75},
{title:'Thermal Gradient',lead:'Thermal Gradient คือการเปลี่ยนแปลงของอุณหภูมิตามตำแหน่ง',body:'<p>Gradient แสดงการเปลี่ยนแปลงของอุณหภูมิเมื่อเปลี่ยนตำแหน่งบนพื้นผิว ทิศทางและความชันอาจช่วยให้เข้าใจการถ่ายเทความร้อนและรูปแบบบนชิ้นงาน</p>',note:'อย่าตีความ Gradient เพียงอย่างเดียวว่าเป็นความลึกของ Defect',page:75,figure:75},
{title:'Thermal Tuning และ Palette',lead:'ปรับช่วงแสดงผลและเลือก Palette เพื่อเห็น Pattern ชัดขึ้น',body:'<p>Thermal Tuning คือการปรับการแสดงภาพ เช่น Level และ Span ส่วน Palette เป็นการแมปค่าความเข้มสัญญาณไปเป็นชุดสีต่าง ๆ</p><ul><li>Palette ต่างกันอาจทำให้ภาพดูต่างทั้งที่ข้อมูลต้นทางเหมือนเดิม</li><li>Grey, Rainbow และ Ironbow เป็นรูปแบบการแสดงผล</li><li>เลือก Palette ตามความสามารถในการแยก Contrast</li></ul>',note:'การเปลี่ยน Palette ไม่ได้เปลี่ยนค่ารังสีหรืออุณหภูมิที่วัดได้',page:78,figure:78},
{title:'Misleading Patterns และ Reflection',lead:'จุดสว่าง/มืดบางจุดอาจเป็น Reflection ไม่ใช่ความผิดปกติของชิ้นงาน',body:'<p>Spot Reflections และ Emissivity Differences เป็นสาเหตุที่อาจทำให้วิเคราะห์ผิด เช่น พื้นผิวโลหะเรียบสะท้อนแหล่งความร้อนหรือรังสีของผู้ตรวจ</p><ul><li>เปลี่ยนมุมกล้องแล้วจุดสะท้อนอาจเคลื่อนที่หรือหายไป</li><li>ตรวจสอบพื้นผิวที่มี Emissivity ต่างกัน</li><li>พิจารณา Pattern ต่อเนื่องกับรูปทรงและสภาพแวดล้อม</li></ul>',note:'จุดร้อนที่เคลื่อนเมื่อเปลี่ยนมุมกล้องอาจเป็น Reflection Artifact',page:80,figure:80}
]},
{id:'ch8',num:'08',title:'Qualitative and Quantitative',subtitle:'เปรียบเทียบการวิเคราะห์เชิงคุณภาพและเชิงปริมาณ',pages:'',description:'เข้าใจความแตกต่างของการหา Thermal Pattern และการใช้ค่าที่วัดได้เพื่อประเมิน',topics:['Qualitative Thermography','Quantitative Thermography','Differences and Applications','Measurement Considerations','Limitations'],slides:[
{title:'Qualitative Thermography',lead:'เน้นวิเคราะห์รูปแบบ Thermal Pattern เพื่อค้นหาความแตกต่าง',body:'<p>Qualitative Thermography ใช้รูปแบบ เช่น รูปร่าง ตำแหน่ง และความแตกต่างของภาพ เพื่อค้นหาบริเวณที่อาจมีปัญหา</p><ul><li>เหมาะกับการสำรวจและเปรียบเทียบ Pattern</li><li>ผลอาจอาศัยประสบการณ์และสภาวะการตรวจ</li><li>ไม่จำเป็นต้องใช้การวัดอุณหภูมิที่แม่นยำทุกกรณี</li></ul>',note:'Qualitative ตอบว่า “รูปแบบแตกต่างหรือไม่/อยู่ตรงไหน”',page:82,figure:82},
{title:'Quantitative Thermography',lead:'เน้นใช้ค่าการวัดอุณหภูมิหรือพารามิเตอร์เชิงปริมาณ',body:'<p>Quantitative Thermography ต้องคำนึงถึงพารามิเตอร์ การชดเชย และความแม่นยำของการวัด เพื่อใช้ค่าที่ได้ในการประเมินหรือเปรียบเทียบอย่างเหมาะสม</p><ul><li>ให้ความสำคัญกับ Emissivity และ Reflected Apparent Temperature</li><li>ตรวจสอบเงื่อนไขแวดล้อม</li><li>อาจต้องมี Calibration และการอ้างอิงที่เหมาะสม</li></ul>',note:'การมีตัวเลขไม่ได้รับประกันความแม่นยำ หากพารามิเตอร์ไม่ถูกต้อง',page:82,figure:82},
{title:'เปรียบเทียบและเลือกใช้',lead:'ทั้งสองแนวทางเสริมกันและเลือกตามวัตถุประสงค์',body:'<p>Qualitative อาจใช้ค้นหา/ระบุตำแหน่งก่อน ส่วน Quantitative ใช้เมื่อจำเป็นต้องวัดค่าหรือประเมินระดับความแตกต่าง การเลือกวิธีขึ้นกับวัตถุประสงค์ Procedure และคุณภาพข้อมูล</p>',note:'จำความแตกต่างจาก “สิ่งที่ต้องการได้จากผลตรวจ”',page:82,figure:82}
]},
{id:'ch9',num:'09',title:'Factors Influencing Emissivity',subtitle:'ปัจจัยที่ทำให้ Emissivity แตกต่างและส่งผลต่อการวัด',pages:'',description:'วัสดุ พื้นผิว รูปร่าง มุมมอง ความยาวคลื่น และอุณหภูมิส่งผลอย่างไรต่อ Emissivity และ Reflection',topics:['Material','Surface Structure and Roughness','Geometry','Angle','Wavelength','Temperature','Reflected Apparent Temperature','Solutions to Emissivity Problems'],slides:[
{title:'Material และ Surface Condition',lead:'Emissivity ไม่ใช่ค่าคงที่เดียวสำหรับวัสดุทุกสภาพพื้นผิว',body:'<p>Emissivity แตกต่างตามชนิดวัสดุและสภาพพื้นผิว เช่น โลหะขัดเงา พื้นผิวออกซิไดซ์ หรือเคลือบผิว</p><ul><li>โลหะขัดเงามักมี Emissivity ต่ำกว่าโลหะที่ออกซิไดซ์</li><li>ผิวหยาบหรือมีโครงสร้างอาจเพิ่มการดูดกลืน/การแผ่รังสี</li><li>สีที่ตามองเห็นไม่สามารถใช้ตัดสิน Emissivity โดยตรง</li></ul>',note:'การเลือกค่า Emissivity จากชื่อวัสดุอย่างเดียวอาจไม่พอ',page:83,figure:93},
{title:'Geometry และ Multiple Reflection',lead:'รูปทรงและโพรงผิวอาจทำให้รังสีสะท้อนหลายครั้งก่อนออกจากชิ้นงาน',body:'<p>Surface Geometry เช่น ร่อง รู รูปทรงเว้า และมุมต่าง ๆ เปลี่ยนเส้นทางของรังสีและอาจเพิ่มการดูดกลืนเชิงประสิทธิผลจาก Multiple Reflections ในโพรง</p>',note:'วัสดุเดียวกันอาจแสดง Emissivity เชิงผลต่างกันตาม Geometry',page:85,figure:85},
{title:'Angle, Wavelength และ Temperature',lead:'มุมมองและช่วงคลื่นที่วัดอาจส่งผลต่อ Emissivity',body:'<p>การวัดตั้งฉากและการวัดที่มุมเฉียงอาจให้ผลต่างกัน โดยเฉพาะพื้นผิวบางชนิด นอกจากนี้ Emissivity อาจแปรตาม Wavelength และ Temperature</p><ul><li>พิจารณามุมกล้องเทียบกับพื้นผิว</li><li>พิจารณาช่วงคลื่นของกล้อง</li><li>อย่าสมมติว่าค่า Emissivity คงที่ในทุกอุณหภูมิ</li></ul>',note:'ตารางวัสดุเป็นแนวทาง ต้องยืนยันกับสภาพพื้นผิวและช่วงวัดจริง',page:87,figure:87},
{title:'Reflected Apparent Temperature',lead:'กล้องอาจรับรังสีจากสิ่งแวดล้อมที่สะท้อนบนพื้นผิวเป้าหมาย',body:'<p>Reflected Apparent Temperature คืออุณหภูมิปรากฏของแหล่งรังสีแวดล้อมที่ถูกสะท้อนเข้าสู่กล้อง สำคัญมากเมื่อพื้นผิวมี Emissivity ต่ำ</p><p>ผู้วัดควรพิจารณาแหล่งร้อน/เย็นรอบตัว มุมมอง และการสะท้อนก่อนตีความค่าอุณหภูมิ</p>',note:'พื้นผิวโลหะมันวาวอาจดูร้อนเพราะสะท้อนผู้ตรวจหรือแหล่งร้อนอื่น',page:89,figure:90}
]},
{id:'ch10',num:'10',title:'Measuring Emissivity',subtitle:'แนวคิดและขั้นตอนการวัด Emissivity',pages:'',description:'วิธีใช้พื้นผิวอ้างอิง/เทป Emissivity ที่ทราบค่าเพื่อหาค่าของวัสดุตัวอย่าง',topics:['Estimating Emissivity','Reference Surface','Black Electrical Tape Method','Reflected Apparent Temperature','Temperature Comparison','Typical Emissivity Table'],slides:[
{title:'หลักการวัด Emissivity',lead:'เปรียบเทียบอุณหภูมิจากบริเวณอ้างอิงกับพื้นผิวที่ต้องการหา Emissivity',body:'<p>บทเรียนแนะนำให้ใช้พื้นผิวที่ทราบ Emissivity เช่น Black Electrical Tape จากนั้นตั้งค่ากล้องให้สอดคล้องกับเทปและวัดอุณหภูมิ ก่อนย้าย Spot Meter ไปยังพื้นผิวตัวอย่างและปรับ Emissivity จนค่าที่อ่านได้สอดคล้องกัน</p><ul><li>ควบคุมสภาพแวดล้อมและ Reflection</li><li>ตัวอย่างและเทปควรมีอุณหภูมิใกล้สมดุล</li><li>ใช้ตำแหน่งวัดที่เหมาะสมและ Focus ชัดเจน</li></ul>',note:'เป็นวิธีตามคู่มือ ไม่ใช่ข้อกำหนดสากลสำหรับทุกวัสดุหรือกล้อง',page:92,figure:92},
{title:'ลำดับขั้นตอนตามหลักการที่เรียน',lead:'เตรียมผิว วัด Reflected Apparent Temperature ให้ความร้อน และเปรียบเทียบค่า',body:'<ol><li>หลีกเลี่ยง Forced Convection และ Spot Reflection</li><li>ประเมิน Reflected Apparent Temperature โดยตั้ง Emissivity = 1.0 และ Distance = 0 ตามหลักการที่เรียน</li><li>ติด Black Electrical Tape ที่ทราบค่า Emissivity</li><li>ให้ความร้อนอย่างสม่ำเสมอ สูงกว่าอุณหภูมิห้องอย่างน้อย 20 K</li><li>ตั้ง Emissivity ตามเทป (ตัวอย่างใช้ 0.95) และวัดอุณหภูมิ</li><li>ย้าย Spot Meter ไปพื้นผิวตัวอย่างและปรับ Emissivity จนค่าตรงกัน</li><li>บันทึกค่าที่ได้</li></ol>',note:'วิธีการให้ความร้อนต้องอยู่ภายใต้ Procedure ที่อนุมัติสำหรับชิ้นงานจริง',page:92,figure:93},
{title:'ความผิดพลาดที่ควรระวัง',lead:'การวัดที่ไม่ควบคุมสภาวะอาจทำให้ค่า Emissivity ที่หาได้คลาดเคลื่อน',body:'<p>ปัจจัยสำคัญได้แก่ ความร้อนไม่สม่ำเสมอ เทปสัมผัสไม่ดี Reflection จากแหล่งร้อน/เย็น ความแตกต่างของอุณหภูมิผิว และตำแหน่งวัดที่ไม่เหมาะสม</p><p>ตาราง Typical Emissivity เป็นค่าตัวอย่างของวัสดุและสภาพผิว ไม่ควรใช้แทนการตรวจสอบกับตัวอย่างจริงโดยอัตโนมัติ</p>',note:'ค่า Emissivity ควรพิจารณา Material, Surface Condition, Wavelength และเงื่อนไขการวัด',page:93,figure:93}
]},
{id:'ch11',num:'11',title:'Camera Calibration',subtitle:'หลักการสอบเทียบกล้องด้วย Blackbody Reference Source',pages:'',description:'บทบาทแหล่งกำเนิดรังสีอ้างอิง การสร้าง Calibration Curve และการตรวจสอบ Calibration',topics:['How Camera is Calibrated','Blackbody Reference Source','Calibration Environment','Calibration Curve','Signal Intensity','Calibration Check','Reference Sources'],slides:[
{title:'เหตุใดจึงต้อง Calibration?',lead:'กล้องแปลงสัญญาณรังสีเป็นค่าที่แสดงผล จึงต้องมีความสัมพันธ์ที่ตรวจสอบได้ระหว่างสัญญาณกับอุณหภูมิ',body:'<p>Calibration ใช้แหล่งอ้างอิง Blackbody ที่ทราบอุณหภูมิ เพื่อสร้างความสัมพันธ์ระหว่างการตอบสนองของกล้องกับอุณหภูมิภายใต้สภาพแวดล้อมที่ควบคุม</p><ul><li>Blackbody Source เป็นแหล่งอ้างอิงรังสี</li><li>เก็บค่า Signal/Response จากหลายอุณหภูมิ</li><li>สร้าง Calibration Curve เพื่อใช้แปลงสัญญาณเป็นอุณหภูมิ</li></ul>',note:'Calibration ไม่ได้ทำให้ความไม่แน่นอนทุกชนิดหายไป แต่ช่วยให้ความสัมพันธ์การวัดตรวจสอบย้อนกลับได้',page:94,figure:94},
{title:'Calibration Curve',lead:'จุดข้อมูลจาก Blackbody หลายอุณหภูมิถูกใช้สร้างความสัมพันธ์ของสัญญาณกับอุณหภูมิ',body:'<p>กล้องมองแหล่งอ้างอิงที่อุณหภูมิทราบค่าและบันทึก Response/Signal จากนั้นใช้ข้อมูลสร้าง Calibration Curve และบันทึกไว้ในระบบของกล้องตามคู่มือ</p><p>เนื้อหากำหนดว่าแหล่งอ้างอิงได้รับการรับรองและสอบกลับได้ถึงมาตรฐานสากล</p>',note:'Calibration Curve ไม่จำเป็นต้องเป็นเส้นตรงเสมอ',page:95,figure:95},
{title:'Calibration Check และข้อจำกัด',lead:'การตรวจสอบยืนยันความสอดคล้องไม่เหมือนกับการทำ Calibration ใหม่ทั้งหมด',body:'<p>Calibration Check ใช้ตรวจการตอบสนองของกล้องกับแหล่งอ้างอิง ทั้งนี้ต้องคำนึงถึง Emissivity และอุณหภูมิแวดล้อม</p><p>Self-calibration/NUC อาจปรับความสม่ำเสมอของ Detector แต่ไม่ควรเข้าใจว่าแทนการสอบเทียบเชิงมาตรวิทยาได้โดยอัตโนมัติ</p>',note:'รอบ Calibration และเกณฑ์ยอมรับต้องอิงข้อกำหนดอุปกรณ์/องค์กรที่ใช้งาน',page:96,figure:95}
]},
{id:'ch12',num:'12',title:'Thermographic Laws & Formulae',subtitle:'รวบรวมกฎและสมการที่ใช้ใน Thermography',pages:'',description:'ทบทวนสมการการนำ การพา สมดุลรังสี Emissivity และ Temperature Scale พร้อมฝึกคำนวณ',topics:['Fourier’s Law','Newton’s Law of Cooling','Radiation Energy Balance','Kirchhoff’s Law','Stefan–Boltzmann Law','Real Body Radiation','Emissivity','Temperature Scales'],slides:[
{title:'สูตรการนำและการพาความร้อน',lead:'เลือกสมการให้ตรงกับกลไก Heat Transfer',body:'<div class="formula-box">Q̇ = kA(T₁ − T₂) / L</div><p>Fourier’s Law ใช้อธิบาย Conduction ภายใต้สมมติฐานที่กำหนด</p><div class="formula-box">Q̇ = hA(Tair − Tsurface)</div><p>Newton’s Law of Cooling ใช้อธิบาย Convective Heat Transfer โดย h เป็น Heat Transfer Coefficient</p>',note:'ตรวจหน่วยก่อนแทนค่า: k (W/m·K), h (W/m²·K), A (m²), L (m), Q̇ (W)',page:97,figure:97},
{title:'สมดุลพลังงานรังสี',lead:'สัดส่วนพลังงานที่ดูดกลืน สะท้อน และส่งผ่านรวมกันเป็นหนึ่ง',body:'<div class="formula-box">α + ρ + τ = 1</div><p>Kirchhoff’s Law เชื่อมโยง Absorptivity กับ Emissivity ภายใต้เงื่อนไขที่เหมาะสม</p><div class="formula-box">ε = α</div><p>สำหรับวัตถุ Opaque ที่ไม่ส่งผ่านรังสี τ≈0 ดังนั้น α+ρ≈1</p>',note:'α, ρ, τ คือ Absorptivity, Reflectivity และ Transmissivity',page:98,figure:98},
{title:'Stefan–Boltzmann และ Emissivity',lead:'กำลังแผ่รังสีรวมของ Blackbody แปรตามอุณหภูมิสัมบูรณ์ยกกำลังสี่',body:'<div class="formula-box">Mᵦ = σT⁴</div><p>สำหรับ Grey Body ในแบบจำลองพื้นฐาน:</p><div class="formula-box">M = εσT⁴</div><p>σ เป็น Stefan–Boltzmann Constant และ T ใช้ Kelvin</p>',note:'สมการพื้นฐานนี้ละรายละเอียด spectral band, Reflection, Atmosphere และ Geometry',page:99,figure:99},
{title:'Temperature Scale และการเลือกสูตร',lead:'ค่าคงที่และหน่วยมีผลโดยตรงต่อคำตอบ',body:'<p>สูตรแปลง Celsius/Fahrenheit ใช้แปลงค่าระหว่างสเกล ส่วน Wien’s Law และ Stefan–Boltzmann Law ต้องใช้ Kelvin</p><ul><li>แปลงหน่วยก่อนคำนวณ</li><li>แยก Temperature Difference กับ Absolute Temperature</li><li>ตรวจหน่วยผลลัพธ์ เช่น W, W/m², µm</li></ul>',note:'ใช้ค่า Kelvin offset 273.15 สำหรับการแปลง Celsius เป็น Kelvin และตรวจหน่วยก่อนแทนค่าในสมการ',page:100,figure:100}
]},
{id:'appA',num:'A',title:'Active and Passive Thermography',subtitle:'เปรียบเทียบการตรวจโดยไม่ให้และให้พลังงานกระตุ้น',pages:'',description:'Passive/Active Thermography, Through Transmission, Reflection และ Flash Thermography',topics:['Passive Thermography','Active Thermography','Through Transmission','Single-Side Reflection','Flash Thermography','Lock-in Thermography','Step Heating','Vibrothermography'],slides:[
{title:'Passive vs Active Thermography',lead:'ความแตกต่างหลักอยู่ที่แหล่งกำเนิดการเปลี่ยนแปลงความร้อน',body:'<p><b>Passive Thermography</b> สังเกตความแตกต่างอุณหภูมิที่มีอยู่ตามธรรมชาติหรือเกิดจากสภาวะการทำงาน ส่วน <b>Active Thermography</b> ใช้แหล่งพลังงานภายนอกกระตุ้นให้เกิด Thermal Contrast แล้วสังเกตการตอบสนอง</p>',note:'Active หมายถึงมีการกระตุ้นพลังงานเพื่อสร้าง Thermal Response',page:101,figure:101},
{title:'Through Transmission และ Reflection',lead:'รูปแบบการจัดวางแหล่งพลังงานและกล้องกำหนดวิธีสังเกตการตอบสนอง',body:'<p>Through Transmission วางแหล่งพลังงานด้านหนึ่งและกล้องอีกด้านหนึ่งของชิ้นงาน ส่วน Single-Side Reflection วางแหล่งพลังงานและกล้องอยู่ด้านเดียวกันของชิ้นงาน</p><p>การเลือกแบบขึ้นกับการเข้าถึงทั้งสองด้าน วัสดุ รูปทรง และวัตถุประสงค์การตรวจ</p>',note:'อย่าสับสนกับ Reflection ของรังสีจากสิ่งแวดล้อมบนผิว ซึ่งเป็นสาเหตุของการวัดคลาดเคลื่อน',page:102,figure:102},
{title:'Flash, Lock-in และ Step Heating',lead:'เทคนิค Active ใช้วิธีให้พลังงานต่างกันเพื่อสร้าง Thermal Contrast',body:'<ul><li><b>Flash:</b> ใช้พลังงานช่วงสั้นแล้วบันทึกการเปลี่ยนแปลงหลัง Pulse</li><li><b>Lock-in:</b> ใช้ความร้อนที่เปลี่ยนแปลงเป็นคาบและวิเคราะห์ Phase/Amplitude</li><li><b>Step Heating:</b> ให้ความร้อนเป็นช่วง/ขั้นและสังเกตตามเวลา</li><li><b>Vibrothermography:</b> ใช้การสั่นเพื่อกระตุ้นความร้อนในบริเวณรอยบกพร่องบางชนิด</li></ul>',note:'แต่ละ Technique มีข้อจำกัดและพารามิเตอร์เฉพาะ ต้องอ้างอิง Procedure ที่อนุมัติ',page:103,figure:103}
]},
{id:'appB',num:'B',title:'Instruction Writing and Reporting',subtitle:'ศัพท์ NDT การเขียน Instruction และ Inspection Report',pages:'',description:'Method, Technique, Procedure, Instruction และตัวอย่าง Water Ingress Inspection',topics:['NDT Terminology','Method / Technique / Procedure / Instruction','Instruction Writing','What / Why / Where / When / Who / How / What-if','Report Writing','Aerospace Water Ingress Case Study'],slides:[
{title:'Method, Technique, Procedure และ Instruction',lead:'คำศัพท์แต่ละคำกำหนดระดับความเฉพาะเจาะจงของวิธีและขั้นตอนการตรวจสอบ',body:'<ul><li><b>Method:</b> วิธี NDT เช่น Thermographic Testing</li><li><b>Technique:</b> วิธีเฉพาะ เช่น Flash หรือ Passive Thermography</li><li><b>Procedure:</b> เอกสารที่กำหนดขั้นตอนและเงื่อนไขการตรวจอย่างเป็นระบบ</li><li><b>Instruction:</b> คำสั่ง/เอกสารเฉพาะสำหรับการตรวจชิ้นงานหรือการปฏิบัติงานหนึ่ง</li></ul>',note:'นิยามแต่ละองค์กรหรือมาตรฐานอาจมีรายละเอียดเฉพาะ ต้องใช้คำจำกัดความให้สอดคล้องกับมาตรฐานและระบบงานที่นำมาใช้',page:104,figure:104},
{title:'หลักการเขียน Instruction: 7 Questions',lead:'ตอบคำถามพื้นฐานเพื่อให้ผู้ตรวจเข้าใจตรงกัน',body:'<p>What, Why, Where, When, Who, How และ What-if</p><ul><li>What: ตรวจอะไร / ชิ้นงานใด</li><li>Why: วัตถุประสงค์</li><li>Where: ตำแหน่งหรือขอบเขต</li><li>When: เงื่อนไข/เวลาที่ต้องตรวจ</li><li>Who: คุณสมบัติผู้ตรวจ</li><li>How: อุปกรณ์และขั้นตอน</li><li>What-if: วิธีจัดการกรณีผิดปกติ</li></ul>',note:'Instruction ที่ชัดเจนช่วยลดความกำกวมและเชื่อมโยงกับ Procedure/Reference',page:106,figure:107},
{title:'การเขียน Report',lead:'รายงานต้องทำให้ผู้อ่านเข้าใจสิ่งที่ตรวจ วิธีตรวจ และผลที่พบ',body:'<p>รายงานควรระบุข้อมูลชิ้นงาน วิธี/เทคนิค อุปกรณ์ ผลการตรวจ ตำแหน่งและลักษณะ Indication รวมถึงข้อมูลที่จำเป็นตาม Procedure และข้อกำหนดขององค์กร</p><p>คู่มือเน้นการบันทึกข้อมูลชัดเจนและตรวจสอบย้อนกลับได้</p>',note:'อย่าใส่ Acceptance Criteria หากไม่ได้มาจากมาตรฐานหรือ Procedure ที่ใช้จริง',page:105,figure:105},
{title:'Case Study: Water Ingress in Honeycomb Floor Panel',lead:'ตัวอย่าง Instruction สำหรับตรวจ Trapped Water ภายใน Carbon Fibre Honeycomb Core',body:'<p>กรณีศึกษานี้เป็นตัวอย่าง NDT Instruction สำหรับ Floor Panel Part No. 105997-2 วัสดุ Carbon Fibre with Nomex Honeycomb Core วัตถุประสงค์คือ Detect Water Ingress ภายใน Honeycomb Cores</p><p>ตัวอย่างระบุ FLIR Systems B620, Leister Hotwind Heater Gun และ Omega RH85 Temperature/Humidity Meter</p>',note:'กรณีศึกษานี้ใช้ฝึกอ่านโครงสร้างและเงื่อนไขของ Instruction เท่านั้น หากพบข้อมูลควบคุมเอกสารไม่ตรงกันในการทำงานจริง ต้องขอการยืนยันจากผู้รับผิดชอบก่อนใช้งาน',page:109,figure:110}
]}
];

const ndtSupplementalSlides = {
 foundation:[
  {title:'พลังงานถ่ายเทอย่างไร?',lead:'ความร้อนจะถ่ายเทสุทธิเมื่อมีความแตกต่างของอุณหภูมิและมีเส้นทางการถ่ายเท',body:'<p>เมื่อวัตถุหรือบริเวณสองส่วนมีอุณหภูมิต่างกัน พลังงานมีแนวโน้มถ่ายเทจากบริเวณที่ร้อนกว่าไปยังบริเวณที่เย็นกว่า จนเข้าใกล้สมดุลทางความร้อน</p><ul><li>Conduction ต้องอาศัยปฏิสัมพันธ์ภายในตัวกลาง</li><li>Convection เกี่ยวข้องกับการเคลื่อนที่ของของไหล</li><li>Radiation ถ่ายทอดพลังงานด้วยคลื่นแม่เหล็กไฟฟ้าและไม่จำเป็นต้องมีตัวกลาง</li></ul>',note:'กลไกเหล่านี้อาจเกิดร่วมกันในการตรวจ Thermography',page:29,figure:29,visual:'heat'},
  {title:'อ่าน Thermogram อย่างระมัดระวัง',lead:'สีเป็นวิธีแสดงข้อมูล ไม่ใช่หลักฐานของอุณหภูมิจริงหรือ Defect โดยตรง',body:'<p>Thermal Palette แมปค่าที่กล้องประมวลผลให้เป็นสีหรือระดับเทา ผู้เรียนจึงควรอ่าน Scale, Range, Emissivity และเงื่อนไขการถ่ายภาพควบคู่กัน</p><ul><li>ห้ามสรุปว่า “สีแดงคือ Defect” โดยไม่มีหลักฐานอื่น</li><li>ตรวจสอบแหล่ง Reflection และความแตกต่างของพื้นผิว</li><li>ใช้ภาพและข้อมูลอ้างอิงที่ถ่ายภายใต้เงื่อนไขเหมาะสม</li></ul>',note:'เริ่มจากถามว่า “กล้องตรวจจับอะไร” ก่อนถามว่า “วัตถุมีอุณหภูมิเท่าไร”',page:68,figure:68,visual:'thermo'}
 ],
 ch1:[
  {title:'Thermography เป็น NDT แบบใด?',lead:'เป็นการตรวจด้วยรังสีความร้อนที่พื้นผิว และต้องอาศัยการถ่ายเทความร้อนเพื่อให้เกิด Contrast',body:'<p>บทเรียนอธิบายว่า Thermography ใช้ข้อมูลจากพื้นผิวเพื่อวิเคราะห์ Thermal Pattern ในบางกรณี ความผิดปกติภายในส่งผลต่อการไหลหรือการกระจายความร้อนจนแสดงออกบนพื้นผิวได้</p><ul><li>ผลที่เห็นเป็นการตอบสนองทางความร้อน ไม่ใช่ภาพโครงสร้างภายในโดยตรง</li><li>ความลึกและชนิดของความผิดปกติไม่สามารถสรุปจากสีเพียงอย่างเดียว</li><li>การแปลผลต้องสอดคล้องกับ Technique และเกณฑ์ที่ใช้</li></ul>',note:'Thermography ตรวจจับผลทางความร้อนที่ปรากฏบนพื้นผิว',page:7,figure:7,visual:'thermo'},
  {title:'ข้อดีและข้อจำกัดต้องพิจารณาคู่กัน',lead:'Non-contact และ Real-time เป็นข้อดี แต่สภาพแวดล้อมและพื้นผิวมีผลต่อข้อมูล',body:'<p>ข้อดีตามหลักการที่เรียน ได้แก่ ไม่ต้องสัมผัสชิ้นงาน แสดงรูปแบบเชิงพื้นที่ และติดตามการเปลี่ยนแปลงได้รวดเร็ว อย่างไรก็ตามผลตรวจอาจได้รับอิทธิพลจาก Emissivity, Reflection, ระยะ, Focus, ลม และความแตกต่างของวัสดุ</p><p>จึงต้องเลือกวิธีการและสภาวะตรวจให้สอดคล้องกับวัตถุประสงค์ ไม่ควรถือว่าภาพที่คมชัดหมายถึงผลตรวจถูกต้องโดยอัตโนมัติ</p>',note:'ความเร็วในการเก็บภาพไม่ทดแทนการควบคุมตัวแปรและการตีความ',page:8,figure:8}
 ],
 ch2:[
  {title:'เหตุใด Focus และระยะทางจึงสำคัญ?',lead:'ภาพที่ไม่คมชัดและเป้าหมายที่เล็กเกินไปอาจทำให้รายละเอียดเชิงพื้นที่สูญหาย',body:'<p>การ Focus ช่วยให้ภาพของเป้าหมายตกบน Detector ได้เหมาะสม ส่วนระยะทางสัมพันธ์กับขนาดพื้นที่ที่ Pixel ครอบคลุม (Pixel Footprint) เมื่อเป้าหมายมีขนาดเล็กหรืออยู่ไกล รายละเอียดอาจไม่ถูกแยกแยะเพียงพอ</p><ul><li>Focus ผิดทำให้ขอบเขต Thermal Pattern เบลอ</li><li>ระยะไกลทำให้ Pixel ครอบคลุมพื้นที่บนชิ้นงานใหญ่ขึ้น</li><li>Digital Zoom ไม่ได้สร้างข้อมูลเชิงพื้นที่ที่ Detector ไม่ได้เก็บ</li></ul>',note:'Focus, IFOV, ขนาดเป้าหมาย และระยะทางต้องพิจารณาร่วมกัน',page:18,figure:18,visual:'camera'},
  {title:'Level และ Span เปลี่ยนภาพ ไม่ได้เปลี่ยนวัตถุ',lead:'การปรับช่วงแสดงผลช่วยเน้น Contrast แต่ไม่เปลี่ยน Radiation ที่วัตถุปล่อยออกมา',body:'<p>Level เป็นตำแหน่งกึ่งกลางของช่วงแสดงผล ส่วน Span เป็นความกว้างช่วง เมื่อ Span แคบลง ความต่างเล็ก ๆ ในช่วงที่เลือกอาจมองเห็นเด่นขึ้น แต่บริเวณนอกช่วงอาจถูกตัดหรือแสดงเป็นสีสุดขอบ</p><ul><li>บันทึกการตั้งค่าที่ใช้ในการเปรียบเทียบภาพ</li><li>อย่าเทียบสีจากภาพที่ใช้ Level/Span ต่างกันโดยไม่ดู Scale</li><li>แยก Display Adjustment ออกจากการเปลี่ยนแปลงทางกายภาพ</li></ul>',note:'Level/Span เป็นการควบคุมการแสดงผล ไม่ใช่การปรับอุณหภูมิจริง',page:12,figure:12,visual:'level'}
 ],
 ch3:[
  {title:'ทำไม Thermography ใช้ช่วง Infrared?',lead:'วัตถุที่อุณหภูมิทั่วไปปล่อยพลังงานจำนวนมากในช่วง Infrared',body:'<p>การแผ่รังสีของวัตถุขึ้นกับอุณหภูมิและความยาวคลื่น การเพิ่มอุณหภูมิทำให้พลังงานการแผ่รวมเพิ่มขึ้นและตำแหน่ง Peak เลื่อนไปยังช่วงคลื่นสั้นลงตาม Wien’s Displacement Law</p><p>กล้อง Thermography ถูกออกแบบให้ตรวจจับช่วง Wavelength ที่กำหนด เช่น Short-Wave หรือ Long-Wave Infrared</p>',note:'เลือก Band ของกล้องให้เหมาะกับอุณหภูมิเป้าหมายและเงื่อนไขการตรวจ',page:24,figure:24,visual:'planck'},
  {title:'Atmospheric Window มีผลต่อการส่งผ่านรังสี',lead:'ก๊าซและไอน้ำในบรรยากาศดูดกลืน Infrared บางช่วงคลื่นมากกว่าช่วงอื่น',body:'<p>กราฟ Atmospheric Transmission ในบทเรียนแสดงว่าการส่งผ่านเปลี่ยนไปตาม Wavelength มีบางช่วงที่การส่งผ่านต่ำ จึงต้องพิจารณาการดูดกลืนของบรรยากาศเมื่อใช้กล้องที่ระยะทางหรือช่วงคลื่นต่างกัน</p><ul><li>CO₂ และ H₂O มีแถบการดูดกลืน</li><li>ระยะทางผ่านบรรยากาศเพิ่มผลของการดูดกลืนได้</li><li>การเลือกช่วงคลื่นต้องดูการตอบสนองของกล้องและสภาวะตรวจ</li></ul>',note:'อย่าคิดว่า Infrared ทุกความยาวคลื่นเดินทางผ่านอากาศได้เท่ากัน',page:26,figure:26}
 ],
 ch4:[
  {title:'Steady-State กับ Transient Heat Transfer',lead:'สองสภาวะต่างกันที่การเปลี่ยนแปลงตามเวลาของอุณหภูมิ',body:'<p><b>Steady State:</b> อุณหภูมิ ณ ตำแหน่งที่พิจารณาไม่เปลี่ยนตามเวลา แม้ยังมี Heat Flow ได้</p><p><b>Transient:</b> อุณหภูมิเปลี่ยนตามเวลา เช่น ระหว่างให้ความร้อนหรือหลังหยุดแหล่งความร้อน</p><p>สมการ Fourier แบบพื้นฐานในบทเรียนนำเสนอสำหรับ Steady-State conduction จึงต้องระวังเมื่อนำไปใช้กับกระบวนการที่อุณหภูมิเปลี่ยนตลอดเวลา</p>',note:'Thermal Imaging ที่ติดตามตามเวลาอาจเผยให้เห็น Transient Response',page:34,figure:34,visual:'heat'},
  {title:'Thermal Inertia กับ Thermal Diffusivity',lead:'ความสามารถในการเก็บพลังงานและความเร็วในการแพร่ความร้อนเป็นคนละแนวคิด',body:'<p>Thermal Inertia เกี่ยวข้องกับการตอบสนองต่อการเปลี่ยนแปลงอุณหภูมิและสัมพันธ์กับ Thermal Conductivity และ Volumetric Heat Capacity ส่วน Thermal Diffusivity (α) แสดงอัตราการแพร่กระจายการเปลี่ยนแปลงอุณหภูมิ</p><div class="formula-box">α = k / (ρcₚ) = k / VHC</div><p>วัสดุที่มี Diffusivity สูงมักปรับอุณหภูมิให้เข้าใกล้สมดุลได้เร็วกว่าเมื่อเทียบภายใต้เงื่อนไขใกล้เคียงกัน</p>',note:'อย่าสับสน Specific Heat, Volumetric Heat Capacity, Thermal Inertia และ Diffusivity',page:36,figure:38,visual:'fourier'}
 ],
 ch5:[
  {title:'Incident Radiation กับ Exitant Radiation',lead:'รังสีที่ตกกระทบและรังสีที่ออกจากพื้นผิวเป็นคนละชุดข้อมูล',body:'<p>Incident Radiation คือรังสีทั้งหมดที่กระทบวัตถุ ส่วน Exitant Radiation คือรังสีที่ออกจากวัตถุไปยังกล้องหรือสภาพแวดล้อม โดยอาจประกอบด้วย Emitted และ Reflected Radiation รวมถึง Transmitted Radiation ในกรณีที่วัสดุส่งผ่านได้</p><ul><li>สมดุลพลังงานต้องสอดคล้องกับ Absorption + Reflection + Transmission</li><li>การวัดจากกล้องเป็นรังสีที่ออกจากเป้าหมาย ไม่ใช่ Emission เพียงส่วนเดียวเสมอ</li></ul>',note:'นี่คือเหตุผลที่พื้นผิว Low Emissivity ไวต่อ Reflection',page:49,figure:49,visual:'radiation'},
  {title:'Blackbody, Greybody และ Real Surface',lead:'Blackbody เป็นแบบจำลองอุดมคติ ส่วนวัตถุจริงมี Emissivity ต่ำกว่า 1 และอาจสะท้อนรังสี',body:'<p>Blackbody ดูดกลืนรังสีตกกระทบทั้งหมดและปล่อยรังสีตามอุณหภูมิด้วย Emissivity เท่ากับ 1 ในแบบจำลอง Greybody ใช้ค่า Emissivity คงที่เพื่อประมาณวัตถุจริง แต่พื้นผิวจริงอาจขึ้นกับ Wavelength, Direction, Temperature และสภาพผิว</p><p>ดังนั้นสมการแบบ Greybody เป็นแบบจำลองภายใต้เงื่อนไข ไม่ใช่สมการครอบคลุม Radiometric Response ทุกกรณี</p>',note:'เมื่อใช้ Stefan–Boltzmann ต้องระบุว่าเป็น Blackbody หรือ Greybody และใช้ Kelvin',page:54,figure:54,visual:'radiation'}
 ],
 ch6:[
  {title:'จากรังสีไปสู่ภาพ Thermal',lead:'Thermal Image เกิดจากการตรวจจับและประมวลผลสัญญาณ ไม่ใช่การถ่ายภาพอุณหภูมิโดยตรง',body:'<p>รังสี Infrared ผ่าน Window/Lens และอาจผ่าน Filter ก่อนถึง FPA แต่ละ Detector ให้สัญญาณที่สัมพันธ์กับพลังงานรังสีในช่วงที่ระบบตอบสนอง สัญญาณถูกประมวลผลและแมปเป็น Pixel บนจอ</p><ul><li>Optics กำหนดการรวบรวมและ Focus รังสี</li><li>FPA ตรวจจับรังสีและสร้างสัญญาณหลายจุด</li><li>Processing และ Calibration สัมพันธ์กับค่าที่แสดง</li></ul>',note:'ภาพสุดท้ายขึ้นกับทั้ง Optical System, Detector, Processing และพารามิเตอร์การวัด',page:64,figure:64,visual:'camera'},
  {title:'Spatial Resolution ไม่เท่ากับ Temperature Accuracy',lead:'ภาพมี Pixel มากช่วยแยกรายละเอียดเชิงพื้นที่ แต่ไม่ได้รับประกันค่าที่วัดแม่นยำ',body:'<p>Resolution บอกจำนวน Pixel และรายละเอียดเชิงพื้นที่ ขณะที่ความแม่นยำการวัดอุณหภูมิยังขึ้นกับ Calibration, Emissivity, Reflected Apparent Temperature, ระยะทาง, Focus, Noise และเงื่อนไขอื่น</p><p>FOV คือมุมมองรวมของกล้อง ส่วน IFOV สัมพันธ์กับมุมมองของ Pixel หนึ่งหน่วยและ Pixel Footprint บนเป้าหมาย</p>',note:'อย่าสรุปว่า Camera Resolution สูงเท่ากับ Temperature Measurement แม่นยำสูง',page:69,figure:69,visual:'ifov'}
 ],
 ch7:[
  {title:'ลำดับคิดในการอ่าน Thermal Pattern',lead:'เริ่มจากตรวจคุณภาพภาพและเงื่อนไข ก่อนตีความว่าเป็นความผิดปกติ',body:'<ol><li>ตรวจ Focus, Range, Level/Span และความสมบูรณ์ของภาพ</li><li>ตรวจบริบทของชิ้นงาน Geometry และวัสดุ</li><li>เปรียบเทียบ Thermal Pattern กับบริเวณอ้างอิงที่เหมาะสม</li><li>พิจารณา Reflection, Emissivity และสิ่งแวดล้อม</li><li>สรุปเฉพาะสิ่งที่มีหลักฐานรองรับ</li></ol>',note:'หนึ่งจุดสว่างหรือมืดใน Thermogram ไม่เพียงพอที่จะยืนยัน Defect',page:74,figure:75},
  {title:'Thermal Palette และ Temperature Scale',lead:'Palette เปลี่ยนวิธีแสดงสัญญาณ แต่ไม่ได้เปลี่ยนข้อมูลทางกายภาพที่กล้องบันทึก',body:'<p>Rainbow, Iron, Grey Scale และ Palette อื่นช่วยให้มองเห็นความแตกต่างในรูปแบบต่างกัน การอ่านภาพต้องใช้ Color Bar หรือ Scale ที่แสดงอยู่ร่วมกันเสมอ</p><ul><li>อย่าเปรียบเทียบสีจากภาพต่าง Palette โดยตรง</li><li>ตรวจ Min/Max และ Span ก่อนอ่านจุดสี</li><li>ใช้ Isotherm เพื่อเน้นช่วงที่กำหนด ไม่ใช่ระบุ Defect อัตโนมัติ</li></ul>',note:'สีเป็นการเข้ารหัสข้อมูลที่จอแสดง ไม่ใช่สมบัติสีของวัตถุ',page:78,figure:78,visual:'level'}
 ],
 ch8:[
  {title:'เลือก Qualitative หรือ Quantitative ให้ตรงคำถาม',lead:'รูปแบบการวิเคราะห์ขึ้นกับผลลัพธ์ที่ต้องการและข้อกำหนดการตรวจ',body:'<p>หากต้องการค้นหาบริเวณที่มี Pattern แตกต่าง การวิเคราะห์ Qualitative อาจเหมาะสม หากต้องใช้ตัวเลขอุณหภูมิหรือเปรียบเทียบค่าปริมาณ ต้องควบคุมพารามิเตอร์และ Uncertainty แบบ Quantitative</p><ul><li>Qualitative ไม่ได้หมายถึงไม่มีเกณฑ์หรือไม่มีการควบคุม</li><li>Quantitative ต้องระบุ Emissivity และปัจจัยสะท้อนที่เกี่ยวข้อง</li><li>ทั้งสองแนวทางใช้ร่วมกันได้ตามลำดับของงาน</li></ul>',note:'ตอบให้ได้ก่อนว่าโจทย์ต้องการ “หา Pattern” หรือ “วัดค่า”',page:82,figure:82}
 ],
 ch9:[
  {title:'Emissivity กับ Reflection เกี่ยวข้องกันอย่างไร?',lead:'เมื่อพื้นผิวทึบแสงมี Emissivity ต่ำ สัดส่วนรังสีสะท้อนอาจมีอิทธิพลมากขึ้น',body:'<p>สำหรับวัตถุ Opaque ในกรอบสมดุลเชิงพลังงาน τ≈0 จึงมี α+ρ≈1 และภายใต้เงื่อนไขของ Kirchhoff ที่เหมาะสม ε≈α ดังนั้นพื้นผิว Emissivity ต่ำมักมี Reflectivity สูงกว่าในสภาวะเดียวกัน</p><p>รังสีจากผู้ตรวจ เครื่องทำความร้อน หรือวัตถุรอบข้างจึงอาจสะท้อนเข้ากล้องและทำให้ Apparent Temperature แตกต่างจากอุณหภูมิจริง</p>',note:'ε ต่ำไม่ได้แปลว่าวัตถุเย็น แต่หมายถึงสัญญาณสะท้อนอาจมีสัดส่วนสำคัญ',page:89,figure:90,visual:'radiation'},
  {title:'อย่าใช้สีพื้นผิวแทนค่า Emissivity',lead:'สีที่มองเห็นได้ด้วยตาไม่ใช่ตัวบ่งชี้ Emissivity ใน Infrared โดยตรง',body:'<p>การตอบสนองใน Visible และ Infrared เป็นคนละช่วง Wavelength วัสดุที่ดูดำด้วยตาอาจไม่ได้มี Emissivity เท่ากับ 1 ในช่วงคลื่นที่กล้องใช้ ในทางกลับกันพื้นผิวที่มองเห็นเป็นสีอ่อนก็อาจมี Emissivity สูงได้</p><ul><li>ตรวจชนิดวัสดุและ Surface Finish</li><li>อ้างอิงค่าที่ตรงกับ Wavelength และอุณหภูมิเมื่อมีข้อมูล</li><li>ใช้วิธีวัดหรือ Procedure ที่เหมาะสมเมื่อจำเป็น</li></ul>',note:'Visible Color ≠ Infrared Emissivity',page:84,figure:85}
 ],
 ch10:[
  {title:'เหตุใดต้องควบคุมสภาพแวดล้อมระหว่างวัด?',lead:'ความต่างของลม อุณหภูมิ และ Reflection อาจเปลี่ยนค่าที่อ่านได้โดยไม่เกี่ยวกับ Emissivity ของวัสดุ',body:'<p>วิธีในบทเรียนให้หลีกเลี่ยง Forced Convection และ Spot Reflection เพื่อจำกัดผลแทรกซ้อน ระหว่างการวัดควรให้ตัวอย่างมีอุณหภูมิสม่ำเสมอและเลือกตำแหน่งวัดที่เปรียบเทียบกันได้</p><ul><li>ลมทำให้ผิวเย็นหรือเปลี่ยน Transient Response</li><li>แหล่งร้อน/เย็นสะท้อนอาจรบกวน Spot Meter</li><li>เทปอ้างอิงต้องสัมผัสผิวและมีอุณหภูมิใกล้เคียงกับบริเวณวัด</li></ul>',note:'ถ้าสภาพไม่คงที่ ค่าที่ปรับให้ตรงอาจไม่ใช่ Emissivity ที่แท้จริงของผิว',page:92,figure:92},
  {title:'ค่าที่ได้เป็นค่าเฉพาะเงื่อนไขการวัด',lead:'Emissivity อาจเปลี่ยนตามสภาพผิว มุมมอง Wavelength และ Temperature',body:'<p>ค่าที่หาได้จากวิธีอ้างอิงควรบันทึกพร้อมรายละเอียดวัสดุ สภาพพื้นผิว กล้อง ช่วงคลื่น อุณหภูมิ และเงื่อนไขการวัด ไม่ควรนำไปใช้กับพื้นผิวอื่นที่มีสภาพต่างกันโดยไม่ตรวจสอบ</p>',note:'Specific Examination อาจถามทั้งขั้นตอนและข้อจำกัดของค่าที่ได้',page:93,figure:93}
 ],
 ch11:[
  {title:'Calibration ต่างจาก Image Correction',lead:'การปรับภาพให้ Detector สม่ำเสมอไม่เท่ากับการสอบเทียบอุณหภูมิ',body:'<p>กล้องอาจมีการทำ Non-Uniformity Correction (NUC) เพื่อชดเชยความแตกต่างของ Detector Elements ส่วน Calibration สร้างความสัมพันธ์ระหว่างสัญญาณกับอุณหภูมิอ้างอิง ทั้งสองกระบวนการมีวัตถุประสงค์ต่างกัน</p><ul><li>NUC แก้ความไม่สม่ำเสมอของภาพ</li><li>Calibration อ้างอิงค่าการวัดกับแหล่งมาตรฐาน</li><li>การตรวจสอบระยะ Calibration ต้องอิงคู่มือและระบบคุณภาพที่ใช้</li></ul>',note:'ห้ามตีความการทำ NUC หรือ Shutter Correction ว่าเป็น Calibration Certificate',page:95,figure:95},
  {title:'ความไม่แน่นอนยังคงมีหลัง Calibration',lead:'Calibration เป็นส่วนหนึ่งของระบบการวัด ไม่ใช่การกำจัด Error ทุกประเภท',body:'<p>แม้กล้องได้รับ Calibration แล้ว ค่าที่วัดยังอาจได้รับผลจาก Emissivity, Reflection, ระยะ, Atmospheric Transmission, Focus, Detector Noise และการตั้งค่าของผู้ใช้</p><p>การวัดที่เชื่อถือได้จึงต้องพิจารณา Calibration Status ร่วมกับ Measurement Conditions</p>',note:'Calibration accuracy และ Measurement accuracy เป็นคนละประเด็นที่สัมพันธ์กัน',page:96,figure:96}
 ],
 ch12:[
  {title:'วิธีอ่านสมการอย่างเป็นระบบ',lead:'เข้าใจสิ่งที่สมการคำนวณ สมมติฐาน และหน่วยก่อนแทนตัวเลข',body:'<ol><li>ระบุว่าเป็น Heat Transfer Rate, Radiant Exitance หรือ Wavelength</li><li>เขียนค่าที่โจทย์ให้พร้อมหน่วย</li><li>แปลงเป็น SI และ Kelvin เมื่อจำเป็น</li><li>แทนค่าตามสมการและแสดงขั้นตอน</li><li>ตรวจมิติหน่วยและความสมเหตุสมผลของผลลัพธ์</li></ol>',note:'Q̇ มีหน่วย W ส่วน M มีหน่วย W/m² และ λ มีหน่วยความยาว เช่น µm',page:97,figure:97},
  {title:'สมการมีขอบเขตการใช้',lead:'สูตรพื้นฐานช่วยอธิบายหลักการ แต่ไม่แทน Radiometric Model ของกล้องโดยตรง',body:'<p>Fourier และ Newton เป็นแบบจำลองการถ่ายเทภายใต้เงื่อนไขที่กำหนด ส่วน Stefan–Boltzmann ในรูป Greybody เป็นการประมาณการแผ่รังสีรวม การคำนวณจาก Thermographic Camera จริงต้องพิจารณาช่วงคลื่น การตอบสนอง Detector และ Radiation จากสิ่งแวดล้อม</p>',note:'ข้อสอบอาจทดสอบทั้งการแทนค่าสูตรและการรู้ข้อจำกัดของสมการ',page:99,figure:99,visual:'planck'}
 ],
 appA:[
  {title:'Active Thermography: Heat Response over Time',lead:'การกระตุ้นความร้อนทำให้ความผิดปกติบางชนิดสร้างรูปแบบการตอบสนองต่างจากบริเวณปกติ',body:'<p>หลังให้พลังงานกับชิ้นงาน ความร้อนแพร่กระจายผ่านวัสดุ ความไม่ต่อเนื่อง เช่น Delamination หรือ Disbond อาจเปลี่ยนเส้นทางการแพร่และทำให้ Thermal Response บนผิวแตกต่างออกไป</p><ul><li>ชนิด Excitation ส่งผลต่อรูปแบบเวลา</li><li>คุณสมบัติวัสดุและความลึกมีผลต่อ Response</li><li>การแปลผลต้องสัมพันธ์กับ Technique และ Reference Data</li></ul>',note:'Active Thermography อ่าน “การตอบสนองหลังการกระตุ้น” ไม่ใช่แค่ภาพอุณหภูมิภาพเดียว',page:102,figure:102,visual:'heat'},
  {title:'เลือก Technique ตามรูปแบบการกระตุ้น',lead:'Flash, Step Heating, Lock-in และ Vibrothermography สร้าง Thermal Response ต่างกัน',body:'<p><b>Flash:</b> ให้พลังงานช่วงสั้นแล้วติดตามการเย็นตัว <b>Step Heating:</b> ให้พลังงานคงที่ช่วงหนึ่ง <b>Lock-in:</b> กระตุ้นแบบเป็นคาบและวิเคราะห์การตอบสนองตาม Phase/Amplitude <b>Vibrothermography:</b> ใช้การสั่นเพื่อสร้างความร้อนเฉพาะจุดในบางสภาวะ</p><p>การเลือก Technique ต้องพิจารณาวัสดุ รูปทรง ข้อจำกัดอุปกรณ์ และวัตถุประสงค์</p>',note:'Technique เหล่านี้ไม่สามารถใช้แทนกันได้โดยไม่มีการพิจารณา',page:103,figure:103}
 ],
 appB:[
  {title:'Method, Technique, Procedure และ Instruction',lead:'คำศัพท์สี่คำนี้มีระดับความเฉพาะเจาะจงต่างกัน',body:'<ul><li><b>Method:</b> วิธี NDT โดยรวม เช่น Thermography</li><li><b>Technique:</b> รูปแบบการใช้ Method เช่น Flash Thermography</li><li><b>Procedure:</b> เอกสารควบคุมวิธีดำเนินการตรวจตามข้อกำหนด</li><li><b>Instruction:</b> คำสั่งหรือลำดับงานที่ใช้กับงาน/ชิ้นส่วนเฉพาะตามระบบเอกสาร</li></ul><p>การใช้คำเหล่านี้ให้ชัดช่วยแยกความรู้ทั่วไปออกจากข้อกำหนดของงานเฉพาะ</p>',note:'คำศัพท์และการจัดชั้นเอกสารให้ยึดระบบควบคุมเอกสารขององค์กรที่ใช้งาน',page:104,figure:104},
  {title:'การอ่าน Inspection Instruction อย่างมีวิจารณญาณ',lead:'ต้องตรวจสอบ Revision, Scope, Equipment, Parameter และข้อกำหนดก่อนนำไปอ้างอิง',body:'<p>ตัวอย่างใน Appendix B ให้ข้อมูลชิ้นงาน เครื่องมือ สภาวะแวดล้อม การตั้งค่า และลำดับการตรวจ ผู้เรียนควรสังเกตว่าแต่ละค่าผูกกับ Component และ Instruction ฉบับนั้น ไม่ใช่ค่าทั่วไปของ Thermography</p><ul><li>ตรวจ Document Number และ Revision</li><li>ตรวจ Scope และ Component Identification</li><li>แยก Parameter ที่มาจากเนื้อหาบทเรียนออกจากหลักการทั่วไป</li><li>บันทึกความไม่สอดคล้องเพื่อขอการยืนยันจากเจ้าของเอกสาร</li></ul>',note:'คู่มือมีความไม่สอดคล้องของเลข Instruction ระหว่างในกรณีศึกษานี้ ให้คงข้อสังเกตนี้ไว้',page:109,figure:109}
 ]
};
